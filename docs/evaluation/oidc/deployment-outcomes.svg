<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="30" y="35" font-size="22">Post-OIDC deployment outcomes — pgvector</text><text x="30" y="65" font-size="14">Observed outcomes include failures and retries; repeated attempts are not independent trials.</text><text x="30" y="147" font-size="19">AWS</text><rect x="180" y="125" width="90" height="40" fill="#16856b"/><rect x="270" y="125" width="270" height="40" fill="#c96626"/><text x="180" y="190" font-size="14">1/4 succeeded (25.0%); 3 failed</text><text x="30" y="257" font-size="19">AZURE</text><rect x="180" y="235" width="180" height="40" fill="#16856b"/><rect x="360" y="235" width="360" height="40" fill="#c96626"/><text x="180" y="300" font-size="14">2/6 succeeded (33.3%); 4 failed</text><text x="30" y="380" font-size="14">Green = succeeded; orange = failed. One segment unit = one database attempt.</text></g></svg>