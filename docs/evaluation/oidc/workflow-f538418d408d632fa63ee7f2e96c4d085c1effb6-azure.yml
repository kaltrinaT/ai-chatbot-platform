name: Deploy Tenant (Azure)
# The deployment ID in the run name lets the platform find this run by
# display_title if the "run started" callback below never arrives.
run-name: "Deploy ${{ inputs.tenant_slug }} (Azure) [${{ inputs.deployment_id }}]"

# workflow_dispatch's input limit was 10 when this was designed (raised to 25
# in December 2025), so non-secret per-tenant settings travel packed in one
# JSON `config` input (see buildAzureInputs in src/lib/deploy.ts, which must
# stay in sync with the "Parse tenant config" step below). your_ecr_image /
# your_frontend_ecr_image below are operator-level values, not per-tenant
# config, so — like AWS's deploy-tenant.yml — they travel as plain inputs
# instead of being packed into `config`.
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Platform deployment row UUID (status callbacks post to it)"
        required: true
      tenant_id:
        description: "Platform tenant row UUID. Names the GitHub environment the job runs in, which is the subject the customer's federated credential trusts"
        required: true
      tenant_slug:
        description: "Tenant identifier (3-18 chars, lowercase, hyphens ok — e.g. acme-corp)"
        required: true
      config:
        description: 'JSON: {"azure_subscription_id","azure_tenant_id","azure_client_id","azure_region","llm_provider","llm_model","chatbot_version","domain","vector_store"}'
        required: true
      # No secret is an input. GitHub records dispatch inputs in the run's
      # event payload, readable by anyone with access to this repository, so
      # the tenant's application secrets are fetched from the platform by the
      # run itself — see "Fetch tenant secrets" below.
      your_ecr_image:
        description: "Source backend image URI in the platform's ECR (with tag) — same golden image AWS deploys replicate"
        required: true
      your_frontend_ecr_image:
        description: "Source frontend (chat UI) image URI in the platform's ECR (with tag) — same golden image AWS deploys replicate"
        required: true

env:
  TF_DIR: infra/terraform/azure

jobs:
  deploy:
    name: Deploy chatbot-${{ inputs.tenant_slug }}
    runs-on: ubuntu-latest
    # The customer's subscription is reached with no stored credential. Their
    # identity carries a federated credential trusting GitHub's OIDC token for
    # exactly this subject:
    #
    #   repo:<owner>/<repo>:environment:tenant-<tenant_id>
    #
    # GitHub puts the environment name into the token's `sub` claim, so each
    # tenant's runs carry a subject no other tenant's credential accepts. A
    # branch subject would be identical for every customer (see
    # src/lib/azureFederation.ts, which builds the subject the wizard shows and
    # must stay in sync with this line). The environment is created on first
    # use and needs no configuration.
    #
    # Private repositories need GitHub Pro, Team or Enterprise for
    # environments. Without them this fails closed: the token carries no
    # environment, the subject does not match, and Entra refuses the login.
    environment: tenant-${{ inputs.tenant_id }}
    # One run at a time per tenant, across all four deploy and teardown
    # workflows on both clouds: they share this group name, so a redeploy and
    # a teardown of the same tenant queue behind each other instead of running
    # Terraform against the same state at once. Never cancel-in-progress — a
    # half-applied Terraform run is worse than a delayed one. The platform
    # enforces the same rule before dispatching (deployments_one_active_per_tenant
    # in src/db/schema.ts); this covers a run started by hand in GitHub too.
    concurrency:
      group: tenant-${{ inputs.tenant_id }}
      cancel-in-progress: false
    # id-token: write is what lets GitHub issue the OIDC token, used twice
    # here: for the platform's AWS role, and for the customer's Azure identity.
    # No step uses the job token for the GitHub API, so dropping the other
    # scopes removes nothing.
    permissions:
      id-token: write
      contents: read
    # Raised from 30 for the same reasons as the AWS deploy job: the apply
    # now waits on container health probes, and the bootstrap phase adds a
    # deliberate pause for the identity's registry grant to propagate.
    #
    # Keep this under an hour. `az` cannot refresh a federated login: it holds
    # the access token Entra issued at login, which lasts 60-90 minutes, and
    # the late `az` steps (ACR push, Function deploy) would fail past that.
    # Terraform is unaffected, since the provider requests a fresh GitHub
    # token whenever it needs one.
    timeout-minutes: 45

    steps:
      # Report the run ID to the platform immediately so the tenant page can
      # poll live progress. Best-effort: a platform outage must not fail the
      # customer's deploy.
      - name: Notify platform — run started
        continue-on-error: true
        run: |
          cat > /tmp/callback.json <<EOF
          {
            "status": "running",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'running' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
            exit 1
          fi

      # The LLM key, the customer's Pinecone key and the docs-signer secret.
      # The platform releases them only to a run that proves, with a GitHub
      # OIDC token, that it is this workflow running in this tenant's
      # environment — the same subject the customer's federated credential
      # trusts — and only once per deployment (src/lib/deploymentSecrets.ts).
      # The audience is the platform's own, so this token is useless to a
      # cloud and a cloud-login token is useless here.
      #
      # The values go to a file readable only by the runner user, never to
      # $GITHUB_ENV, which would hand them to every later step including
      # third-party actions. Only the Terraform steps source it.
      - name: Fetch tenant secrets from the platform
        env:
          AUDIENCE: ai-chatbot-platform:tenant-secrets
        run: |
          set -euo pipefail
          umask 077
          audience=$(jq -rn --arg a "$AUDIENCE" '$a|@uri')
          token=$(curl -sS --fail --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r '.value')
          echo "::add-mask::${token}"
          out="$RUNNER_TEMP/tenant-secrets.json"
          code=$(curl -sS --max-time 15 -o "$out" -w '%{http_code}' -X POST \
            -H "authorization: Bearer ${token}" \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/secrets") || code=000
          if [ "$code" != "200" ]; then
            reason=$(jq -r '.error // empty' "$out" 2>/dev/null | head -c 300 || true)
            rm -f "$out"
            echo "::error title=Tenant secrets refused::HTTP $code from the platform. ${reason}"
            exit 1
          fi
          for key in llmApiKey pineconeApiKey docsSignerSecret; do
            value=$(jq -r --arg k "$key" '.[$k] // ""' "$out")
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
          done
          # The pinecone provider requires a non-empty credential to
          # initialize even when vector_store = pgvector, where count = 0
          # means no Pinecone resources are created and the value is unused.
          jq -r '
            "export TF_VAR_llm_api_key=\(.llmApiKey | @sh)",
            "export TF_VAR_pinecone_api_key=\((if (.pineconeApiKey // "") == "" then "unused" else .pineconeApiKey end) | @sh)",
            "export TF_VAR_docs_signer_secret=\(.docsSignerSecret | @sh)"
          ' "$out" > "$RUNNER_TEMP/tenant-secrets.env"
          rm -f "$out"

      - name: Parse tenant config
        id: cfg
        env:
          CONFIG_JSON: ${{ inputs.config }}
        run: |
          echo "$CONFIG_JSON" | jq -e 'has("azure_subscription_id") and has("azure_tenant_id") and has("azure_client_id")' > /dev/null
          {
            echo "azure_subscription_id=$(echo "$CONFIG_JSON" | jq -r '.azure_subscription_id')"
            echo "azure_tenant_id=$(echo "$CONFIG_JSON" | jq -r '.azure_tenant_id')"
            echo "azure_client_id=$(echo "$CONFIG_JSON" | jq -r '.azure_client_id')"
            echo "azure_region=$(echo "$CONFIG_JSON" | jq -r '.azure_region // "eastus"')"
            echo "llm_provider=$(echo "$CONFIG_JSON" | jq -r '.llm_provider')"
            echo "llm_model=$(echo "$CONFIG_JSON" | jq -r '.llm_model // ""')"
            echo "chatbot_version=$(echo "$CONFIG_JSON" | jq -r '.chatbot_version // "latest"')"
            echo "domain=$(echo "$CONFIG_JSON" | jq -r '.domain // ""')"
            echo "vector_store=$(echo "$CONFIG_JSON" | jq -r '.vector_store // "pinecone"')"
            echo "retrieval_min_score=$(echo "$CONFIG_JSON" | jq -r '.retrieval_min_score // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Compute resource names
        id: names
        run: |
          SLUG="${{ inputs.tenant_slug }}"
          ACR_NAME=$(echo "chatbot${SLUG}" | tr -d '-' | cut -c1-50)
          IMAGE_URI="${ACR_NAME}.azurecr.io/chatbot-backend:${{ steps.cfg.outputs.chatbot_version }}"
          FRONTEND_URI="${ACR_NAME}.azurecr.io/chatbot-frontend:${{ steps.cfg.outputs.chatbot_version }}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "frontend_uri=${FRONTEND_URI}" >> "$GITHUB_OUTPUT"

          # Source registry lives in the platform's ECR; ECR auth tokens are
          # region-specific, so derive the actual region from the URI itself
          # instead of assuming it matches the tenant's target Azure region
          # (deploy-tenant.yml derives it the same way).
          SOURCE_REGISTRY=$(echo "${{ inputs.your_ecr_image }}" | cut -d/ -f1)
          SOURCE_REGION=$(echo "$SOURCE_REGISTRY" | cut -d. -f4)
          echo "source_registry=${SOURCE_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "source_region=${SOURCE_REGION}" >> "$GITHUB_OUTPUT"

      # Pull the same platform golden image AWS deploys replicate — see
      # deploy-tenant.yml for the AWS-side twin of these two steps.
      # OIDC, not a stored key. The platform-role credentials pull the golden
      # images, and that is all they are used for on this path.
      - name: Configure AWS credentials (platform role via OIDC — ECR read)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLATFORM_DEPLOY_ROLE_ARN }}
          role-session-name: platform-azure-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ steps.names.outputs.source_region }}

      - name: Pull source images (backend + frontend)
        run: |
          aws ecr get-login-password --region ${{ steps.names.outputs.source_region }} \
            | docker login --username AWS --password-stdin "${{ steps.names.outputs.source_registry }}"
          docker pull "${{ inputs.your_ecr_image }}"
          docker pull "${{ inputs.your_frontend_ecr_image }}"

      # No client secret: azure/login exchanges this job's GitHub OIDC token
      # for an Entra access token on the customer's identity. It fails here,
      # before anything is created, when the customer has not added the
      # federated credential or added it with a different subject.
      - name: Azure login (customer subscription, federated credential)
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ steps.cfg.outputs.azure_client_id }}
          tenant-id: ${{ steps.cfg.outputs.azure_tenant_id }}
          subscription-id: ${{ steps.cfg.outputs.azure_subscription_id }}

      # The same pinned version as the AWS workflows.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      # State lives in the customer's own subscription, in the storage account
      # their bootstrap creates, reached through Entra ID with this run's OIDC
      # token and locked with a blob lease while the run holds it. See
      # .github/scripts/terraform-init-azure.sh.
      - name: Terraform init (state in the customer's subscription)
        working-directory: ${{ env.TF_DIR }}
        env:
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.cfg.outputs.azure_subscription_id }}
          AZURE_TENANT_ID: ${{ steps.cfg.outputs.azure_tenant_id }}
          AZURE_CLIENT_ID: ${{ steps.cfg.outputs.azure_client_id }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/terraform-init-azure.sh"

      # Creates what must exist before the Container App can: the registry to
      # push into, and the chatbot's user-assigned identity with AcrPull on it.
      # The identity has to come first because the app's very first revision
      # pulls its image as that identity (see azurerm_user_assigned_identity
      # .chatbot in main.tf for why it cannot be system-assigned).
      #
      # The resource group is not targeted here and must not be: the customer's
      # bootstrap deployment creates it, and Terraform only reads it (see the
      # data source in main.tf). Targeting a data source is an error, and a
      # deploy run before the bootstrap fails on that read — which the
      # connection check catches first.
      # Sources every secret variable even though this bootstrap apply creates
      # none of the Key Vault secrets — Terraform resolves every variable
      # regardless of -target, and prompts (hanging the job) if one is missing.
      - name: "Terraform apply — bootstrap registry and chatbot identity"
        working-directory: ${{ env.TF_DIR }}
        run: |
          source "$RUNNER_TEMP/tenant-secrets.env"
          terraform apply -auto-approve \
            -target=azurerm_container_registry.this \
            -target=azurerm_user_assigned_identity.chatbot \
            -target=azurerm_role_assignment.chatbot_acr_pull \
            -var="platform_origin=${{ secrets.PLATFORM_BASE_URL }}" \
            -var="tenant_slug=${{ inputs.tenant_slug }}" \
            -var="azure_subscription_id=${{ steps.cfg.outputs.azure_subscription_id }}" \
            -var="azure_tenant_id=${{ steps.cfg.outputs.azure_tenant_id }}" \
            -var="azure_client_id=${{ steps.cfg.outputs.azure_client_id }}" \
            -var="azure_region=${{ steps.cfg.outputs.azure_region }}" \
            -var="llm_provider=${{ steps.cfg.outputs.llm_provider }}" \
            -var="llm_model=${{ steps.cfg.outputs.llm_model }}" \
            -var="domain=${{ steps.cfg.outputs.domain }}" \
            -var="vector_store=${{ steps.cfg.outputs.vector_store }}" \
            -var="image_uri=placeholder" \
            -var="frontend_image_uri=placeholder"

      # The bootstrap apply just granted the chatbot identity AcrPull. Azure
      # RBAC is eventually consistent, and the full apply below creates a
      # Container App whose very first revision pulls its image with that
      # grant; if it has not propagated yet, the revision fails to start and
      # the apply fails with it. The image push below adds further delay on
      # top of this, so this is a floor rather than the whole budget.
      - name: Allow the AcrPull grant to propagate
        run: sleep 90

      - name: Log in to ACR
        run: az acr login --name ${{ steps.names.outputs.acr_name }}

      # Retried, because a registry's network blips on its own: one deploy
      # pushed the backend, then had the frontend's manifest refused with
      # "connect: connection refused", and failed a run that was otherwise
      # fine. A push is idempotent, so trying again is safe.
      - name: Retag and push images to tenant ACR
        run: |
          push() {
            for attempt in 1 2 3; do
              docker push "$1" && return 0
              echo "::warning::Pushing $1 failed (attempt $attempt of 3); retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
            done
            return 1
          }
          docker tag "${{ inputs.your_ecr_image }}" "${{ steps.names.outputs.image_uri }}"
          push "${{ steps.names.outputs.image_uri }}"
          docker tag "${{ inputs.your_frontend_ecr_image }}" "${{ steps.names.outputs.frontend_uri }}"
          push "${{ steps.names.outputs.frontend_uri }}"

      - name: "Terraform apply — full deploy"
        working-directory: ${{ env.TF_DIR }}
        run: |
          source "$RUNNER_TEMP/tenant-secrets.env"
          terraform apply -auto-approve \
            -var="tenant_slug=${{ inputs.tenant_slug }}" \
            -var="azure_subscription_id=${{ steps.cfg.outputs.azure_subscription_id }}" \
            -var="azure_tenant_id=${{ steps.cfg.outputs.azure_tenant_id }}" \
            -var="azure_client_id=${{ steps.cfg.outputs.azure_client_id }}" \
            -var="azure_region=${{ steps.cfg.outputs.azure_region }}" \
            -var="llm_provider=${{ steps.cfg.outputs.llm_provider }}" \
            -var="llm_model=${{ steps.cfg.outputs.llm_model }}" \
            -var="domain=${{ steps.cfg.outputs.domain }}" \
            -var="vector_store=${{ steps.cfg.outputs.vector_store }}" \
            -var="retrieval_min_score=${{ steps.cfg.outputs.retrieval_min_score }}" \
            -var="image_uri=${{ steps.names.outputs.image_uri }}" \
            -var="frontend_image_uri=${{ steps.names.outputs.frontend_uri }}" \
            -var="platform_origin=${{ secrets.PLATFORM_BASE_URL }}" \
            -var="extra_cors_origin=${{ vars.EXTRA_CORS_ORIGIN }}" \
            -var="revision_suffix=r${{ github.run_id }}-${{ github.run_attempt }}"

      # Nothing after Terraform needs them. The runner is discarded after the
      # job anyway; this keeps the secrets off disk for the steps that remain,
      # which include third-party actions.
      - name: Remove tenant secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/tenant-secrets.env" "$RUNNER_TEMP/tenant-secrets.json"

      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "chatbot_url=$(terraform output -raw chatbot_url)" >> "$GITHUB_OUTPUT"
          echo "fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "docs_signer_url=$(terraform output -raw docs_signer_url)" >> "$GITHUB_OUTPUT"
          echo "docs_signer_function_app_name=$(terraform output -raw docs_signer_function_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> "$GITHUB_OUTPUT"
          echo "storage_container_name=$(terraform output -raw storage_container_name)" >> "$GITHUB_OUTPUT"
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chatbot URL:** $(terraform output -raw chatbot_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install docs-signer Function dependencies
        working-directory: infra/azure-functions/docs-signer
        run: npm install --production

      - name: Deploy docs-signer Function code
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.tf.outputs.docs_signer_function_app_name }}
          package: infra/azure-functions/docs-signer

      # Durable copy of the outputs above, independent of the webhook below —
      # if PLATFORM_BASE_URL is unreachable or the POST is otherwise lost,
      # the platform's self-heal reconciliation recovers these from this
      # artifact instead of losing them until the next redeploy.
      - name: Upload deployment outputs
        if: success()
        run: |
          cat > outputs.json <<EOF
          {
            "chatbotUrl": "${{ steps.tf.outputs.chatbot_url }}",
            "albDnsName": "${{ steps.tf.outputs.fqdn }}",
            "docsSignerUrl": "${{ steps.tf.outputs.docs_signer_url }}",
            "azureResourceGroup": "${{ steps.tf.outputs.resource_group_name }}",
            "azureStorageAccount": "${{ steps.tf.outputs.storage_account_name }}",
            "azureStorageContainer": "${{ steps.tf.outputs.storage_container_name }}",
            "azureKeyVaultName": "${{ steps.tf.outputs.key_vault_name }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deployment-outputs-${{ inputs.deployment_id }}
          path: outputs.json
          retention-days: 90

      - name: Notify platform — success
        if: success()
        run: |
          cat > /tmp/callback.json <<EOF
          {
            "status": "succeeded",
            "chatbotUrl": "${{ steps.tf.outputs.chatbot_url }}",
            "albDnsName": "${{ steps.tf.outputs.fqdn }}",
            "docsSignerUrl": "${{ steps.tf.outputs.docs_signer_url }}",
            "azureResourceGroup": "${{ steps.tf.outputs.resource_group_name }}",
            "azureStorageAccount": "${{ steps.tf.outputs.storage_account_name }}",
            "azureStorageContainer": "${{ steps.tf.outputs.storage_container_name }}",
            "azureKeyVaultName": "${{ steps.tf.outputs.key_vault_name }}",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'succeeded' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
          fi

      # A refused federated login is the one failure the operator can resolve
      # without reading the run's logs, and the one a customer setting up a
      # new tenant is most likely to hit, so it gets its own message naming
      # the exact subject the credential has to trust.
      - name: Notify platform — failure
        if: failure()
        env:
          LOGIN_FAILED: ${{ steps.azure-login.outcome == 'failure' }}
          SUBJECT: repo:${{ github.repository }}:environment:tenant-${{ inputs.tenant_id }}
        run: |
          if [ "$LOGIN_FAILED" = "true" ]; then
            MESSAGE="Azure refused the federated login for client ${{ steps.cfg.outputs.azure_client_id }}. Add a federated credential to that identity with issuer https://token.actions.githubusercontent.com, audience api://AzureADTokenExchange and subject ${SUBJECT}, then redeploy."
          else
            MESSAGE="Azure workflow run ${{ github.run_id }} failed; see GitHub Actions logs."
          fi
          cat > /tmp/callback.json <<EOF
          {
            "status": "failed",
            "errorMessage": "${MESSAGE}",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'failed' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
          fi
