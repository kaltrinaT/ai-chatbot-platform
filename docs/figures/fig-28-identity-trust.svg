<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 892" width="960" height="892" role="img" aria-label="Identity trust graph. The platform app reaches AWS only through its platform role, which may assume each customer’s write-only onboarding role under that tenant’s ExternalId and is refused by the deploy role. Deploys reach both clouds as a GitHub Actions run whose OIDC subject names one tenant’s environment, which the customer’s deploy role and federated credential each match exactly; the deploy identities in turn create the runtime identities that touch documents.">
  <rect x="0" y="0" width="960" height="892" fill="#ffffff"/>
  <defs><marker id="f-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker><marker id="o-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#16181d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="f-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="928" height="184" rx="6" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><text x="28" y="38" font-size="13" font-weight="bold" fill="#3d4350">PLATFORM</text><text x="110" y="38" font-size="12" fill="#5b6270">run by its owner</text><rect x="446" y="48" width="486" height="144" rx="4" fill="#f9fafc" stroke="#3d4350" stroke-width="1"/><text x="458" y="66" font-size="11.5" font-weight="bold" fill="#b4540a">PLATFORM AWS ACCOUNT</text><rect x="16" y="212" width="928" height="120" rx="6" fill="#f7f7f4" stroke="#c9c8bf" stroke-width="1.2"/><text x="28" y="236" font-size="13" font-weight="bold" fill="#3d4350">GITHUB</text><text x="28" y="254" font-size="12" fill="#5b6270">the deploy</text><text x="28" y="268" font-size="12" fill="#5b6270">repository is</text><text x="28" y="282" font-size="12" fill="#5b6270">the trust anchor</text><rect x="16" y="346" width="446" height="252" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/><text x="28" y="572" font-size="12" font-weight="bold" fill="#1f5fae">CUSTOMER AZURE SUBSCRIPTION</text><text x="28" y="587" font-size="12" fill="#5b6270">no onboarding identity: the platform makes no Azure call</text><rect x="474" y="346" width="470" height="252" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/><text x="486" y="572" font-size="12" font-weight="bold" fill="#b4540a">CUSTOMER AWS ACCOUNT</text><text x="486" y="587" font-size="12" fill="#5b6270">one deploy role and one onboarding role per tenant</text><rect x="28" y="70" width="122" height="62" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="90" font-size="13.5" font-weight="bold" fill="#16181d">Operator</text><text x="40" y="107" font-size="12" fill="#5b6270">a person with a</text><text x="40" y="121" font-size="12" fill="#5b6270">GitHub account</text><rect x="186" y="64" width="236" height="90" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="198" y="84" font-size="13.5" font-weight="bold" fill="#16181d">Platform app</text><text x="198" y="101" font-size="12" fill="#5b6270">Next.js on Vercel, production</text><text x="198" y="115" font-size="12" fill="#5b6270">holds GITHUB_PAT, the webhook</text><text x="198" y="129" font-size="12" fill="#5b6270">secret and the signer secrets</text><text x="198" y="143" font-size="12" fill="#5b6270">(encrypted); no cloud credential</text><rect x="458" y="78" width="222" height="76" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="470" y="98" font-size="13.5" font-weight="bold" fill="#16181d">Image-pull role</text><text x="470" y="115" font-size="12" fill="#5b6270">used by deploy runs to pull</text><text x="470" y="129" font-size="12" fill="#5b6270">the golden images; assumes</text><text x="470" y="143" font-size="12" fill="#5b6270">no customer role</text><rect x="700" y="78" width="220" height="76" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="712" y="98" font-size="13.5" font-weight="bold" fill="#16181d">Platform role</text><text x="712" y="115" font-size="12" fill="#5b6270">the app’s only AWS identity:</text><text x="712" y="129" font-size="12" fill="#5b6270">may assume chatbot-client-</text><text x="712" y="143" font-size="12" fill="#5b6270">onboard-* roles, nothing else</text><polyline points="150,100 186,100" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="168" cy="86" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="168" y="89.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><polyline points="404,64 404,34 810,34 810,78" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="607" cy="34" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="607" y="37.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><rect x="186" y="228" width="514" height="76" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="198" y="248" font-size="13.5" font-weight="bold" fill="#16181d">Workflow run in GitHub environment tenant-{id}</text><text x="198" y="265" font-size="12" fill="#5b6270">each job gets a GitHub-signed OIDC token whose subject is</text><text x="198" y="279" font-size="11.5" font-family="Consolas, 'Courier New', monospace" fill="#3d4350">repo:{owner}/{repo}:environment:tenant-{id}</text><text x="198" y="293" font-size="12" fill="#5b6270">whoever controls the workflows can name any tenant (limitation 8)</text><polyline points="230,154 230,228" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><circle cx="230" cy="182" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="230" y="185.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><polyline points="316,228 316,154" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><circle cx="316" cy="182" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="316" y="185.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><polyline points="390,228 390,154" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><circle cx="390" cy="182" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="390" y="185.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text><polyline points="640,228 640,154" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="640" cy="206" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="640" y="209.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><rect x="28" y="362" width="422" height="91" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="40" y="382" font-size="13.5" font-weight="bold" fill="#16181d">Deploy identity</text><text x="40" y="398" font-size="11" font-family="Consolas, 'Courier New', monospace" fill="#3d4350">chatbot-deploy-{slug}  (user-assigned managed identity)</text><text x="40" y="414" font-size="12" fill="#5b6270">federated credential: GitHub issuer, this tenant’s subject only</text><text x="40" y="428" font-size="12" fill="#5b6270">Contributor + User Access Administrator on chatbot-{slug}:</text><text x="40" y="442" font-size="12" fill="#5b6270">everything in that group, nothing outside it</text><rect x="28" y="477" width="422" height="62" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="40" y="497" font-size="13.5" font-weight="bold" fill="#16181d">Runtime identities</text><text x="40" y="514" font-size="12" fill="#5b6270">chatbot (user-assigned): pull images, read documents</text><text x="40" y="528" font-size="12" fill="#5b6270">docs-signer (system-assigned): write and delete, never read</text><rect x="486" y="362" width="222" height="91" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="498" y="382" font-size="13.5" font-weight="bold" fill="#16181d">Deploy role</text><text x="498" y="398" font-size="11" font-family="Consolas, 'Courier New', monospace" fill="#3d4350">chatbot-client-deploy-{slug}</text><text x="498" y="414" font-size="12" fill="#5b6270">trusts one GitHub subject;</text><text x="498" y="428" font-size="12" fill="#5b6270">builds the chatbot, so it can</text><text x="498" y="442" font-size="12" fill="#5b6270">read its documents and secrets</text><rect x="720" y="362" width="212" height="91" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="732" y="382" font-size="13.5" font-weight="bold" fill="#16181d">Onboarding role</text><text x="732" y="398" font-size="11" font-family="Consolas, 'Courier New', monospace" fill="#3d4350">chatbot-client-onboard-{slug}</text><text x="732" y="414" font-size="12" fill="#5b6270">trusts the platform account</text><text x="732" y="428" font-size="12" fill="#5b6270">with ExternalId = tenant id</text><text x="732" y="442" font-size="12" fill="#5b6270">may write secrets, read none</text><rect x="486" y="477" width="446" height="77" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="498" y="497" font-size="13.5" font-weight="bold" fill="#16181d">Runtime roles</text><text x="498" y="513" font-size="11" font-family="Consolas, 'Courier New', monospace" fill="#3d4350">chatbot-{slug}-*</text><text x="498" y="529" font-size="12" fill="#5b6270">assumable only by ECS tasks and Lambda, capped by a boundary</text><text x="498" y="543" font-size="12" fill="#5b6270">task: list and read documents · signer: write and delete, never read</text><polyline points="300,304 300,362" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="300" cy="339" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="342.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><polyline points="600,304 600,362" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="600" cy="339" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="600" y="342.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><polyline points="860,154 860,362" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="860" cy="270" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="860" y="273.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><polyline points="716,154 716,338 680,338 680,362" fill="none" stroke="#a13b12" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-warn)"/><circle cx="716" cy="270" r="9" fill="#a13b12" stroke="#ffffff" stroke-width="1.5"/><text x="716" y="273.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">✕</text><polyline points="597,453 597,477" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="619" cy="465" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="619" y="468.8" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">10</text><polyline points="240,453 240,477" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><circle cx="262" cy="465" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="262" y="468.8" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">11</text><text x="52" y="628" font-size="11.5" font-weight="bold" fill="#3d4350">Edge</text><text x="280" y="628" font-size="11.5" font-weight="bold" fill="#3d4350">How</text><text x="540" y="628" font-size="11.5" font-weight="bold" fill="#3d4350">Bound to</text><line x1="20" y1="634" x2="940" y2="634" stroke="#c9ccd2" stroke-width="1"/><circle cx="37" cy="651" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="654.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="52" y="655" font-size="11.5" fill="#16181d">Operator → platform app</text><text x="280" y="655" font-size="11.5" fill="#5b6270">GitHub OAuth sign-in</text><text x="540" y="655" font-size="11.5" fill="#3d4350">a database session; an e-mail allow-list when one is set</text><circle cx="37" cy="668" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="671.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="52" y="672" font-size="11.5" fill="#16181d">Platform app → platform role</text><text x="280" y="672" font-size="11.5" fill="#5b6270">Vercel OIDC, or the operator’s AWS sign-in</text><text x="540" y="672" font-size="11.5" fill="#3d4350">subject names the production deployment; temporary credentials only</text><circle cx="37" cy="685" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="688.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="52" y="689" font-size="11.5" fill="#16181d">Platform role → onboarding role</text><text x="280" y="689" font-size="11.5" fill="#5b6270">sts:AssumeRole</text><text x="540" y="689" font-size="11.5" fill="#3d4350">sts:ExternalId = tenant id</text><circle cx="37" cy="702" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="705.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="52" y="706" font-size="11.5" fill="#16181d">Platform app → workflow run</text><text x="280" y="706" font-size="11.5" fill="#5b6270">workflow_dispatch with GITHUB_PAT</text><text x="540" y="706" font-size="11.5" fill="#3d4350">the run executes only the workflow’s own steps (S9)</text><circle cx="37" cy="719" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="722.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="52" y="723" font-size="11.5" fill="#16181d">Run → AWS deploy role</text><text x="280" y="723" font-size="11.5" fill="#5b6270">AssumeRoleWithWebIdentity</text><text x="540" y="723" font-size="11.5" fill="#3d4350">aud sts.amazonaws.com; sub equals …:environment:tenant-{id}</text><circle cx="37" cy="736" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="739.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="52" y="740" font-size="11.5" fill="#16181d">Run → Azure deploy identity</text><text x="280" y="740" font-size="11.5" fill="#5b6270">federated credential exchange</text><text x="540" y="740" font-size="11.5" fill="#3d4350">aud api://AzureADTokenExchange; the same subject, exactly</text><circle cx="37" cy="753" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="756.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="52" y="757" font-size="11.5" fill="#16181d">Run → image-pull role</text><text x="280" y="757" font-size="11.5" fill="#5b6270">AssumeRoleWithWebIdentity</text><text x="540" y="757" font-size="11.5" fill="#3d4350">sub matches …:environment:tenant-* (a wildcard; reaches no tenant)</text><circle cx="37" cy="770" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="773.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><text x="52" y="774" font-size="11.5" fill="#16181d">Run → platform /secrets</text><text x="280" y="774" font-size="11.5" fill="#5b6270">OIDC token for the platform’s audience</text><text x="540" y="774" font-size="11.5" fill="#3d4350">repository, subject, workflow_ref; released once; Azure only</text><circle cx="37" cy="787" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="790.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text><text x="52" y="791" font-size="11.5" fill="#16181d">Run → platform /status</text><text x="280" y="791" font-size="11.5" fill="#5b6270">x-webhook-secret header</text><text x="540" y="791" font-size="11.5" fill="#3d4350">constant-time compare; a finished deployment answers 409</text><circle cx="37" cy="804" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="807.8" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">10</text><text x="52" y="808" font-size="11.5" fill="#16181d">Deploy role → runtime roles</text><text x="280" y="808" font-size="11.5" fill="#5b6270">creates and passes them</text><text x="540" y="808" font-size="11.5" fill="#3d4350">named chatbot-{slug}-*, boundary attached, ECS and Lambda only</text><circle cx="37" cy="821" r="9" fill="#3d4350" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="824.8" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">11</text><text x="52" y="825" font-size="11.5" fill="#16181d">Deploy identity → runtime identities</text><text x="280" y="825" font-size="11.5" fill="#5b6270">role assignments</text><text x="540" y="825" font-size="11.5" fill="#3d4350">inside resource group chatbot-{slug}</text><circle cx="37" cy="838" r="9" fill="#a13b12" stroke="#ffffff" stroke-width="1.5"/><text x="37" y="841.8" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">✕</text><text x="52" y="842" font-size="11.5" fill="#16181d">Platform role → deploy role</text><text x="280" y="842" font-size="11.5" fill="#a13b12">refused</text><text x="540" y="842" font-size="11.5" fill="#3d4350">absent from the platform policy and from the role’s trust (S2)</text><polyline points="28,870 72,870" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><text x="82" y="874" font-size="12.5" fill="#3d4350">assumes or federates into</text><polyline points="277,870 321,870" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><text x="331" y="874" font-size="12.5" fill="#3d4350">authenticates one request</text><polyline points="526,870 570,870" fill="none" stroke="#a13b12" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#f-warn)"/><text x="580" y="874" font-size="12.5" fill="#3d4350">refused</text></g>
</svg>
