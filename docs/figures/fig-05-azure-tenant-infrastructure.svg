<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 830" width="1300" height="830" role="img" aria-label="Per-tenant Azure infrastructure: one Container App runs both containers over localhost, with blobs writable only through a docs-signer Function App holding a custom write-only role.">
  <rect x="0" y="0" width="1300" height="830" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13b12"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <text x="390" y="30" font-size="12" font-weight="bold" text-anchor="middle">End user, public internet</text>
    <line x1="390" y1="38" x2="390" y2="166" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="402" y="112" font-size="10.5">external ingress, target port 80</text>

    <rect x="740" y="14" width="316" height="42" rx="4" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.2"/>
    <text x="898" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4e9c">Platform (control plane)</text>

    <rect x="40" y="70" width="1040" height="600" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/>
    <text x="60" y="96" font-size="14" font-weight="bold" fill="#146b58">CUSTOMER AZURE SUBSCRIPTION — resource group chatbot-{slug}</text>

    <!-- container apps env -->
    <rect x="70" y="116" width="640" height="310" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="86" y="138" font-size="11.5" font-weight="bold" fill="#5b6270">Container Apps environment — linked to the Log Analytics workspace</text>

    <rect x="96" y="150" width="588" height="256" rx="4" fill="#f6f7f9" stroke="#2f343d" stroke-width="1.2"/>
    <text x="390" y="176" font-size="12.5" font-weight="bold" text-anchor="middle">Container App chatbot-{slug} — single revision mode</text>
    <text x="390" y="196" font-size="10.5" fill="#5b6270" text-anchor="middle">scales between 1 and 3 replicas · app secrets: registry password, LLM key, storage key, and the vector-store credential</text>
    <text x="390" y="214" font-size="10.5" fill="#5b6270" text-anchor="middle">there is no path-based ingress routing here, so both containers live in one app and reach each other over localhost</text>

    <rect x="112" y="234" width="252" height="112" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="238" y="258" font-size="12" font-weight="bold" text-anchor="middle">frontend container</text>
    <text x="238" y="278" font-size="10.5" fill="#5b6270" text-anchor="middle">chat UI on nginx :80</text>
    <text x="238" y="296" font-size="10.5" fill="#5b6270" text-anchor="middle">0.25 vCPU / 0.5 GiB</text>
    <text x="238" y="314" font-size="10.5" fill="#5b6270" text-anchor="middle">receives all external traffic</text>
    <text x="238" y="332" font-size="10.5" fill="#5b6270" text-anchor="middle">and proxies the API prefix</text>

    <rect x="416" y="234" width="252" height="112" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="542" y="258" font-size="12" font-weight="bold" text-anchor="middle">backend container</text>
    <text x="542" y="278" font-size="10.5" fill="#5b6270" text-anchor="middle">FastAPI RAG service :8000</text>
    <text x="542" y="296" font-size="10.5" fill="#5b6270" text-anchor="middle">0.5 vCPU / 1 GiB</text>
    <text x="542" y="314" font-size="10.5" fill="#5b6270" text-anchor="middle">reads blobs with the storage</text>
    <text x="542" y="332" font-size="10.5" fill="#5b6270" text-anchor="middle">key mounted as a secret</text>

    <line x1="364" y1="290" x2="412" y2="290" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="388" y="366" font-size="10.5" text-anchor="middle">/api → localhost:8000</text>

    <text x="390" y="392" font-size="10.5" fill="#5b6270" text-anchor="middle">Both images are the platform's golden images, replicated into the tenant's own registry before apply.</text>

    <!-- postgres -->
    <rect x="70" y="450" width="640" height="96" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="390" y="474" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b6270">PostgreSQL Flexible Server with pgvector — only when vector_store = pgvector</text>
    <text x="390" y="494" font-size="10.5" fill="#5b6270" text-anchor="middle">B_Standard_B1ms, 32 GB, PostgreSQL 16, 7-day backups, vectors database</text>
    <text x="390" y="512" font-size="10.5" fill="#5b6270" text-anchor="middle">the vector extension is allow-listed at server level so the backend can create it on first use</text>
    <text x="390" y="530" font-size="10.5" fill="#5b6270" text-anchor="middle">reachable from Azure services only, not from the public internet</text>

    <line x1="542" y1="406" x2="542" y2="448" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="552" y="432" font-size="10.5">5432</text>

    <!-- acr -->
    <rect x="70" y="572" width="640" height="78" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="390" y="596" font-size="12" font-weight="bold" text-anchor="middle">Container Registry chatbot{slug}acr</text>
    <text x="390" y="616" font-size="10.5" fill="#5b6270" text-anchor="middle">Basic SKU with the admin account enabled; holds this tenant's copy of the backend and frontend images</text>
    <text x="390" y="634" font-size="10.5" fill="#5b6270" text-anchor="middle">the registry password is stored as an app secret, not in the platform's database</text>

    <line x1="238" y1="570" x2="238" y2="408" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="248" y="564" font-size="10.5">image pull</text>

    <!-- right column -->
    <rect x="740" y="150" width="316" height="104" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="174" font-size="12" font-weight="bold" text-anchor="middle">Storage account, blob container</text>
    <text x="898" y="194" font-size="10.5" fill="#5b6270" text-anchor="middle">private container holding the knowledge base</text>
    <text x="898" y="212" font-size="10.5" fill="#5b6270" text-anchor="middle">uploads arrive as a browser PUT against a</text>
    <text x="898" y="230" font-size="10.5" fill="#5b6270" text-anchor="middle">short-lived user-delegation SAS URL</text>
    <text x="898" y="248" font-size="10.5" fill="#5b6270" text-anchor="middle">name is truncated to 24 characters</text>

    <rect x="740" y="278" width="316" height="122" rx="4" fill="#fbeee5" stroke="#a13b12" stroke-width="1.4"/>
    <text x="898" y="302" font-size="12" font-weight="bold" text-anchor="middle" fill="#a13b12">docs-signer Function App</text>
    <text x="898" y="322" font-size="10.5" fill="#5b6270" text-anchor="middle">a custom role scoped to this storage account:</text>
    <text x="898" y="340" font-size="10.5" fill="#5b6270" text-anchor="middle">mint a user-delegation key, write a blob,</text>
    <text x="898" y="358" font-size="10.5" fill="#5b6270" text-anchor="middle">delete a blob. No read, no list.</text>
    <text x="898" y="378" font-size="10.5" fill="#5b6270" text-anchor="middle">runs on its own consumption plan with a</text>
    <text x="898" y="394" font-size="10.5" fill="#5b6270" text-anchor="middle">separate runtime storage account</text>

    <rect x="740" y="424" width="316" height="104" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="448" font-size="12" font-weight="bold" text-anchor="middle">Key Vault cb-{slug}-kv</text>
    <text x="898" y="468" font-size="10.5" fill="#5b6270" text-anchor="middle">llm-api-key · storage-key · docs-signer</text>
    <text x="898" y="484" font-size="10.5" fill="#5b6270" text-anchor="middle">pinecone-api-key or vector-db-url</text>
    <text x="898" y="502" font-size="10.5" fill="#5b6270" text-anchor="middle">created by the same apply that writes into it,</text>
    <text x="898" y="518" font-size="10.5" fill="#5b6270" text-anchor="middle">which is why Azure secrets travel with the run</text>

    <rect x="740" y="552" width="316" height="76" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="576" font-size="12" font-weight="bold" text-anchor="middle">Log Analytics workspace</text>
    <text x="898" y="596" font-size="10.5" fill="#5b6270" text-anchor="middle">chatbot-{slug}-logs, 30-day retention</text>
    <text x="898" y="614" font-size="10.5" fill="#5b6270" text-anchor="middle">container output lands here; the platform reads none of it</text>

    <!-- cross arrows -->
    <line x1="668" y1="300" x2="736" y2="238" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="676" y="268" font-size="10.5">read documents</text>

    <line x1="738" y1="462" x2="686" y2="400" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="732" y="438" font-size="10.5" text-anchor="end">secret references</text>
    <text x="732" y="454" font-size="10.5" text-anchor="end">resolved per revision</text>

    <line x1="898" y1="278" x2="898" y2="256" stroke="#a13b12" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="908" y="272" font-size="10.5" fill="#a13b12">write only</text>

    <polyline points="1056,35 1100,35 1100,340 1058,340" fill="none" stroke="#a13b12" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="1112" y="292" font-size="10.5" fill="#a13b12" font-weight="bold">HTTPS with a</text>
    <text x="1112" y="308" font-size="10.5" fill="#a13b12" font-weight="bold">shared-secret header</text>
    <text x="1112" y="328" font-size="10.5" fill="#5b6270">the same contract the AWS</text>
    <text x="1112" y="344" font-size="10.5" fill="#5b6270">Lambda implements, so the</text>
    <text x="1112" y="360" font-size="10.5" fill="#5b6270">platform code is cloud-agnostic</text>

    <rect x="740" y="700" width="316" height="72" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="898" y="724" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b6270">Customer's own Pinecone project</text>
    <text x="898" y="744" font-size="10.5" fill="#5b6270" text-anchor="middle">the same index resource as on AWS, in the customer's project</text>
    <text x="898" y="762" font-size="10.5" fill="#5b6270" text-anchor="middle">its key travels as a masked run input, since no vault exists yet</text>

    <polyline points="668,330 722,330 722,736 736,736" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#am)"/>
    <text x="712" y="690" font-size="10.5" fill="#5b6270" text-anchor="end">or queries Pinecone instead</text>

    <text x="40" y="800" font-size="11" fill="#5b6270">The Azure topology differs from AWS in one structural way: without path-based ingress the two containers share a replica and talk over localhost, so there is no load balancer rule to draw.</text>
    <text x="40" y="820" font-size="11" fill="#5b6270">The document path is deliberately identical in shape — a write-only function in front of a store the platform cannot read.</text>
  </g>
</svg>
