<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="The control plane dispatches deployments and receives only lifecycle status; it holds no read path into the customer's data plane.">
  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13b12"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <!-- CONTROL PLANE -->
    <rect x="40" y="40" width="1040" height="150" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.5"/>
    <text x="60" y="68" font-size="15" font-weight="bold" fill="#1f4e9c">CONTROL PLANE — the platform (Next.js, Neon Postgres)</text>
    <text x="1060" y="68" font-size="11" fill="#5b6270" text-anchor="end">operator-facing; one deployment per tenant</text>
    <g fill="#ffffff" stroke="#1f4e9c" stroke-width="1">
      <rect x="70" y="88" width="320" height="78" rx="4"/>
      <rect x="410" y="88" width="320" height="78" rx="4"/>
      <rect x="750" y="88" width="320" height="78" rx="4"/>
    </g>
    <g font-size="12.5" text-anchor="middle">
      <text x="230" y="115">Tenant configuration</text>
      <text x="570" y="115">Deployment records</text>
      <text x="910" y="115">Document register</text>
    </g>
    <g font-size="10.5" fill="#5b6270" text-anchor="middle">
      <text x="230" y="134">cloud account IDs, regions, roles,</text>
      <text x="230" y="150">encrypted keys, secret ARNs</text>
      <text x="570" y="134">status, run ID, run URL,</text>
      <text x="570" y="150">error message, chatbot URL</text>
      <text x="910" y="134">file name, size, content type</text>
      <text x="910" y="150">— never file content</text>
    </g>

    <!-- CI -->
    <rect x="90" y="278" width="300" height="94" rx="6" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="240" y="308" font-size="12.5" font-weight="bold" text-anchor="middle">GitHub Actions (platform CI)</text>
    <text x="240" y="330" font-size="10.5" fill="#5b6270" text-anchor="middle">replicate golden image,</text>
    <text x="240" y="346" font-size="10.5" fill="#5b6270" text-anchor="middle">then terraform apply</text>
    <text x="240" y="362" font-size="10.5" fill="#5b6270" text-anchor="middle">holds credentials only for the run</text>

    <!-- deploy path -->
    <line x1="240" y1="190" x2="240" y2="276" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="252" y="222" font-size="10.5">workflow_dispatch</text>
    <text x="252" y="238" font-size="10.5" fill="#5b6270">tenant config + secret ARNs</text>
    <line x1="240" y1="372" x2="240" y2="428" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="252" y="404" font-size="10.5">AssumeRole / service principal</text>

    <!-- callback -->
    <polyline points="390,300 470,300 470,192" fill="none" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="482" y="248" font-size="10.5">POST /api/deployments/{id}/status</text>
    <text x="482" y="264" font-size="10.5" fill="#5b6270">state, chatbot URL, signer URL</text>

    <!-- barred read path -->
    <line x1="700" y1="428" x2="700" y2="192" stroke="#8b93a1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ax)"/>
    <line x1="686" y1="296" x2="714" y2="324" stroke="#a13b12" stroke-width="2.4"/>
    <line x1="714" y1="296" x2="686" y2="324" stroke="#a13b12" stroke-width="2.4"/>
    <text x="724" y="270" font-size="10.5" fill="#a13b12" font-weight="bold">no read path exists</text>
    <text x="724" y="286" font-size="10.5" fill="#5b6270">questions, answers, document</text>
    <text x="724" y="302" font-size="10.5" fill="#5b6270">bytes, embeddings and runtime</text>
    <text x="724" y="318" font-size="10.5" fill="#5b6270">logs never leave the tenant</text>

    <!-- docs-signer write path -->
    <line x1="952" y1="190" x2="952" y2="428" stroke="#a13b12" stroke-width="1.4" marker-end="url(#aw)"/>
    <text x="964" y="352" font-size="10.5" fill="#a13b12">HTTPS + shared secret</text>
    <text x="964" y="368" font-size="10.5" fill="#5b6270">presign upload / delete only</text>

    <!-- DATA PLANE -->
    <rect x="40" y="430" width="1040" height="150" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/>
    <text x="60" y="458" font-size="15" font-weight="bold" fill="#146b58">DATA PLANE — the customer's own cloud account</text>
    <text x="1060" y="458" font-size="11" fill="#5b6270" text-anchor="end">customer owns the resources and the bill</text>
    <g fill="#ffffff" stroke="#146b58" stroke-width="1">
      <rect x="70" y="478" width="235" height="82" rx="4"/>
      <rect x="325" y="478" width="235" height="82" rx="4"/>
      <rect x="580" y="478" width="235" height="82" rx="4"/>
      <rect x="835" y="478" width="235" height="82" rx="4"/>
    </g>
    <g font-size="12.5" text-anchor="middle">
      <text x="187" y="505">Chatbot runtime</text>
      <text x="442" y="505">Document store</text>
      <text x="697" y="505">Vector store</text>
      <text x="952" y="505">docs-signer function</text>
    </g>
    <g font-size="10.5" fill="#5b6270" text-anchor="middle">
      <text x="187" y="524">frontend + RAG backend,</text>
      <text x="187" y="540">calls the LLM provider</text>
      <text x="442" y="524">S3 bucket or Blob container</text>
      <text x="442" y="540">holding the knowledge base</text>
      <text x="697" y="524">Pinecone index or</text>
      <text x="697" y="540">Postgres + pgvector</text>
      <text x="952" y="524">write-only: PutObject and</text>
      <text x="952" y="540">DeleteObject, never Get or List</text>
    </g>

    <text x="40" y="606" font-size="11" fill="#5b6270">Solid arrows are the only channels between the planes. The dashed arrow is drawn to be crossed out: no endpoint, role or delegated credential grants it.</text>
  </g>
</svg>
