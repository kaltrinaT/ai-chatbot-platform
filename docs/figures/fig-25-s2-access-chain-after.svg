<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 816" width="1240" height="816" role="img" aria-label="S2 access chain: no path leads from the platform to the documents.">
  <rect x="0" y="0" width="1240" height="816" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="60" y="44" font-size="16" fill="#16181d" font-weight="bold">Can the platform reach an AWS tenant's documents? (test S2)</text><text x="60" y="66" font-size="11.5" fill="#5b6270">Every role the bootstrap template creates, evaluated against the platform's policy as written and as deployed (run of 11 Oct 2026).</text><text x="60" y="106" font-size="13" fill="#16181d" font-weight="bold">Through chatbot-client-deploy-acme</text><rect x="60" y="118" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="138" r="11" fill="#3d4350"/><text x="80" y="142.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="102" y="142" font-size="12.5" fill="#16181d">The platform role may call sts:AssumeRole on chatbot-client-deploy-acme</text><text x="102" y="160" font-size="10.5" fill="#898781">infra/platform/control-plane/main.tf: ImplicitDeny; infra/platform/control-plane/terraform.tfstate (deployed, state serial 9): Allow</text><rect x="796" y="130" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="148.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="170" x2="80" y2="184" stroke="#898781" stroke-width="1.5"/><path d="M75,179 L80,185 L85,179" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="186" width="720" height="52" rx="6" fill="#ffffff" stroke="#146b58" stroke-width="1.5"/><circle cx="80" cy="206" r="11" fill="#3d4350"/><text x="80" y="210.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="102" y="210" font-size="12.5" fill="#16181d">chatbot-client-deploy-acme trusts the platform account when it sends the tenant ID as ExternalId</text><text x="102" y="228" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:204</text><rect x="796" y="198" width="64" height="28" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1"/><text x="828" y="216.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">No</text><line x1="80" y1="238" x2="80" y2="252" stroke="#898781" stroke-width="1.5"/><path d="M75,247 L80,253 L85,247" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="254" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="274" r="11" fill="#3d4350"/><text x="80" y="278.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="102" y="278" font-size="12.5" fill="#16181d">chatbot-client-deploy-acme may read a document</text><text x="102" y="296" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:204</text><rect x="796" y="266" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="284.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="306" x2="80" y2="320" stroke="#898781" stroke-width="1.5"/><path d="M75,315 L80,321 L85,315" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="322" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="342" r="11" fill="#3d4350"/><text x="80" y="346.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="102" y="346" font-size="12.5" fill="#16181d">chatbot-client-deploy-acme may list the documents bucket</text><text x="102" y="364" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:204</text><rect x="796" y="334" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="352.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><text x="60" y="394" font-size="11.5" fill="#5b6270">This path is broken: no step sequence leads from the platform to the documents.</text><text x="60" y="422" font-size="13" fill="#16181d" font-weight="bold">Through chatbot-client-onboard-acme</text><rect x="60" y="434" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="454" r="11" fill="#3d4350"/><text x="80" y="458.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="102" y="458" font-size="12.5" fill="#16181d">The platform role may call sts:AssumeRole on chatbot-client-onboard-acme</text><text x="102" y="476" font-size="10.5" fill="#898781">infra/platform/control-plane/main.tf: Allow; infra/platform/control-plane/terraform.tfstate (deployed, state serial 9): ImplicitDeny</text><rect x="796" y="446" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="464.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="486" x2="80" y2="500" stroke="#898781" stroke-width="1.5"/><path d="M75,495 L80,501 L85,495" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="502" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="522" r="11" fill="#3d4350"/><text x="80" y="526.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="102" y="526" font-size="12.5" fill="#16181d">chatbot-client-onboard-acme trusts the platform account when it sends the tenant ID as ExternalId</text><text x="102" y="544" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:410</text><rect x="796" y="514" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="532.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="554" x2="80" y2="568" stroke="#898781" stroke-width="1.5"/><path d="M75,563 L80,569 L85,563" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="570" width="720" height="52" rx="6" fill="#ffffff" stroke="#146b58" stroke-width="1.5"/><circle cx="80" cy="590" r="11" fill="#3d4350"/><text x="80" y="594.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">7</text><text x="102" y="594" font-size="12.5" fill="#16181d">chatbot-client-onboard-acme may read a document</text><text x="102" y="612" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:410</text><rect x="796" y="582" width="64" height="28" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1"/><text x="828" y="600.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">No</text><line x1="80" y1="622" x2="80" y2="636" stroke="#898781" stroke-width="1.5"/><path d="M75,631 L80,637 L85,631" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="638" width="720" height="52" rx="6" fill="#ffffff" stroke="#146b58" stroke-width="1.5"/><circle cx="80" cy="658" r="11" fill="#3d4350"/><text x="80" y="662.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">8</text><text x="102" y="662" font-size="12.5" fill="#16181d">chatbot-client-onboard-acme may list the documents bucket</text><text x="102" y="680" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:410</text><rect x="796" y="650" width="64" height="28" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1"/><text x="828" y="668.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">No</text><text x="60" y="710" font-size="11.5" fill="#5b6270">This path is broken: no step sequence leads from the platform to the documents.</text><rect x="60" y="734" width="800" height="40" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/><polyline points="75,754 78.5,758 85.5,749.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="759" font-size="13" fill="#16181d" font-weight="bold">No path reaches the documents, so the platform cannot read them. The claim holds.</text><text x="900" y="100" font-size="13" fill="#16181d" font-weight="bold">Negative controls</text><text x="900" y="118" font-size="11" fill="#5b6270">Each must be refused; otherwise the</text><text x="900" y="133" font-size="11" fill="#5b6270">evaluator would be too permissive to</text><text x="900" y="148" font-size="11" fill="#5b6270">trust.</text><polyline points="902,175 905.5,179 912.5,170.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="179" font-size="11.5" fill="#3d4350">Another tenant's ExternalId is refused</text><text x="920" y="194" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,214 905.5,218 912.5,209.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="218" font-size="11.5" fill="#3d4350">A request without ExternalId is</text><text x="920" y="233" font-size="11.5" fill="#3d4350">refused</text><text x="920" y="248" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,268 905.5,272 912.5,263.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="272" font-size="11.5" fill="#3d4350">A principal in another AWS account is</text><text x="920" y="287" font-size="11.5" fill="#3d4350">refused</text><text x="920" y="302" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,322 905.5,326 912.5,317.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="326" font-size="11.5" fill="#3d4350">The platform role may not assume an</text><text x="920" y="341" font-size="11.5" fill="#3d4350">unrelated role</text><text x="920" y="356" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,376 905.5,380 912.5,371.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="380" font-size="11.5" fill="#3d4350">The deployment role may not edit its</text><text x="920" y="395" font-size="11.5" fill="#3d4350">own IAM role</text><text x="920" y="410" font-size="10.5" fill="#898781">Refused (ExplicitDeny)</text><polyline points="902,430 905.5,434 912.5,425.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="434" font-size="11.5" fill="#3d4350">The onboarding role may not read a</text><text x="920" y="449" font-size="11.5" fill="#3d4350">secret back</text><text x="920" y="464" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,484 905.5,488 912.5,479.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="488" font-size="11.5" fill="#3d4350">The deployment role may not widen the</text><text x="920" y="503" font-size="11.5" fill="#3d4350">onboarding role</text><text x="920" y="518" font-size="10.5" fill="#898781">Refused (ExplicitDeny)</text><text x="900" y="552" font-size="13" fill="#16181d" font-weight="bold">Onboarding still works</text><polyline points="902,568 905.5,572 912.5,563.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="572" font-size="11.5" fill="#3d4350">The platform role may assume the</text><text x="920" y="587" font-size="11.5" fill="#3d4350">onboarding role</text><text x="920" y="602" font-size="10.5" fill="#898781">Allowed</text><polyline points="902,622 905.5,626 912.5,617.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="626" font-size="11.5" fill="#3d4350">The onboarding role may create this</text><text x="920" y="641" font-size="11.5" fill="#3d4350">tenant's secret</text><text x="920" y="656" font-size="10.5" fill="#898781">Allowed</text><text x="900" y="690" font-size="13" fill="#16181d" font-weight="bold">Who holds the platform role</text><text x="900" y="710" font-size="11.5" fill="#3d4350">• The operator's AWS sign-in session</text><text x="900" y="725" font-size="11.5" fill="#3d4350">(temporary credentials only)</text><text x="900" y="748" font-size="11.5" fill="#3d4350">• The hosted platform on Vercel,</text><text x="900" y="763" font-size="11.5" fill="#3d4350">production environment only (OIDC)</text></g>
</svg>
