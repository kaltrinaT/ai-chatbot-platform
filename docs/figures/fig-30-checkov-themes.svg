t><text x="465.741935483871" y="322.5" font-size="12" fill="#16181d" font-weight="bold">12</text><text x="760" y="317" font-size="10.5" fill="#3d4350">Key Vault secret expiry and content type, automatic rotation,</text><text x="760" y="331" font-size="10.5" fill="#3d4350">shared-key and password authentication</text><line x1="60" y1="342" x2="1200" y2="342" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="364.5" font-size="12" fill="#16181d">Workflow inputs and token permissions</text><path d="M330,350 h123.74193548387096 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-123.74193548387096 z" fill="#8f8d86"><title>Workflow inputs and token permissions, Platform: 12</title></path><text x="393.8709677419355" y="364" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">12</text><text x="465.741935483871" y="364.5" font-size="12" fill="#16181d" font-weight="bold">12</text><text x="760" y="359" font-size="10.5" fill="#3d4350">Dispatch inputs and the id-token: write permission in all six</text><text x="760" y="373" font-size="10.5" fill="#3d4350">workflows; S9 tests that inputs reach scripts as data only</text><line x1="60" y1="384" x2="1200" y2="384" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="406.5" font-size="12" fill="#16181d">Customer-managed encryption keys</text><rect x="330" y="392" width="51.2258064516129" height="20" fill="#2a78d6"><title>Customer-managed encryption keys, AWS customer account: 5</title></rect><text x="355.61290322580646" y="406" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><rect x="383.2258064516129" y="392" width="19.29032258064516" height="20" fill="#eb6834"><title>Customer-managed encryption keys, Azure customer subscription: 2</title></rect><text x="392.8709677419355" y="406" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><path d="M404.5161290322581,392 h6.64516129032258 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-6.64516129032258 z" fill="#8f8d86"><title>Customer-managed encryption keys, Platform: 1</title></path><text x="423.16129032258067" y="406.5" font-size="12" fill="#16181d" font-weight="bold">8</text><text x="760" y="401" font-size="10.5" fill="#3d4350">KMS or customer-managed keys in place of the provider-managed</text><text x="760" y="415" font-size="10.5" fill="#3d4350">encryption every store already has</text><line x1="60" y1="426" x2="1200" y2="426" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="448.5" font-size="12" fill="#16181d">Configuration hygiene</text><rect x="330" y="434" width="61.87096774193548" height="20" fill="#2a78d6"><title>Configuration hygiene, AWS customer account: 6</title></rect><text x="360.93548387096774" y="448" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><rect x="393.8709677419355" y="434" width="8.64516129032258" height="20" fill="#eb6834"><title>Configuration hygiene, Azure customer subscription: 1</title></rect><path d="M404.51612903225805,434 h6.64516129032258 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-6.64516129032258 z" fill="#8f8d86"><title>Configuration hygiene, Platform: 1</title></path><text x="423.1612903225806" y="448.5" font-size="12" fill="#16181d" font-weight="bold">8</text><text x="760" y="443" font-size="10.5" fill="#3d4350">Security-group descriptions, naming rules, zone pinning, minor</text><text x="760" y="457" font-size="10.5" fill="#3d4350">upgrades, lifecycle and root object</text><line x1="60" y1="468" x2="1200" y2="468" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="490.5" font-size="12" fill="#16181d">Edge protection</text><path d="M330,476 h70.51612903225806 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-70.51612903225806 z" fill="#2a78d6"><title>Edge protection, AWS customer account: 7</title></path><text x="367.258064516129" y="490" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">7</text><text x="412.51612903225805" y="490.5" font-size="12" fill="#16181d" font-weight="bold">7</text><text x="760" y="485" font-size="10.5" fill="#3d4350">WAF, response-header policy, geo restriction, header dropping,</text><text x="760" y="499" font-size="10.5" fill="#3d4350">Lambda concurrency limit</text><line x1="60" y1="510" x2="1200" y2="510" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="532.5" font-size="12" fill="#16181d">Encryption in transit</text><rect x="330" y="518" width="61.87096774193548" height="20" fill="#2a78d6"><title>Encryption in transit, AWS customer account: 6</title></rect><text x="360.93548387096774" y="532" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><path d="M393.8709677419355,518 h6.64516129032258 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-6.64516129032258 z" fill="#eb6834"><title>Encryption in transit, Azure customer subscription: 1</title></path><text x="412.51612903225805" y="532.5" font-size="12" fill="#16181d" font-weight="bold">7</text><text x="760" y="527" font-size="10.5" fill="#3d4350">HTTP listener and target groups, HTTPS redirect, TLS minimums,</text><text x="760" y="541" font-size="10.5" fill="#3d4350">default CloudFront certificate</text><line x1="60" y1="552" x2="1200" y2="552" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="574.5" font-size="12" fill="#16181d">Deployment-role permissions</text><path d="M330,560 h49.2258064516129 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-49.2258064516129 z" fill="#2a78d6"><title>Deployment-role permissions, AWS customer account: 5</title></path><text x="356.61290322580646" y="574" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="391.2258064516129" y="574.5" font-size="12" fill="#16181d" font-weight="bold">5</text><text x="760" y="569" font-size="10.5" fill="#3d4350">The deployment role's IAM breadth; its scope is documented in</text><text x="760" y="583" font-size="10.5" fill="#3d4350">SECURITY.md, What the deployment role can do</text><line x1="60" y1="594" x2="1200" y2="594" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="616.5" font-size="12" fill="#16181d">Image supply chain</text><rect x="330" y="602" width="8.64516129032258" height="20" fill="#2a78d6"><title>Image supply chain, AWS customer account: 1</title></rect><path d="M340.64516129032256,602 h38.58064516129032 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-38.58064516129032 z" fill="#eb6834"><title>Image supply chain, Azure customer subscription: 4</title></path><text x="361.93548387096774" y="616" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="391.22580645161287" y="616.5" font-size="12" fill="#16181d" font-weight="bold">5</text><text x="760" y="611" font-size="10.5" fill="#3d4350">Registry image scanning, quarantine, signing and code signing,</text><text x="760" y="625" font-size="10.5" fill="#3d4350">untagged-manifest retention</text><text x="60" y="666" font-size="11" fill="#5b6270">Source: docs/evaluation/security/checkov.json; failed of all checks per framework: arm 5/8, cloudformation 6/32, github_actions 12/344, terraform 110/326.</text><text x="60" y="684" font-size="11" fill="#5b6270">Checkov's open-source rules carry no severity, so a count says how many checks a theme gathers, not how much risk it holds. The theme of every check ID is</text><text x="60" y="702" font-size="11" fill="#5b6270">written out in scripts/plot-checkov-themes.cjs. Many checks ask for production hardening (redundancy, customer-managed keys, extended logging) that would add</text><text x="60" y="720" font-size="11" fill="#5b6270">cost to every tenant. Each failed check still needs a disposition: fixed, accepted with a reason, or a documented limitation.</text></g>
</svg>
