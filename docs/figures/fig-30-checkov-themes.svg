  <g font-family="Arial, Helvetica, sans-serif"><text x="60" y="44" font-size="16" fill="#16181d" font-weight="bold">What the infrastructure scanner flagged, by theme</text><text x="60" y="66" font-size="11.5" fill="#5b6270">Checkov 3.3.19 over both tenant Terraform roots, both bootstrap templates, the platform's template-bucket Terraform and the six workflows: 577 checks passed and</text><text x="60" y="84" font-size="11.5" fill="#5b6270">133 failed. 113 of the failures are in what a deployment creates in the customer's cloud; each is placed in one theme by its check ID.</text><rect x="60" y="106" width="12" height="12" rx="2" fill="#2a78d6"/><text x="78" y="117" font-size="11.5" fill="#3d4350" font-weight="bold">AWS customer account · 64</text><text x="78" y="133" font-size="11" fill="#5b6270">tenant Terraform, CloudFormation bootstrap</text><rect x="390" y="106" width="12" height="12" rx="2" fill="#eb6834"/><text x="408" y="117" font-size="11.5" fill="#3d4350" font-weight="bold">Azure customer subscription · 49</text><text x="408" y="133" font-size="11" fill="#5b6270">tenant Terraform, ARM bootstrap</text><rect x="720" y="106" width="12" height="12" rx="2" fill="#8f8d86"/><text x="738" y="117" font-size="11.5" fill="#3d4350" font-weight="bold">Platform · 20</text><text x="738" y="133" font-size="11" fill="#5b6270">template bucket Terraform, workflows</text><text x="760" y="160" font-size="10.5" fill="#5b6270" font-weight="bold">WHAT THE CHECKS ASK FOR</text><line x1="60" y1="168" x2="1200" y2="168" stroke="#c3c2b7" stroke-width="1"/><text x="60" y="196.5" font-size="12" fill="#16181d">Network exposure</text><rect x="330" y="182" width="115.09677419354838" height="20" fill="#2a78d6"><title>Network exposure, AWS customer account: 11</title></rect><text x="387.5483870967742" y="196" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">11</text><rect x="447.0967741935484" y="182" width="178.96774193548387" height="20" fill="#eb6834"><title>Network exposure, Azure customer subscription: 17</title></rect><text x="536.5806451612904" y="196" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">17</text><path d="M628.0645161290323,182 h27.93548387096774 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-27.93548387096774 z" fill="#8f8d86"><title>Network exposure, Platform: 3</title></path><text x="644.0322580645162" y="196" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="668" y="196.5" font-size="12" fill="#16181d" font-weight="bold">31</text><text x="760" y="191" font-size="10.5" fill="#3d4350">Public storage, registry and vault endpoints, open load-balancer</text><text x="760" y="205" font-size="10.5" fill="#3d4350">rules, Postgres without a private endpoint (Known Limitation #5)</text><line x1="60" y1="216" x2="1200" y2="216" stroke="#e1e0d9" stroke-width="1"/><text x="60" y="238.5" font-size="12" fill="#16181d">Redundancy and recovery</text><rect x="330" y="224" width="72.51612903225806" height="20" fill="#2a78d6"><title>Redundancy and recovery, AWS customer account: 7</title></rect><text x="366.258064516129" y="238" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">7</text><rect x="404.51612903225805" y="224" width="115.09677419354838" height="20" fill="#eb6834"><title>Redundancy and recovery, Azure customer subscription: 11</title></rect><text x="462.06451612903226" y="238" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">11</text><path d="M521.6129032258065,224 h6.64516129032258 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-6.64516129032258 z" fill="#8f8d86"><title>Redundancy and recovery, Platform: 1</title></path><text x="540.258064516129" y="238.5" font-size="12" fill="#16181d" font-weight="bold">19</text><text x="760" y="233" font-size="10.5" fill="#3d4350">Multi-AZ and geo-redundancy, replication, backups, deletion and</text><text x="760" y="247" font-size="10.5" fill="#3d4350">purge protection</text><line x1="60" y1="258" x2="1200