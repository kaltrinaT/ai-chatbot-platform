 fill="#16181d" font-weight="bold" text-anchor="end">19 min 49 s</text><text x="82" y="574" font-size="11" fill="#5b6270">Duration the platform recorded (until the success callback)</text><text x="760" y="574" font-size="11" fill="#5b6270" text-anchor="end">9 min 1 s</text><text x="910" y="574" font-size="11" fill="#5b6270" text-anchor="end">8 min 39 s</text><text x="1060" y="574" font-size="11" fill="#5b6270" text-anchor="end">19 min 48 s</text><text x="60" y="614" font-size="11" fill="#5b6270">Source: docs/evaluation/oidc/history.json, GitHub job and step timings archived from each run (one-second resolution). The queue segment runs from the platform's recorded</text><text x="60" y="632" font-size="11" fill="#5b6270">start to the moment GitHub started the job. Phase shares are of the whole bar. Apply time depends on what earlier attempts had already created, and these records do not</text><text x="60" y="650" font-size="11" fill="#5b6270">tell a fresh creation from a redeployment. n = 3: a description of these runs, not an estimate of typical duration.</text></g>
