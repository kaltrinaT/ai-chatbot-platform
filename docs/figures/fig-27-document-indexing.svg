<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1100" width="960" height="1100" role="img" aria-label="Document indexing: after an upload or delete, the control plane makes one HTTP call to the tenant’s own chatbot backend, which lists and downloads every document under the prefix, extracts text, chunks and embeds each document on its own CPU, upserts the vectors into pgvector or the customer’s Pinecone index, purges the vectors of documents no longer in storage, and replies. No document content reaches the control plane.">
  <rect x="0" y="0" width="960" height="1100" fill="#ffffff"/>
  <defs><marker id="f-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker><marker id="o-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#16181d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="t-cust" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="232" height="1028" rx="6" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><path d="M266,16 H938 Q944,16 944,22 V839 H646 V1038 Q646,1044 640,1044 H266 Q260,1044 260,1038 V22 Q260,16 266,16 Z" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/><text x="132" y="40" font-size="13" font-weight="bold" text-anchor="middle" fill="#3d4350">CONTROL PLANE</text><text x="132" y="62" font-size="12" text-anchor="middle" fill="#5b6270">Next.js server actions</text><text x="278" y="40" font-size="13" font-weight="bold" fill="#146b58">CUSTOMER CLOUD ACCOUNT</text><text x="437" y="66" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3d4350">Chatbot backend container</text><text x="795" y="66" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3d4350">Storage</text><rect x="28" y="92" width="208" height="92" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="114" font-size="13.5" font-weight="bold" fill="#16181d">Upload or delete</text><text x="40" y="133" font-size="12" fill="#5b6270">upload: browser reports success,</text><text x="40" y="148" font-size="12" fill="#5b6270">document row set to uploaded</text><text x="40" y="163" font-size="12" fill="#5b6270">delete: the signer removes the</text><text x="40" y="178" font-size="12" fill="#5b6270">object, then the row is dropped</text><rect x="278" y="102" width="318" height="55" rx="3" fill="#f7f7f4" stroke="#c9c8bf" stroke-width="1"/><text x="437" y="119" font-size="12.5" text-anchor="middle" fill="#3d4350">Every call is a full resync of the prefix, not</text><text x="437" y="134" font-size="12.5" text-anchor="middle" fill="#3d4350">a delta: its cost grows with the number of</text><text x="437" y="149" font-size="12.5" text-anchor="middle" fill="#3d4350">documents, not with the size of the change.</text><polyline points="132,184 132,210" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="28" y="210" width="208" height="107" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="232" font-size="13.5" font-weight="bold" fill="#16181d">Trigger the reindex</text><text x="40" y="251" font-size="12" fill="#5b6270">POST /api/index; waits ≤ 120 s</text><text x="40" y="266" font-size="12" fill="#5b6270">no credential, no file content</text><text x="40" y="281" font-size="12" fill="#5b6270">a CloudFront-fronted tenant is</text><text x="40" y="296" font-size="12" fill="#5b6270">called at its load balancer, as</text><text x="40" y="311" font-size="12" fill="#5b6270">the CDN gives up after 60 s</text><rect x="278" y="210" width="318" height="107" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="227" r="9.5" fill="#3d4350"/><text x="295" y="231.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="312" y="232" font-size="13.5" font-weight="bold" fill="#16181d">Admit</text><text x="312" y="251" font-size="12" fill="#5b6270">one resync runs at a time and one may wait;</text><text x="312" y="266" font-size="12" fill="#5b6270">a further call gets 202 at once, since the</text><text x="312" y="281" font-size="12" fill="#5b6270">waiting run lists storage later and covers it</text><text x="312" y="296" font-size="12" fill="#5b6270">tenant, bucket and prefix come from the</text><text x="312" y="311" font-size="12" fill="#5b6270">container’s env, never from the request</text><polyline points="236,250 278,250" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="339" width="318" height="62" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="356" r="9.5" fill="#3d4350"/><text x="295" y="360.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="312" y="361" font-size="13.5" font-weight="bold" fill="#16181d">List</text><text x="312" y="380" font-size="12" fill="#5b6270">every object under the tenant’s prefix,</text><text x="312" y="395" font-size="12" fill="#5b6270">every page, not just the first 1000 keys</text><polyline points="437,317 437,339" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="423" width="318" height="77" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="440" r="9.5" fill="#3d4350"/><text x="295" y="444.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="312" y="445" font-size="13.5" font-weight="bold" fill="#16181d">Download and extract text</text><text x="312" y="464" font-size="12" fill="#5b6270">.txt decoded as UTF-8</text><text x="312" y="479" font-size="12" fill="#5b6270">.pdf via PyMuPDF · .docx via python-docx</text><text x="312" y="494" font-size="12" fill="#5b6270">any other file type is skipped</text><polyline points="437,401 437,423" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="554" width="318" height="62" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="571" r="9.5" fill="#3d4350"/><text x="295" y="575.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="312" y="576" font-size="13.5" font-weight="bold" fill="#16181d">Chunk</text><text x="312" y="595" font-size="12" fill="#5b6270">200-word windows, 40 words overlapping</text><text x="312" y="610" font-size="12" fill="#5b6270">fits the model’s 256-token input limit</text><polyline points="437,500 437,554" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="636" width="318" height="77" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="653" r="9.5" fill="#3d4350"/><text x="295" y="657.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="312" y="658" font-size="13.5" font-weight="bold" fill="#16181d">Embed</text><text x="312" y="677" font-size="12" fill="#5b6270">all-MiniLM-L6-v2 on the container’s CPU</text><text x="312" y="692" font-size="12" fill="#5b6270">one 384-dimension vector per chunk</text><text x="312" y="707" font-size="12" fill="#5b6270">loaded on first use (~13 s), then cached</text><polyline points="437,616 437,636" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="733" width="318" height="77" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="750" r="9.5" fill="#3d4350"/><text x="295" y="754.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="312" y="755" font-size="13.5" font-weight="bold" fill="#16181d">Upsert</text><text x="312" y="774" font-size="12" fill="#5b6270">id {tenant}-{key}-{n} is deterministic, so</text><text x="312" y="789" font-size="12" fill="#5b6270">a rerun overwrites instead of duplicating</text><text x="312" y="804" font-size="12" fill="#5b6270">metadata: tenant, source key, chunk text</text><polyline points="437,713 437,733" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="268" y="522" width="338" height="302" fill="none" stroke="#3d4350" stroke-width="1.1"/><path d="M268,522 h52 v12 l-7,7 h-45 z" fill="#ffffff" stroke="#3d4350" stroke-width="1.1"/><text x="276" y="536" font-size="12" font-weight="bold" fill="#3d4350">loop</text><text x="596" y="537" font-size="12.5" font-weight="bold" text-anchor="end" fill="#3d4350">[for each document]</text><rect x="278" y="846" width="318" height="77" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="863" r="9.5" fill="#3d4350"/><text x="295" y="867.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="312" y="868" font-size="13.5" font-weight="bold" fill="#16181d">Purge</text><text x="312" y="887" font-size="12" fill="#5b6270">delete every vector whose source key was</text><text x="312" y="902" font-size="12" fill="#5b6270">not listed this run — how a deleted</text><text x="312" y="917" font-size="12" fill="#5b6270">document stops reaching answers</text><polyline points="437,810 437,846" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="945" width="318" height="77" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="962" r="9.5" fill="#3d4350"/><text x="295" y="966.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><text x="312" y="967" font-size="13.5" font-weight="bold" fill="#16181d">Respond</text><text x="312" y="986" font-size="12" fill="#5b6270">200 “Data indexed successfully”</text><text x="312" y="1001" font-size="12" fill="#5b6270">storage error: 400 or 502</text><text x="312" y="1016" font-size="12" fill="#5b6270">configuration error: 500</text><polyline points="437,923 437,945" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="28" y="945" width="208" height="92" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="967" font-size="13.5" font-weight="bold" fill="#16181d">Operator sees the outcome</text><text x="40" y="986" font-size="12" fill="#5b6270">200 or 202: done</text><text x="40" y="1001" font-size="12" fill="#5b6270">error or timeout: a warning —</text><text x="40" y="1016" font-size="12" fill="#5b6270">the upload or delete still</text><text x="40" y="1031" font-size="12" fill="#5b6270">stands, only the index is stale</text><polyline points="278,985 236,985" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><line x1="50" y1="317" x2="50" y2="945" stroke="#5b6270" stroke-width="1.5" stroke-dasharray="2 4"/><text x="64" y="609" font-size="12" fill="#5b6270">the server action</text><text x="64" y="624" font-size="12" fill="#5b6270">waits on this one</text><text x="64" y="639" font-size="12" fill="#5b6270">call while the</text><text x="64" y="654" font-size="12" fill="#5b6270">resync runs</text><rect x="660" y="339" width="270" height="161" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="672" y="361" font-size="13.5" font-weight="bold" fill="#16181d">Document store</text><text x="672" y="380" font-size="12" fill="#5b6270">S3 bucket or Blob container, private,</text><text x="672" y="395" font-size="12" fill="#5b6270">encrypted at rest; the file arrived here</text><text x="672" y="410" font-size="12" fill="#5b6270">straight from the operator’s browser</text><text x="672" y="425" font-size="12" fill="#5b6270">the chatbot’s identity may list and read</text><text x="672" y="440" font-size="12" fill="#5b6270">only — the mirror of the signer, which</text><text x="672" y="455" font-size="12" fill="#5b6270">may write and delete but never read</text><polyline points="596,379 660,379" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><text x="628" y="372" font-size="11.5" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">list</text><text x="628" y="372" font-size="11.5" text-anchor="middle" fill="#16181d">list</text><polyline points="660,463 596,463" fill="none" stroke="#146b58" stroke-width="3.2" marker-end="url(#t-cust)"/><text x="628" y="454" font-size="11.5" font-weight="bold" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">file bytes</text><text x="628" y="454" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#146b58">file bytes</text><text x="660" y="707" font-size="12.5" font-weight="bold" fill="#3d4350">VECTOR STORE</text><text x="660" y="723" font-size="12" fill="#5b6270">one of the two, chosen at onboarding</text><rect x="660" y="733" width="270" height="92" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="672" y="755" font-size="13.5" font-weight="bold" fill="#16181d">pgvector · in this account</text><text x="672" y="774" font-size="12" fill="#5b6270">managed Postgres on the private network</text><text x="672" y="789" font-size="12" fill="#5b6270">upsert: insert, or update a matching id</text><text x="672" y="804" font-size="12" fill="#5b6270">purge: one DELETE of the rows whose</text><text x="672" y="819" font-size="12" fill="#5b6270">source is not among the listed keys</text><rect x="660" y="857" width="270" height="107" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/><text x="672" y="879" font-size="13.5" font-weight="bold" fill="#16181d">Pinecone · customer’s own index</text><text x="672" y="898" font-size="12" fill="#a13b12">a third party: vectors and chunk text</text><text x="672" y="913" font-size="12" fill="#a13b12">leave the customer’s account</text><text x="672" y="928" font-size="12" fill="#5b6270">upsert by id, as with pgvector</text><text x="672" y="943" font-size="12" fill="#5b6270">purge: list ids, fetch their metadata,</text><text x="672" y="958" font-size="12" fill="#5b6270">delete the stale ones 50 at a time</text><polyline points="596,773 630,773" fill="none" stroke="#16181d" stroke-width="1.5"/><polyline points="596,886 630,886" fill="none" stroke="#16181d" stroke-width="1.5"/><line x1="630" y1="773" x2="630" y2="897" stroke="#16181d" stroke-width="1.5"/><polyline points="630,773 660,773" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><polyline points="630,897 660,897" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><polyline points="28,1074 72,1074" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><text x="82" y="1078" font-size="12.5" fill="#3d4350">call or write</text><polyline points="197.8,1074 241.8,1074" fill="none" stroke="#146b58" stroke-width="3.2" marker-end="url(#t-cust)"/><text x="251.8" y="1078" font-size="12.5" fill="#3d4350">document content</text><polyline points="387.4,1074 431.4,1074" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><text x="441.4" y="1078" font-size="12.5" fill="#3d4350">reply</text><rect x="504.4" y="1065" width="44" height="18" rx="3" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/><text x="558.4" y="1078" font-size="12.5" fill="#3d4350">outside the customer’s account</text></g>
</svg>
