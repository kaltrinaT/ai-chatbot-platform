<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 830" width="1300" height="830" role="img" aria-label="Per-tenant AWS infrastructure: a load balancer routes to frontend and backend Fargate tasks in a two-subnet VPC, with documents in S3 reachable for writing only through a docs-signer Lambda.">
  <rect x="0" y="0" width="1300" height="830" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13b12"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <!-- external actors -->
    <text x="390" y="30" font-size="12" font-weight="bold" text-anchor="middle">End user, public internet</text>
    <line x1="390" y1="38" x2="390" y2="148" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="402" y="106" font-size="10.5">HTTP :80</text>

    <rect x="740" y="14" width="316" height="42" rx="4" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.2"/>
    <text x="898" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4e9c">Platform (control plane)</text>

    <!-- account -->
    <rect x="40" y="70" width="1040" height="600" rx="6" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/>
    <text x="60" y="96" font-size="14" font-weight="bold" fill="#146b58">CUSTOMER AWS ACCOUNT — one per tenant, provisioned by terraform apply</text>

    <!-- vpc -->
    <rect x="70" y="116" width="640" height="534" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="86" y="138" font-size="11.5" font-weight="bold" fill="#5b6270">VPC 10.20.0.0/16 — internet gateway, public route table</text>

    <!-- alb -->
    <rect x="96" y="150" width="588" height="74" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="390" y="174" font-size="12.5" font-weight="bold" text-anchor="middle">Application Load Balancer, listener :80</text>
    <text x="390" y="194" font-size="10.5" fill="#5b6270" text-anchor="middle">default rule → frontend target group :80 · rule /api/* (priority 10) → backend target group :8000</text>
    <text x="390" y="212" font-size="10.5" fill="#5b6270" text-anchor="middle">health checks: GET / and GET /api/health, matcher 200–399</text>

    <text x="248" y="246" font-size="10.5">default rule</text>
    <text x="552" y="246" font-size="10.5">/api/* rule</text>

    <!-- subnets -->
    <rect x="96" y="256" width="284" height="152" rx="4" fill="#f6f7f9" stroke="#9aa1ad" stroke-width="1"/>
    <text x="108" y="274" font-size="10.5" fill="#5b6270">Public subnet A · 10.20.0.0/24 · AZ-0</text>
    <rect x="400" y="256" width="284" height="152" rx="4" fill="#f6f7f9" stroke="#9aa1ad" stroke-width="1"/>
    <text x="412" y="274" font-size="10.5" fill="#5b6270">Public subnet B · 10.20.1.0/24 · AZ-1</text>

    <line x1="238" y1="224" x2="238" y2="290" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="542" y1="224" x2="542" y2="290" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="112" y="292" width="252" height="100" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="238" y="314" font-size="12" font-weight="bold" text-anchor="middle">Frontend service</text>
    <text x="238" y="334" font-size="10.5" fill="#5b6270" text-anchor="middle">Fargate task, chat UI on nginx :80</text>
    <text x="238" y="352" font-size="10.5" fill="#5b6270" text-anchor="middle">image replicated into the</text>
    <text x="238" y="368" font-size="10.5" fill="#5b6270" text-anchor="middle">customer's own ECR</text>
    <text x="238" y="384" font-size="10.5" fill="#5b6270" text-anchor="middle">desired count 1</text>

    <rect x="416" y="292" width="252" height="100" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="542" y="314" font-size="12" font-weight="bold" text-anchor="middle">Backend service</text>
    <text x="542" y="334" font-size="10.5" fill="#5b6270" text-anchor="middle">Fargate task, FastAPI RAG :8000</text>
    <text x="542" y="352" font-size="10.5" fill="#5b6270" text-anchor="middle">execution role: read the LLM secret</text>
    <text x="542" y="368" font-size="10.5" fill="#5b6270" text-anchor="middle">task role: Get and List the docs</text>
    <text x="542" y="384" font-size="10.5" fill="#5b6270" text-anchor="middle">bucket, nothing else</text>

    <!-- rds option -->
    <rect x="96" y="440" width="588" height="86" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="390" y="464" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b6270">RDS PostgreSQL 16 with pgvector — only when vector_store = pgvector</text>
    <text x="390" y="484" font-size="10.5" fill="#5b6270" text-anchor="middle">db.t4g.micro, 32 GB encrypted storage, 1-day backups, not publicly accessible</text>
    <text x="390" y="502" font-size="10.5" fill="#5b6270" text-anchor="middle">connection URL and generated password stored in the tenant's own Secrets Manager</text>
    <text x="390" y="518" font-size="10.5" fill="#5b6270" text-anchor="middle">accepts 5432 from the task security group only</text>

    <line x1="542" y1="408" x2="542" y2="438" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="552" y="428" font-size="10.5">5432</text>

    <text x="96" y="562" font-size="11" font-weight="bold" fill="#5b6270">SECURITY GROUPS</text>
    <text x="96" y="582" font-size="10.5" fill="#5b6270">alb — ingress from 0.0.0.0/0 on port 80 only.</text>
    <text x="96" y="600" font-size="10.5" fill="#5b6270">task — ingress only from the alb group, on the frontend and container ports; egress open.</text>
    <text x="96" y="618" font-size="10.5" fill="#5b6270">vectors — ingress only from the task group, on 5432.</text>
    <text x="96" y="640" font-size="10.5" fill="#5b6270">Terraform state lives in the customer's own bucket, tfstate-{slug}-{account}-{region}-an.</text>

    <!-- right column -->
    <rect x="740" y="150" width="316" height="104" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="174" font-size="12" font-weight="bold" text-anchor="middle">S3 bucket — knowledge base</text>
    <text x="898" y="194" font-size="10.5" fill="#5b6270" text-anchor="middle">SSE-AES256, all public access blocked</text>
    <text x="898" y="212" font-size="10.5" fill="#5b6270" text-anchor="middle">CORS allows POST from the platform origin</text>
    <text x="898" y="230" font-size="10.5" fill="#5b6270" text-anchor="middle">so a browser can upload straight to it</text>
    <text x="898" y="248" font-size="10.5" fill="#5b6270" text-anchor="middle">force_destroy on teardown</text>

    <rect x="740" y="278" width="316" height="122" rx="4" fill="#fbeee5" stroke="#a13b12" stroke-width="1.4"/>
    <text x="898" y="302" font-size="12" font-weight="bold" text-anchor="middle" fill="#a13b12">docs-signer Lambda + function URL</text>
    <text x="898" y="322" font-size="10.5" fill="#5b6270" text-anchor="middle">role allows s3:PutObject and s3:DeleteObject</text>
    <text x="898" y="340" font-size="10.5" fill="#5b6270" text-anchor="middle">on this prefix — never GetObject, never</text>
    <text x="898" y="358" font-size="10.5" fill="#5b6270" text-anchor="middle">ListBucket — plus read of its own auth secret</text>
    <text x="898" y="378" font-size="10.5" fill="#5b6270" text-anchor="middle">mints presigned POSTs and performs deletes</text>
    <text x="898" y="394" font-size="10.5" fill="#5b6270" text-anchor="middle">on request</text>

    <rect x="740" y="424" width="316" height="104" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="448" font-size="12" font-weight="bold" text-anchor="middle">Secrets Manager</text>
    <text x="898" y="468" font-size="10.5" fill="#5b6270" text-anchor="middle">{slug}/llm-api-key</text>
    <text x="898" y="484" font-size="10.5" fill="#5b6270" text-anchor="middle">{slug}/docs-signer-secret</text>
    <text x="898" y="500" font-size="10.5" fill="#5b6270" text-anchor="middle">{slug}/pinecone-api-key · {slug}/vector-db-url</text>
    <text x="898" y="518" font-size="10.5" fill="#5b6270" text-anchor="middle">written once at onboarding; only ARNs travel</text>

    <rect x="740" y="552" width="316" height="76" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="898" y="576" font-size="12" font-weight="bold" text-anchor="middle">CloudWatch log group</text>
    <text x="898" y="596" font-size="10.5" fill="#5b6270" text-anchor="middle">/ecs/chatbot-{slug}, 14-day retention</text>
    <text x="898" y="614" font-size="10.5" fill="#5b6270" text-anchor="middle">both tasks and the Lambda log here; the platform reads none of it</text>

    <!-- cross arrows -->
    <line x1="668" y1="330" x2="736" y2="238" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="676" y="284" font-size="10.5">read documents</text>

    <line x1="738" y1="462" x2="670" y2="374" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="700" y="432" font-size="10.5" text-anchor="end">inject the LLM key</text>
    <text x="700" y="448" font-size="10.5" text-anchor="end">at task start</text>

    <line x1="898" y1="278" x2="898" y2="256" stroke="#a13b12" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="908" y="272" font-size="10.5" fill="#a13b12">write only</text>

    <polyline points="1056,35 1100,35 1100,340 1058,340" fill="none" stroke="#a13b12" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="1112" y="292" font-size="10.5" fill="#a13b12" font-weight="bold">HTTPS with a</text>
    <text x="1112" y="308" font-size="10.5" fill="#a13b12" font-weight="bold">shared-secret header</text>
    <text x="1112" y="328" font-size="10.5" fill="#5b6270">the only way the platform</text>
    <text x="1112" y="344" font-size="10.5" fill="#5b6270">ever touches this bucket,</text>
    <text x="1112" y="360" font-size="10.5" fill="#5b6270">and it cannot read from it</text>

    <!-- pinecone alternative -->
    <rect x="740" y="700" width="316" height="72" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="898" y="724" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b6270">Customer's own Pinecone project</text>
    <text x="898" y="744" font-size="10.5" fill="#5b6270" text-anchor="middle">serverless index chatbot-{slug}, 384 dimensions, cosine</text>
    <text x="898" y="762" font-size="10.5" fill="#5b6270" text-anchor="middle">only when vector_store = pinecone; billed to the customer</text>

    <polyline points="668,360 722,360 722,736 736,736" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#am)"/>
    <text x="712" y="690" font-size="10.5" fill="#5b6270" text-anchor="end">or queries Pinecone instead</text>

    <text x="40" y="800" font-size="11" fill="#5b6270">Each service runs a single task; ECS may place either task in either subnet. Dashed elements are the two mutually exclusive vector-store choices made at onboarding.</text>
    <text x="40" y="820" font-size="11" fill="#5b6270">Nothing in this account holds a credential pointing back at the platform, and the platform holds no credential that can read from it.</text>
  </g>
</svg>
