<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-label="Component overview: the operator's browser drives the Next.js platform, whose domain modules reach Postgres, GitHub and each customer's cloud, while end users reach the deployed chatbot directly.">
  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#146b58"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <!-- actors -->
    <rect x="80" y="34" width="300" height="56" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="230" y="58" font-size="12.5" font-weight="bold" text-anchor="middle">Operator browser</text>
    <text x="230" y="76" font-size="10.5" fill="#5b6270" text-anchor="middle">onboards and monitors tenants</text>

    <rect x="700" y="34" width="300" height="56" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="850" y="58" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#146b58">End user browser</text>
    <text x="850" y="76" font-size="10.5" fill="#5b6270" text-anchor="middle">talks only to the deployed chatbot</text>

    <line x1="230" y1="90" x2="230" y2="144" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="242" y="122" font-size="10.5">HTTPS, session cookie</text>

    <polyline points="1000,62 1092,62 1092,600 1034,600" fill="none" stroke="#146b58" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
    <text x="1084" y="524" font-size="10.5" fill="#146b58" text-anchor="end">chat traffic never</text>
    <text x="1084" y="540" font-size="10.5" fill="#146b58" text-anchor="end">reaches the platform</text>

    <!-- PLATFORM -->
    <rect x="60" y="144" width="1000" height="318" rx="6" fill="#eef3fb" stroke="#1f4e9c" stroke-width="1.5"/>
    <text x="80" y="170" font-size="15" font-weight="bold" fill="#1f4e9c">PLATFORM — Next.js 16 App Router on Node</text>

    <rect x="90" y="184" width="940" height="48" rx="4" fill="#ffffff" stroke="#1f4e9c" stroke-width="1"/>
    <text x="560" y="205" font-size="12.5" text-anchor="middle">Server-rendered pages: dashboard, tenant detail, onboarding wizard, documents, deployments, audit log, guides</text>
    <text x="560" y="223" font-size="10.5" fill="#5b6270" text-anchor="middle">React server components, with client islands for upload progress and live deployment polling</text>

    <g fill="#ffffff" stroke="#1f4e9c" stroke-width="1">
      <rect x="90" y="250" width="220" height="58" rx="4"/>
      <rect x="330" y="250" width="220" height="58" rx="4"/>
      <rect x="570" y="250" width="220" height="58" rx="4"/>
      <rect x="810" y="250" width="220" height="58" rx="4"/>
    </g>
    <g font-size="12.5" text-anchor="middle">
      <text x="200" y="274">NextAuth v5</text>
      <text x="440" y="274">Server actions</text>
      <text x="680" y="274">Route handlers</text>
      <text x="920" y="274">Drizzle ORM</text>
    </g>
    <g font-size="10.5" fill="#5b6270" text-anchor="middle">
      <text x="200" y="293">GitHub OAuth, owner scoping</text>
      <text x="440" y="293">Zod-validated mutations</text>
      <text x="680" y="293">status webhook, progress poll</text>
      <text x="920" y="293">typed schema and migrations</text>
    </g>

    <text x="90" y="334" font-size="11" font-weight="bold" fill="#5b6270">DOMAIN MODULES</text>
    <g fill="#ffffff" stroke="#1f4e9c" stroke-width="1">
      <rect x="90" y="346" width="176" height="96" rx="4"/>
      <rect x="281" y="346" width="176" height="96" rx="4"/>
      <rect x="472" y="346" width="176" height="96" rx="4"/>
      <rect x="663" y="346" width="176" height="96" rx="4"/>
      <rect x="854" y="346" width="176" height="96" rx="4"/>
    </g>
    <g font-size="12" text-anchor="middle" font-weight="bold">
      <text x="178" y="370">crypto</text>
      <text x="369" y="370">github + deploy</text>
      <text x="560" y="370">aws</text>
      <text x="751" y="370">azure</text>
      <text x="942" y="370">docsSigner</text>
    </g>
    <g font-size="10.5" fill="#5b6270" text-anchor="middle">
      <text x="178" y="392">AES-256-GCM</text>
      <text x="178" y="408">envelope for every</text>
      <text x="178" y="424">credential at rest</text>
      <text x="369" y="392">dispatches the run,</text>
      <text x="369" y="408">polls its progress,</text>
      <text x="369" y="424">reconciles lost webhooks</text>
      <text x="560" y="392">AssumeRole, then writes</text>
      <text x="560" y="408">secrets into the</text>
      <text x="560" y="424">customer's own account</text>
      <text x="751" y="392">no Azure calls at all;</text>
      <text x="751" y="408">signer secret</text>
      <text x="751" y="424">generation</text>
      <text x="942" y="392">calls the tenant's own</text>
      <text x="942" y="408">signer function over</text>
      <text x="942" y="424">HTTPS, no cloud SDK</text>
    </g>

    <!-- dependency edges -->
    <line x1="178" y1="462" x2="178" y2="558" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="188" y="500" font-size="10.5">SQL over the</text>
    <text x="188" y="516" font-size="10.5">serverless driver</text>

    <line x1="369" y1="462" x2="369" y2="558" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="379" y="500" font-size="10.5">workflow_dispatch,</text>
    <text x="379" y="516" font-size="10.5">run and job status</text>

    <line x1="570" y1="462" x2="570" y2="558" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="580" y="500" font-size="10.5">AssumeRole, secret</text>
    <text x="580" y="516" font-size="10.5">write, signer call</text>

    <line x1="752" y1="462" x2="752" y2="558" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="762" y="500" font-size="10.5">signer call only,</text>
    <text x="762" y="516" font-size="10.5">no Azure API</text>

    <line x1="933" y1="462" x2="933" y2="558" stroke="#8b93a1" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#am)"/>
    <text x="943" y="500" font-size="10.5" fill="#5b6270">created by Terraform</text>
    <text x="943" y="516" font-size="10.5" fill="#5b6270">during the run only</text>

    <!-- DEPENDENCIES -->
    <g fill="#ffffff" stroke="#2f343d" stroke-width="1.2">
      <rect x="90" y="558" width="176" height="90" rx="4"/>
      <rect x="281" y="558" width="176" height="90" rx="4"/>
    </g>
    <rect x="472" y="558" width="558" height="90" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#146b58" stroke-width="1">
      <rect x="486" y="574" width="168" height="60" rx="3"/>
      <rect x="668" y="574" width="168" height="60" rx="3"/>
      <rect x="850" y="574" width="166" height="60" rx="3"/>
    </g>

    <g font-size="12" text-anchor="middle" font-weight="bold">
      <text x="178" y="584">Neon Postgres</text>
      <text x="369" y="584">GitHub</text>
      <text x="570" y="596">Customer AWS</text>
      <text x="752" y="596">Customer Azure</text>
      <text x="933" y="596">Customer Pinecone</text>
    </g>
    <g font-size="10.5" fill="#5b6270" text-anchor="middle">
      <text x="178" y="604">tenants, deployments,</text>
      <text x="178" y="620">documents, drafts,</text>
      <text x="178" y="636">users and sessions</text>
      <text x="369" y="604">OAuth provider, and the</text>
      <text x="369" y="620">Actions runner that</text>
      <text x="369" y="636">executes Terraform</text>
      <text x="570" y="614">STS, Secrets Manager,</text>
      <text x="570" y="628">ECS, S3, Lambda</text>
      <text x="752" y="614">Key Vault, Container</text>
      <text x="752" y="628">Apps, Blob, Functions</text>
      <text x="933" y="614">the customer's own</text>
      <text x="933" y="628">project and index</text>
    </g>
    <text x="1030" y="666" font-size="10.5" fill="#146b58" text-anchor="end" font-weight="bold">DATA PLANE — customer-owned resources</text>

    <text x="60" y="690" font-size="11" fill="#5b6270">The platform holds long-lived credentials only for its own database and GitHub; access to a customer's cloud is assumed per operation and expires with the session.</text>
  </g>
</svg>
