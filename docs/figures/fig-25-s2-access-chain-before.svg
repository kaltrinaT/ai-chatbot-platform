<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 656" width="1240" height="656" role="img" aria-label="S2 access chain: the platform can read AWS tenant documents.">
  <rect x="0" y="0" width="1240" height="656" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="60" y="44" font-size="16" fill="#16181d" font-weight="bold">Can the platform reach an AWS tenant's documents? (test S2)</text><text x="60" y="66" font-size="11.5" fill="#5b6270">Each step was evaluated against the deployed control-plane policy and the bootstrap template (run of 10 Oct 2026). If every step holds, the platform can read the documents.</text><rect x="60" y="92" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="112" r="11" fill="#3d4350"/><text x="80" y="116.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="102" y="116" font-size="12.5" fill="#16181d">The platform role may call sts:AssumeRole on the tenant's deployment role</text><text x="102" y="134" font-size="10.5" fill="#898781">infra/platform/control-plane/terraform.tfstate (deployed, state serial 9)</text><rect x="796" y="104" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="122.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="144" x2="80" y2="158" stroke="#898781" stroke-width="1.5"/><path d="M75,153 L80,159 L85,153" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="160" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="180" r="11" fill="#3d4350"/><text x="80" y="184.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="102" y="184" font-size="12.5" fill="#16181d">The deployment role trusts the platform account when it sends the tenant ID as ExternalId</text><text x="102" y="202" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:254</text><rect x="796" y="172" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="190.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="212" x2="80" y2="226" stroke="#898781" stroke-width="1.5"/><path d="M75,221 L80,227 L85,221" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="228" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="248" r="11" fill="#3d4350"/><text x="80" y="252.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="102" y="252" font-size="12.5" fill="#16181d">The platform knows that ExternalId: it is the tenant's own ID, stored as the tenant row's key</text><text x="102" y="270" font-size="10.5" fill="#898781">src/app/tenants/new/actions.ts:270; src/lib/awsTrust.ts:68</text><rect x="796" y="240" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="258.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="280" x2="80" y2="294" stroke="#898781" stroke-width="1.5"/><path d="M75,289 L80,295 L85,289" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="296" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="316" r="11" fill="#3d4350"/><text x="80" y="320.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="102" y="320" font-size="12.5" fill="#16181d">The deployment role may read a document</text><text x="102" y="338" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:291</text><rect x="796" y="308" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="326.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="348" x2="80" y2="362" stroke="#898781" stroke-width="1.5"/><path d="M75,357 L80,363 L85,357" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="364" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="384" r="11" fill="#3d4350"/><text x="80" y="388.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="102" y="388" font-size="12.5" fill="#16181d">The deployment role may list the documents bucket</text><text x="102" y="406" font-size="10.5" fill="#898781">infra/bootstrap/aws/tenant-bootstrap.yaml:291</text><rect x="796" y="376" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="394.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="416" x2="80" y2="430" stroke="#898781" stroke-width="1.5"/><path d="M75,425 L80,431 L85,425" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="432" width="720" height="52" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="452" r="11" fill="#3d4350"/><text x="80" y="456.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="102" y="456" font-size="12.5" fill="#16181d">No bucket policy on the documents bucket denies the deployment role</text><text x="102" y="474" font-size="10.5" fill="#898781">infra/terraform/main.tf declares no aws_s3_bucket_policy for aws_s3_bucket.docs</text><rect x="796" y="444" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="462.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><line x1="80" y1="484" x2="80" y2="498" stroke="#898781" stroke-width="1.5"/><path d="M75,493 L80,499 L85,493" fill="none" stroke="#898781" stroke-width="1.5"/><rect x="60" y="500" width="720" height="68" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><circle cx="80" cy="520" r="11" fill="#3d4350"/><text x="80" y="524.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">7</text><text x="102" y="524" font-size="12.5" fill="#16181d">No permissions boundary caps the deployment role itself (the runtime boundary applies only to the</text><text x="102" y="540" font-size="12.5" fill="#16181d">roles it creates)</text><text x="102" y="558" font-size="10.5" fill="#898781">DeploymentRole has no PermissionsBoundary (infra/bootstrap/aws/tenant-bootstrap.yaml:201)</text><rect x="796" y="520" width="64" height="28" rx="4" fill="#f8ebe5" stroke="#a13b12" stroke-width="1"/><text x="828" y="538.5" font-size="12" fill="#16181d" font-weight="bold" text-anchor="middle">Yes</text><rect x="60" y="586" width="800" height="40" rx="6" fill="#a13b12"/><path d="M75.5,601.5 L84.5,610.5 M84.5,601.5 L75.5,610.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><text x="98" y="611" font-size="13" fill="#ffffff" font-weight="bold">Every step holds, so the platform can read every AWS tenant's documents. The claim fails.</text><text x="900" y="100" font-size="13" fill="#16181d" font-weight="bold">Negative controls</text><text x="900" y="118" font-size="11" fill="#5b6270">Each must be refused; otherwise the</text><text x="900" y="133" font-size="11" fill="#5b6270">evaluator would be too permissive to</text><text x="900" y="148" font-size="11" fill="#5b6270">trust.</text><polyline points="902,175 905.5,179 912.5,170.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="179" font-size="11.5" fill="#3d4350">Another tenant's ExternalId is refused</text><text x="920" y="194" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,214 905.5,218 912.5,209.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="218" font-size="11.5" fill="#3d4350">A request without ExternalId is</text><text x="920" y="233" font-size="11.5" fill="#3d4350">refused</text><text x="920" y="248" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,268 905.5,272 912.5,263.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="272" font-size="11.5" fill="#3d4350">A principal in another AWS account is</text><text x="920" y="287" font-size="11.5" fill="#3d4350">refused</text><text x="920" y="302" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,322 905.5,326 912.5,317.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="326" font-size="11.5" fill="#3d4350">The platform role may not assume a</text><text x="920" y="341" font-size="11.5" fill="#3d4350">role outside chatbot-client-deploy-*</text><text x="920" y="356" font-size="10.5" fill="#898781">Refused (ImplicitDeny)</text><polyline points="902,376 905.5,380 912.5,371.5" fill="none" stroke="#146b58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="380" font-size="11.5" fill="#3d4350">The deployment role may not edit its</text><text x="920" y="395" font-size="11.5" fill="#3d4350">own IAM role</text><text x="920" y="410" font-size="10.5" fill="#898781">Refused (ExplicitDeny)</text><text x="900" y="444" font-size="13" fill="#16181d" font-weight="bold">Who holds step 1</text><text x="900" y="464" font-size="11.5" fill="#3d4350">• The operator's AWS sign-in session</text><text x="900" y="479" font-size="11.5" fill="#3d4350">(temporary credentials only)</text><text x="900" y="502" font-size="11.5" fill="#3d4350">• The hosted platform on Vercel,</text><text x="900" y="517" font-size="11.5" fill="#3d4350">production environment only (OIDC)</text></g>
</svg>
