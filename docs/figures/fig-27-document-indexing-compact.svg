<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="Document indexing: after an upload or delete, the control plane makes one HTTP call to the tenant’s own chatbot backend, which lists and downloads every document under the prefix, extracts text, chunks and embeds each document on its own CPU, upserts the vectors into pgvector or the customer’s Pinecone index, purges the vectors of documents no longer in storage, and replies. No document content reaches the control plane.">
  <rect x="0" y="0" width="960" height="680" fill="#ffffff"/>
  <defs><marker id="f-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker><marker id="o-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#16181d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="t-cust" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="232" height="618" rx="6" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><path d="M266,16 H938 Q944,16 944,22 V486 H646 V628 Q646,634 640,634 H266 Q260,634 260,628 V22 Q260,16 266,16 Z" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/><text x="132" y="38" font-size="13" font-weight="bold" text-anchor="middle" fill="#3d4350">CONTROL PLANE</text><text x="132" y="58" font-size="12" text-anchor="middle" fill="#5b6270">Next.js server actions</text><text x="278" y="38" font-size="13" font-weight="bold" fill="#146b58">CUSTOMER CLOUD ACCOUNT</text><text x="437" y="60" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3d4350">Chatbot backend container</text><text x="795" y="60" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3d4350">Storage</text><rect x="28" y="76" width="208" height="86" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="96" font-size="13.5" font-weight="bold" fill="#16181d">Trigger the reindex</text><text x="40" y="113" font-size="12" fill="#5b6270">after an upload is confirmed,</text><text x="40" y="127" font-size="12" fill="#5b6270">or a delete via the signer:</text><text x="40" y="141" font-size="12" fill="#5b6270">POST /api/index, waits ≤ 120 s</text><text x="40" y="155" font-size="12" fill="#5b6270">no credential, no file content</text><rect x="278" y="76" width="318" height="58" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="91.5" r="9" fill="#3d4350"/><text x="295" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="312" y="96" font-size="13.5" font-weight="bold" fill="#16181d">Admit</text><text x="312" y="113" font-size="12" fill="#5b6270">one at a time, one queued, others get 202</text><text x="312" y="127" font-size="12" fill="#5b6270">tenant, bucket, prefix from env, not body</text><polyline points="236,104 278,104" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="660" y="76" width="270" height="52" rx="3" fill="#f7f7f4" stroke="#c9c8bf" stroke-width="1"/><text x="795" y="93" font-size="12" text-anchor="middle" fill="#3d4350">Every call re-indexes every document</text><text x="795" y="107" font-size="12" text-anchor="middle" fill="#3d4350">under the prefix, not just the one that</text><text x="795" y="121" font-size="12" text-anchor="middle" fill="#3d4350">changed: cost grows with document count.</text><rect x="278" y="148" width="318" height="44" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="163.5" r="9" fill="#3d4350"/><text x="295" y="168" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="312" y="168" font-size="13.5" font-weight="bold" fill="#16181d">List</text><text x="312" y="185" font-size="12" fill="#5b6270">every object under the prefix, all pages</text><polyline points="437,134 437,148" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="206" width="318" height="58" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="221.5" r="9" fill="#3d4350"/><text x="295" y="226" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="312" y="226" font-size="13.5" font-weight="bold" fill="#16181d">Download and extract text</text><text x="312" y="243" font-size="12" fill="#5b6270">.txt · .pdf (PyMuPDF) · .docx (python-docx)</text><text x="312" y="257" font-size="12" fill="#5b6270">any other file type is skipped</text><polyline points="437,192 437,206" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="306" width="318" height="44" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="321.5" r="9" fill="#3d4350"/><text x="295" y="326" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="312" y="326" font-size="13.5" font-weight="bold" fill="#16181d">Chunk</text><text x="312" y="343" font-size="12" fill="#5b6270">200-word windows, 40 words overlapping</text><polyline points="437,264 437,306" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="362" width="318" height="44" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="377.5" r="9" fill="#3d4350"/><text x="295" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="312" y="382" font-size="13.5" font-weight="bold" fill="#16181d">Embed</text><text x="312" y="399" font-size="12" fill="#5b6270">all-MiniLM-L6-v2 on CPU → 384-dim vectors</text><polyline points="437,350 437,362" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="418" width="318" height="58" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="433.5" r="9" fill="#3d4350"/><text x="295" y="438" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="312" y="438" font-size="13.5" font-weight="bold" fill="#16181d">Upsert</text><text x="312" y="455" font-size="12" fill="#5b6270">id {tenant}-{key}-{n}: reruns overwrite</text><text x="312" y="469" font-size="12" fill="#5b6270">metadata: tenant, source key, chunk text</text><polyline points="437,406 437,418" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="268" y="278" width="338" height="210" fill="none" stroke="#3d4350" stroke-width="1.1"/><path d="M268,278 h52 v12 l-7,7 h-45 z" fill="#ffffff" stroke="#3d4350" stroke-width="1.1"/><text x="276" y="292" font-size="12" font-weight="bold" fill="#3d4350">loop</text><text x="596" y="293" font-size="12.5" font-weight="bold" text-anchor="end" fill="#3d4350">[for each document]</text><rect x="278" y="502" width="318" height="44" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="517.5" r="9" fill="#3d4350"/><text x="295" y="522" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="312" y="522" font-size="13.5" font-weight="bold" fill="#16181d">Purge</text><text x="312" y="539" font-size="12" fill="#5b6270">delete vectors of documents no longer stored</text><polyline points="437,476 437,502" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="278" y="560" width="318" height="44" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><circle cx="295" cy="575.5" r="9" fill="#3d4350"/><text x="295" y="580" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><text x="312" y="580" font-size="13.5" font-weight="bold" fill="#16181d">Respond</text><text x="312" y="597" font-size="12" fill="#5b6270">200, or 400/502 storage, 500 configuration</text><polyline points="437,546 437,560" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><rect x="28" y="560" width="208" height="58" rx="4" fill="#ffffff" stroke="#3d4350" stroke-width="1.2"/><text x="40" y="580" font-size="13.5" font-weight="bold" fill="#16181d">Operator sees outcome</text><text x="40" y="597" font-size="12" fill="#5b6270">done on 200 or 202; otherwise</text><text x="40" y="611" font-size="12" fill="#5b6270">a warning: the index is stale</text><polyline points="278,588 236,588" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><line x1="50" y1="162" x2="50" y2="560" stroke="#5b6270" stroke-width="1.5" stroke-dasharray="2 4"/><text x="64" y="347" font-size="12" fill="#5b6270">the server action</text><text x="64" y="361" font-size="12" fill="#5b6270">waits on this call</text><text x="64" y="375" font-size="12" fill="#5b6270">while the resync runs</text><rect x="660" y="148" width="270" height="116" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="672" y="168" font-size="13.5" font-weight="bold" fill="#16181d">Document store</text><text x="672" y="185" font-size="12" fill="#5b6270">S3 bucket or Blob container, private;</text><text x="672" y="199" font-size="12" fill="#5b6270">the file came straight from the browser</text><text x="672" y="213" font-size="12" fill="#5b6270">chatbot can list and read, never write;</text><text x="672" y="227" font-size="12" fill="#5b6270">the signer writes, never reads</text><polyline points="596,170 660,170" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><text x="628" y="163" font-size="11.5" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">list</text><text x="628" y="163" font-size="11.5" text-anchor="middle" fill="#16181d">list</text><polyline points="660,242 596,242" fill="none" stroke="#146b58" stroke-width="3.2" marker-end="url(#t-cust)"/><text x="628" y="233" font-size="11.5" font-weight="bold" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">file bytes</text><text x="628" y="233" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#146b58">file bytes</text><text x="660" y="394" font-size="12.5" font-weight="bold" fill="#3d4350">VECTOR STORE</text><text x="660" y="409" font-size="12" fill="#5b6270">one of the two, chosen at onboarding</text><rect x="660" y="418" width="270" height="58" rx="4" fill="#ffffff" stroke="#146b58" stroke-width="1.2"/><text x="672" y="438" font-size="13.5" font-weight="bold" fill="#16181d">pgvector · in this account</text><text x="672" y="455" font-size="12" fill="#5b6270">Postgres on the private network</text><text x="672" y="469" font-size="12" fill="#5b6270">upsert by id; purge: one DELETE</text><rect x="660" y="500" width="270" height="72" rx="4" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/><text x="672" y="520" font-size="13.5" font-weight="bold" fill="#16181d">Pinecone · customer’s own index</text><text x="672" y="537" font-size="12" fill="#a13b12">third party: vectors and chunk text</text><text x="672" y="551" font-size="12" fill="#a13b12">leave the customer’s account</text><text x="672" y="565" font-size="12" fill="#5b6270">purge: list ids, delete 50 at a time</text><polyline points="596,446 630,446" fill="none" stroke="#16181d" stroke-width="1.5"/><polyline points="596,530 630,530" fill="none" stroke="#16181d" stroke-width="1.5"/><line x1="630" y1="446" x2="630" y2="530" stroke="#16181d" stroke-width="1.5"/><polyline points="630,446 660,446" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><polyline points="630,528 660,528" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><polyline points="28,658 72,658" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#f-ink)"/><text x="82" y="662" font-size="12.5" fill="#3d4350">call or write</text><polyline points="197.8,658 241.8,658" fill="none" stroke="#146b58" stroke-width="3.2" marker-end="url(#t-cust)"/><text x="251.8" y="662" font-size="12.5" fill="#3d4350">document content</text><polyline points="387.4,658 431.4,658" fill="none" stroke="#16181d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o-ink)"/><text x="441.4" y="662" font-size="12.5" fill="#3d4350">reply</text><rect x="504.4" y="649" width="44" height="18" rx="3" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/><text x="558.4" y="662" font-size="12.5" fill="#3d4350">outside the customer’s account</text></g>
</svg>
