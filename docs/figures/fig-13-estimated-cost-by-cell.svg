<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="Estimated monthly cost per tenant for the four configuration cells: compute dominates every cell, AWS carries a fixed load balancer charge that Azure bundles into compute, and keeping embeddings in the customer's account adds fourteen dollars a month on AWS and seventeen on Azure.">
  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <text x="60" y="44" font-size="16" font-weight="bold">Estimated monthly cost of one tenant, by configuration cell</text>
    <text x="60" y="66" font-size="11.5" fill="#5b6270">List prices for an idle tenant, as the onboarding estimator computes them. Bars show the low estimate; the whisker runs to the high estimate.</text>

    <!-- legend -->
    <g>
      <rect x="170" y="80" width="12" height="12" rx="2" fill="#2a78d6"/>
      <text x="190" y="91" font-size="11" fill="#3d4350">Compute — the application containers</text>
      <rect x="420" y="80" width="12" height="12" rx="2" fill="#eb6834"/>
      <text x="440" y="91" font-size="11" fill="#3d4350">Ingress — load balancer</text>
      <rect x="620" y="80" width="12" height="12" rx="2" fill="#1baf7a"/>
      <text x="640" y="91" font-size="11" fill="#3d4350">Vector database, inside the customer's account</text>
      <rect x="900" y="80" width="12" height="12" rx="2" fill="#b9b6b0"/>
      <text x="920" y="91" font-size="11" fill="#3d4350">All other services</text>
    </g>

    <!-- y axis -->
    <g stroke="#e1e0d9" stroke-width="1">
      <line x1="170" y1="422" x2="700" y2="422"/>
      <line x1="170" y1="344" x2="700" y2="344"/>
      <line x1="170" y1="266" x2="700" y2="266"/>
      <line x1="170" y1="188" x2="700" y2="188"/>
      <line x1="170" y1="110" x2="700" y2="110"/>
    </g>
    <g font-size="10.5" fill="#898781" text-anchor="end">
      <text x="162" y="504">0</text>
      <text x="162" y="426">20</text>
      <text x="162" y="348">40</text>
      <text x="162" y="270">60</text>
      <text x="162" y="192">80</text>
      <text x="162" y="114">$100</text>
    </g>
    <line x1="170" y1="500" x2="700" y2="500" stroke="#c3c2b7" stroke-width="1.5"/>

    <!-- A1 -->
    <rect x="207" y="324.5" width="76" height="175.5" fill="#2a78d6"/>
    <rect x="207" y="252.3" width="76" height="70.2" fill="#eb6834"/>
    <rect x="207" y="237.4" width="76" height="12.9" fill="#b9b6b0"/>
    <text x="245" y="418" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">45</text>
    <text x="245" y="292" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">18</text>
    <line x1="245" y1="235" x2="245" y2="199.7" stroke="#52514e" stroke-width="1.2"/>
    <line x1="235" y1="199.7" x2="255" y2="199.7" stroke="#52514e" stroke-width="1.2"/>
    <text x="245" y="190" font-size="12" font-weight="bold" text-anchor="middle">66–77</text>

    <!-- A2 -->
    <rect x="317" y="324.5" width="76" height="175.5" fill="#2a78d6"/>
    <rect x="317" y="252.3" width="76" height="70.2" fill="#eb6834"/>
    <rect x="317" y="194.5" width="76" height="55.8" fill="#1baf7a"/>
    <rect x="317" y="181.2" width="76" height="11.3" fill="#b9b6b0"/>
    <text x="355" y="418" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">45</text>
    <text x="355" y="292" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">18</text>
    <text x="355" y="227" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">14</text>
    <line x1="355" y1="178.6" x2="355" y2="145.1" stroke="#52514e" stroke-width="1.2"/>
    <line x1="345" y1="145.1" x2="365" y2="145.1" stroke="#52514e" stroke-width="1.2"/>
    <text x="355" y="136" font-size="12" font-weight="bold" text-anchor="middle">80–91</text>

    <!-- B1 -->
    <rect x="427" y="269.9" width="76" height="230.1" fill="#2a78d6"/>
    <rect x="427" y="242.5" width="76" height="25.4" fill="#b9b6b0"/>
    <text x="465" y="390" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">59</text>
    <line x1="465" y1="240" x2="465" y2="207.5" stroke="#52514e" stroke-width="1.2"/>
    <line x1="455" y1="207.5" x2="475" y2="207.5" stroke="#52514e" stroke-width="1.2"/>
    <text x="465" y="198" font-size="12" font-weight="bold" text-anchor="middle">66–75</text>

    <!-- B2 -->
    <rect x="537" y="269.9" width="76" height="230.1" fill="#2a78d6"/>
    <rect x="537" y="201.6" width="76" height="66.3" fill="#1baf7a"/>
    <rect x="537" y="174.2" width="76" height="25.4" fill="#b9b6b0"/>
    <text x="575" y="390" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">59</text>
    <text x="575" y="239" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">17</text>
    <line x1="575" y1="172" x2="575" y2="141.2" stroke="#52514e" stroke-width="1.2"/>
    <line x1="565" y1="141.2" x2="585" y2="141.2" stroke="#52514e" stroke-width="1.2"/>
    <text x="575" y="132" font-size="12" font-weight="bold" text-anchor="middle">83–92</text>

    <!-- x labels -->
    <g text-anchor="middle">
      <text x="245" y="522" font-size="12.5" font-weight="bold">A1</text>
      <text x="355" y="522" font-size="12.5" font-weight="bold">A2</text>
      <text x="465" y="522" font-size="12.5" font-weight="bold">B1</text>
      <text x="575" y="522" font-size="12.5" font-weight="bold">B2</text>
      <text x="245" y="540" font-size="10.5" fill="#52514e">AWS · Pinecone</text>
      <text x="355" y="540" font-size="10.5" fill="#52514e">AWS · pgvector</text>
      <text x="465" y="540" font-size="10.5" fill="#52514e">Azure · Pinecone</text>
      <text x="575" y="540" font-size="10.5" fill="#52514e">Azure · pgvector</text>
    </g>

    <!-- table -->
    <text x="748" y="112" font-size="11" font-weight="bold" fill="#5b6270">EVERY LINE THE ESTIMATOR PRODUCES, US$ PER MONTH</text>
    <text x="995" y="134" font-size="11" font-weight="bold" text-anchor="middle">AWS</text>
    <text x="1135" y="134" font-size="11" font-weight="bold" text-anchor="middle">Azure</text>
    <line x1="928" y1="140" x2="1062" y2="140" stroke="#c3c2b7" stroke-width="1"/>
    <line x1="1068" y1="140" x2="1180" y2="140" stroke="#c3c2b7" stroke-width="1"/>
    <g font-size="10.5" fill="#5b6270" text-anchor="end">
      <text x="960" y="158">A1</text>
      <text x="1030" y="158">A2</text>
      <text x="1100" y="158">B1</text>
      <text x="1170" y="158">B2</text>
    </g>
    <line x1="748" y1="166" x2="1180" y2="166" stroke="#c3c2b7" stroke-width="1"/>

    <g font-size="10.5" fill="#3d4350">
      <text x="748" y="188">Compute — backend container</text>
      <text x="748" y="212">Compute — frontend container</text>
      <text x="748" y="236">Ingress — load balancer</text>
      <text x="748" y="260">Container registry</text>
      <text x="748" y="284">Secret store</text>
      <text x="748" y="308">Document storage</text>
      <text x="748" y="332">Logs</text>
      <text x="748" y="356">Vector database</text>
    </g>
    <g font-size="10.5" fill="#16181d" text-anchor="end">
      <text x="960" y="188">36</text><text x="1030" y="188">36</text><text x="1100" y="188">39</text><text x="1170" y="188">39</text>
      <text x="960" y="212">9</text><text x="1030" y="212">9</text><text x="1100" y="212">20</text><text x="1170" y="212">20</text>
      <text x="960" y="236">18–22</text><text x="1030" y="236">18–22</text><text x="1100" y="236" fill="#898781">incl.</text><text x="1170" y="236" fill="#898781">incl.</text>
      <text x="960" y="260">1</text><text x="1030" y="260">1</text><text x="1100" y="260">5</text><text x="1170" y="260">5</text>
      <text x="960" y="284">0.8</text><text x="1030" y="284">0.4</text><text x="1100" y="284">0.5</text><text x="1170" y="284">0.5</text>
      <text x="960" y="308">0.5–5</text><text x="1030" y="308">0.5–5</text><text x="1100" y="308">1–5</text><text x="1170" y="308">1–5</text>
      <text x="960" y="332">1–3</text><text x="1030" y="332">1–3</text><text x="1100" y="332">0–5</text><text x="1170" y="332">0–5</text>
      <text x="960" y="356" fill="#898781">—</text><text x="1030" y="356">14.3</text><text x="1100" y="356" fill="#898781">—</text><text x="1170" y="356">17</text>
    </g>
    <line x1="748" y1="368" x2="1180" y2="368" stroke="#c3c2b7" stroke-width="1"/>
    <text x="748" y="390" font-size="11" font-weight="bold">Total</text>
    <g font-size="11" font-weight="bold" text-anchor="end">
      <text x="960" y="390">66–77</text>
      <text x="1030" y="390">80–91</text>
      <text x="1100" y="390">66–75</text>
      <text x="1170" y="390">83–92</text>
    </g>

    <text x="748" y="418" font-size="10" fill="#898781">Azure marks ingress as included: Container Apps bills ingress inside the compute price,</text>
    <text x="748" y="432" font-size="10" fill="#898781">while AWS charges a fixed hourly load balancer regardless of traffic.</text>
    <text x="748" y="452" font-size="10" fill="#898781">Neither the Pinecone subscription nor the LLM API appears here: both are billed to the</text>
    <text x="748" y="466" font-size="10" fill="#898781">customer by their own providers and never reach the cloud bill.</text>

    <!-- captions -->
    <text x="60" y="580" font-size="11" fill="#5b6270">Source: the estimator in src/lib/pricing.ts, evaluated for all four cells. These are list prices at the Terraform sizing defaults for an idle tenant, not measured spend — validating them against real</text>
    <text x="60" y="600" font-size="11" fill="#5b6270">billing data is evaluation axis 4, and this figure is the estimate side of that comparison.</text>
    <text x="60" y="624" font-size="11" fill="#5b6270">Two results are already visible without any measurement. Compute dominates every cell, so the isolation model's cost is mostly the cost of running one always-on tenant. And keeping</text>
    <text x="60" y="644" font-size="11" fill="#5b6270">embeddings inside the customer's account costs $14 a month on AWS and $17 on Azure — the price of closing the residency gap that the third-party index leaves open.</text>
  </g>
</svg>
