<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" role="img" aria-label="Credential path compared: on AWS only a secret ARN passes through CI, while on Azure the secret value itself passes through the run because the tenant's Key Vault does not exist until Terraform creates it.">
  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <rect x="310" y="34" width="500" height="56" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
    <text x="560" y="58" font-size="12.5" font-weight="bold" text-anchor="middle">Onboarding form — plaintext in the operator's browser</text>
    <text x="560" y="78" font-size="10.5" fill="#5b6270" text-anchor="middle">LLM API key, Pinecone API key, Azure client secret</text>

    <line x1="560" y1="90" x2="560" y2="126" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="310" y="128" width="500" height="62" rx="4" fill="#fbeee5" stroke="#a13b12" stroke-width="1.4"/>
    <text x="560" y="152" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#a13b12">AES-256-GCM envelope, stored on the tenant row</text>
    <text x="560" y="172" font-size="10.5" fill="#5b6270" text-anchor="middle">random 12-byte IV per call, stored as iv : authTag : ciphertext</text>

    <polyline points="560,190 560,212 305,212 305,238" fill="none" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <polyline points="560,190 560,212 815,212 815,238" fill="none" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

    <text x="305" y="206" font-size="13" font-weight="bold" text-anchor="middle" fill="#146b58">AWS TENANT</text>
    <text x="815" y="206" font-size="13" font-weight="bold" text-anchor="middle" fill="#146b58">AZURE TENANT</text>

    <!-- AWS column -->
    <g>
      <rect x="70" y="240" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="305" y="264" font-size="12" font-weight="bold" text-anchor="middle">Assume the customer's deployment role</text>
      <text x="305" y="284" font-size="10.5" fill="#5b6270" text-anchor="middle">a 15-minute session, at onboarding time</text>

      <line x1="305" y1="302" x2="305" y2="316" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="70" y="318" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="305" y="342" font-size="12" font-weight="bold" text-anchor="middle">Write the value into their Secrets Manager</text>
      <text x="305" y="362" font-size="10.5" fill="#5b6270" text-anchor="middle">only the resulting ARN is returned and stored</text>

      <line x1="305" y1="380" x2="305" y2="394" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="70" y="396" width="470" height="62" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1.6"/>
      <text x="305" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#146b58">The run receives an ARN, not a secret</text>
      <text x="305" y="440" font-size="10.5" fill="#5b6270" text-anchor="middle">no tenant key is ever visible to GitHub Actions</text>

      <line x1="305" y1="458" x2="305" y2="472" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="70" y="474" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="305" y="498" font-size="12" font-weight="bold" text-anchor="middle">Terraform binds the ARN to the task definition</text>
      <text x="305" y="518" font-size="10.5" fill="#5b6270" text-anchor="middle">as a secret reference, still not a value</text>

      <line x1="305" y1="536" x2="305" y2="550" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="70" y="552" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="305" y="576" font-size="12" font-weight="bold" text-anchor="middle">The execution role resolves it at task start</text>
      <text x="305" y="596" font-size="10.5" fill="#5b6270" text-anchor="middle">injected as an environment secret by ECS</text>
    </g>

    <!-- AZURE column -->
    <g>
      <rect x="580" y="240" width="470" height="62" rx="4" fill="#f6f7f9" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="6 4"/>
      <text x="815" y="264" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b6270">No cloud call is possible at onboarding</text>
      <text x="815" y="284" font-size="10.5" fill="#5b6270" text-anchor="middle">the tenant has no vault until Terraform creates one</text>

      <line x1="815" y1="302" x2="815" y2="316" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="580" y="318" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="815" y="342" font-size="12" font-weight="bold" text-anchor="middle">At deploy time the platform decrypts its copy</text>
      <text x="815" y="362" font-size="10.5" fill="#5b6270" text-anchor="middle">this repeats on every redeploy, not just the first</text>

      <line x1="815" y1="380" x2="815" y2="394" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="580" y="396" width="470" height="62" rx="4" fill="#fbeee5" stroke="#a13b12" stroke-width="1.6"/>
      <text x="815" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#a13b12">The run receives the secret value itself</text>
      <text x="815" y="440" font-size="10.5" fill="#5b6270" text-anchor="middle">masked in the log, but present in the runner's memory</text>

      <line x1="815" y1="458" x2="815" y2="472" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="580" y="474" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="815" y="498" font-size="12" font-weight="bold" text-anchor="middle">Terraform writes it into the new Key Vault</text>
      <text x="815" y="518" font-size="10.5" fill="#5b6270" text-anchor="middle">the vault and its contents are created in one apply</text>

      <line x1="815" y1="536" x2="815" y2="550" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>

      <rect x="580" y="552" width="470" height="62" rx="4" fill="#ffffff" stroke="#2f343d" stroke-width="1.2"/>
      <text x="815" y="576" font-size="12" font-weight="bold" text-anchor="middle">The Container App resolves the reference</text>
      <text x="815" y="596" font-size="10.5" fill="#5b6270" text-anchor="middle">re-resolved for each new revision</text>
    </g>

    <polyline points="305,614 305,638 560,638 560,660" fill="none" stroke="#2f343d" stroke-width="1.4" marker-end="url(#a)"/>
    <polyline points="815,614 815,638 560,638 560,660" fill="none" stroke="#2f343d" stroke-width="1.4"/>

    <rect x="240" y="662" width="640" height="56" rx="4" fill="#e9f3ef" stroke="#146b58" stroke-width="1.5"/>
    <text x="560" y="686" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#146b58">Plaintext exists only inside the running container</text>
    <text x="560" y="706" font-size="10.5" fill="#5b6270" text-anchor="middle">in the customer's own account, on both clouds</text>

    <text x="70" y="748" font-size="11" fill="#5b6270">One credential is deliberately exempt from this shape: the docs-signer shared secret. The platform keeps a decryptable copy because it must present that</text>
    <text x="70" y="766" font-size="11" fill="#5b6270">secret on every upload and delete. Re-reading it from the tenant's cloud each time would mean holding tenant cloud credentials continuously.</text>
    <text x="70" y="788" font-size="11" fill="#5b6270">Residual risk, identical on both clouds: whoever holds the platform's encryption key and its database can recover any stored credential.</text>
  </g>
</svg>
