<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 980" width="1120" height="980" role="img" aria-label="Sequence of tenant onboarding and deployment: the platform encrypts credentials, writes them into the customer's own secret store, dispatches a workflow, and learns the outcome from a status callback or by polling the run.">
  <rect x="0" y="0" width="1120" height="980" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f343d"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13b12"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#16181d">

    <!-- lifeline heads -->
    <g stroke-width="1.2">
      <rect x="40" y="36" width="140" height="46" rx="4" fill="#ffffff" stroke="#2f343d"/>
      <rect x="250" y="36" width="180" height="46" rx="4" fill="#eef3fb" stroke="#1f4e9c"/>
      <rect x="460" y="36" width="160" height="46" rx="4" fill="#eef3fb" stroke="#1f4e9c"/>
      <rect x="660" y="36" width="200" height="46" rx="4" fill="#ffffff" stroke="#2f343d"/>
      <rect x="890" y="36" width="200" height="46" rx="4" fill="#e9f3ef" stroke="#146b58"/>
    </g>
    <g font-size="12.5" font-weight="bold" text-anchor="middle">
      <text x="110" y="58">Operator</text>
      <text x="340" y="58">Platform</text>
      <text x="540" y="58">Neon Postgres</text>
      <text x="760" y="58">GitHub Actions</text>
      <text x="990" y="58">Customer cloud</text>
    </g>
    <g font-size="10" fill="#5b6270" text-anchor="middle">
      <text x="110" y="74">browser</text>
      <text x="340" y="74">Next.js server</text>
      <text x="540" y="74">control-plane state</text>
      <text x="760" y="74">platform CI runner</text>
      <text x="990" y="74">AWS or Azure account</text>
    </g>

    <!-- lifelines -->
    <g stroke="#c3c8d1" stroke-width="1" stroke-dasharray="3 4">
      <line x1="110" y1="82" x2="110" y2="892"/>
      <line x1="340" y1="82" x2="340" y2="892"/>
      <line x1="540" y1="82" x2="540" y2="892"/>
      <line x1="760" y1="82" x2="760" y2="892"/>
      <line x1="990" y1="82" x2="990" y2="892"/>
    </g>

    <!-- phase 1 -->
    <text x="40" y="108" font-size="11" font-weight="bold" fill="#1f4e9c">ONBOARDING — synchronous, seconds</text>

    <line x1="110" y1="130" x2="336" y2="130" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="120" y="124" font-size="10.5">wizard steps 1–4: cloud choice, cloud config, LLM and vector store, review</text>

    <line x1="340" y1="166" x2="536" y2="166" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="350" y="160" font-size="10.5" fill="#5b6270">optional: save draft — non-secret fields only</text>

    <line x1="110" y1="202" x2="336" y2="202" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="120" y="196" font-size="10.5">submit</text>

    <polyline points="340,226 412,226 412,254 344,254" fill="none" stroke="#a13b12" stroke-width="1.3" marker-end="url(#ar)"/>
    <text x="422" y="236" font-size="10.5" fill="#a13b12">Zod validation, then AES-256-GCM encryption of the LLM key,</text>
    <text x="422" y="252" font-size="10.5" fill="#a13b12">and the Pinecone key — no Azure credential is collected</text>

    <line x1="340" y1="290" x2="986" y2="290" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="284" font-size="10.5">[AWS] STS AssumeRole on the customer's deployment role — 15-minute session</text>

    <line x1="340" y1="326" x2="986" y2="326" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="320" font-size="10.5">[AWS] write llm-api-key, pinecone-api-key and docs-signer-secret into their Secrets Manager</text>

    <line x1="986" y1="356" x2="344" y2="356" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="350" y="350" font-size="10.5" fill="#5b6270">secret ARNs — the values themselves stay in the customer's account</text>

    <line x1="340" y1="392" x2="536" y2="392" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="386" font-size="10.5">INSERT tenant, INSERT deployment (pending)</text>

    <line x1="340" y1="428" x2="756" y2="428" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="422" font-size="10.5">workflow_dispatch — AWS sends ARNs only; Azure sends masked secret inputs</text>

    <line x1="340" y1="464" x2="536" y2="464" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="458" font-size="10.5">UPDATE deployment → running</text>

    <line x1="336" y1="500" x2="114" y2="500" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="120" y="494" font-size="10.5" fill="#5b6270">redirect to the tenant page</text>

    <!-- phase 2 -->
    <line x1="40" y1="528" x2="1090" y2="528" stroke="#c3c8d1" stroke-width="1"/>
    <text x="40" y="552" font-size="11" font-weight="bold" fill="#146b58">DEPLOYMENT — asynchronous, roughly ten minutes</text>

    <line x1="756" y1="580" x2="344" y2="580" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="574" font-size="10.5">POST status: running, with the run id and run URL</text>

    <line x1="760" y1="616" x2="986" y2="616" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="770" y="610" font-size="10.5">replicate the platform's golden images into the customer's own registry</text>

    <line x1="760" y1="652" x2="986" y2="652" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="770" y="646" font-size="10.5">terraform apply: network, runtime, secret store, vector store, docs-signer</text>

    <line x1="986" y1="682" x2="764" y2="682" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ad)"/>
    <text x="770" y="676" font-size="10.5" fill="#5b6270">outputs: chatbot URL, load balancer DNS, signer URL</text>

    <line x1="756" y1="718" x2="344" y2="718" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="712" font-size="10.5">POST status: succeeded or failed, carrying those outputs</text>

    <line x1="340" y1="754" x2="536" y2="754" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="748" font-size="10.5">UPDATE deployment and tenant</text>

    <!-- phase 3 -->
    <line x1="40" y1="782" x2="1090" y2="782" stroke="#c3c8d1" stroke-width="1"/>
    <text x="40" y="806" font-size="11" font-weight="bold" fill="#5b6270">LIVE VIEW — while the deployment is active</text>

    <line x1="110" y1="834" x2="336" y2="834" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="120" y="828" font-size="10.5">poll /api/deployments/{id}/progress</text>

    <line x1="340" y1="868" x2="756" y2="868" stroke="#2f343d" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="350" y="862" font-size="10.5">read run, job and step state — and settle the row itself if the callback was lost</text>

    <text x="40" y="932" font-size="11" fill="#5b6270">The callback is the fast path and the poll is the safety net: a deployment reaches a terminal state even when the webhook never arrives.</text>
    <text x="40" y="952" font-size="11" fill="#5b6270">On Azure the AssumeRole and secret-write messages are absent — the tenant has no secret store until Terraform creates its Key Vault.</text>
  </g>
</svg>
