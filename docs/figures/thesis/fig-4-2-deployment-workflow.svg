<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" role="img" aria-label="Deployment workflow in three lanes. The customer runs a one-time bootstrap template; the control plane validates onboarding, on AWS writes the keys into the customer’s Secrets Manager through a write-only role bound by ExternalId, and dispatches a workflow. The GitHub Actions run authenticates with its OIDC token to the customer’s deploy identity, on Azure fetching the keys from the platform once, provisions the chatbot with Terraform, and reports the outcome, which the control plane records, with polling and reconciliation covering a lost callback.">
  <rect x="0" y="0" width="720" height="680" fill="#ffffff"/>
  <defs><marker id="m-flow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f343d"/></marker><marker id="m-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#2f343d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="m-refused" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker><marker id="m-content" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="224" height="624" rx="7" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><text x="28" y="36" font-size="12.5" font-weight="bold" fill="#3d4350">CONTROL PLANE</text><rect x="248" y="16" width="224" height="624" rx="7" fill="#f5f4ef" stroke="#8a8778" stroke-width="1.4"/><text x="260" y="36" font-size="12.5" font-weight="bold" fill="#3d4350">GITHUB ACTIONS RUN</text><rect x="480" y="16" width="224" height="624" rx="7" fill="#e9f3ef" stroke="#146b58" stroke-width="1.4"/><text x="492" y="36" font-size="12.5" font-weight="bold" fill="#146b58">CUSTOMER CLOUD</text><rect x="492" y="60" width="200" height="94" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="592" y="81" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Customer bootstrap</text><text x="592" y="98" font-size="12.5" text-anchor="middle" fill="#5b6270">one-time CloudFormation or</text><text x="592" y="113" font-size="12.5" text-anchor="middle" fill="#5b6270">ARM template: deploy identity,</text><text x="592" y="128" font-size="12.5" text-anchor="middle" fill="#5b6270">state storage, onboarding</text><text x="592" y="143" font-size="12.5" text-anchor="middle" fill="#5b6270">role (AWS)</text><rect x="28" y="170" width="200" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="128" y="191" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Onboarding</text><text x="128" y="208" font-size="12.5" text-anchor="middle" fill="#5b6270">inputs validated; keys stored</text><text x="128" y="223" font-size="12.5" text-anchor="middle" fill="#5b6270">encrypted (AES-256-GCM)</text><rect x="492" y="170" width="200" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="592" y="191" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Secrets Manager</text><text x="592" y="208" font-size="12.5" text-anchor="middle" fill="#b4540a">AWS only</text><text x="592" y="223" font-size="12.5" text-anchor="middle" fill="#5b6270">keys written before any run</text><rect x="28" y="262" width="200" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="128" y="283" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Dispatch</text><text x="128" y="300" font-size="12.5" text-anchor="middle" fill="#5b6270">workflow_dispatch with</text><text x="128" y="315" font-size="12.5" text-anchor="middle" fill="#5b6270">non-secret inputs only</text><rect x="260" y="352" width="200" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="360" y="373" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">OIDC authentication</text><text x="360" y="390" font-size="12.5" text-anchor="middle" fill="#5b6270">the job’s token names</text><text x="360" y="405" font-size="12.5" text-anchor="middle" fill="#5b6270">environment tenant-{id}</text><rect x="28" y="352" width="200" height="79" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="128" y="373" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Secrets release</text><text x="128" y="390" font-size="12.5" text-anchor="middle" fill="#1f5fae">Azure only</text><text x="128" y="405" font-size="12.5" text-anchor="middle" fill="#5b6270">keys released once, to</text><text x="128" y="420" font-size="12.5" text-anchor="middle" fill="#5b6270">that run’s verified token</text><rect x="492" y="352" width="200" height="79" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="592" y="373" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Deploy identity</text><text x="592" y="390" font-size="12.5" text-anchor="middle" fill="#5b6270">AWS deploy role or Azure</text><text x="592" y="405" font-size="12.5" text-anchor="middle" fill="#5b6270">managed identity; trusts</text><text x="592" y="420" font-size="12.5" text-anchor="middle" fill="#5b6270">only this tenant’s subject</text><rect x="260" y="462" width="200" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="360" y="483" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Terraform provisioning</text><text x="360" y="500" font-size="12.5" text-anchor="middle" fill="#5b6270">golden images copied in;</text><text x="360" y="515" font-size="12.5" text-anchor="middle" fill="#5b6270">terraform init + apply</text><rect x="492" y="462" width="200" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="592" y="483" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Chatbot infrastructure</text><text x="592" y="500" font-size="12.5" text-anchor="middle" fill="#5b6270">containers, storage, signer,</text><text x="592" y="515" font-size="12.5" text-anchor="middle" fill="#5b6270">vector DB; state kept here</text><rect x="260" y="558" width="200" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="360" y="579" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Outcome reporting</text><text x="360" y="596" font-size="12.5" text-anchor="middle" fill="#5b6270">status callback with the</text><text x="360" y="611" font-size="12.5" text-anchor="middle" fill="#5b6270">chatbot and signer URLs</text><rect x="28" y="558" width="200" height="79" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="128" y="579" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Tenant recorded</text><text x="128" y="596" font-size="12.5" text-anchor="middle" fill="#5b6270">live or failed; a lost</text><text x="128" y="611" font-size="12.5" text-anchor="middle" fill="#5b6270">callback is recovered by</text><text x="128" y="626" font-size="12.5" text-anchor="middle" fill="#5b6270">polling and reconciliation</text><circle cx="492" cy="60" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="492" y="64.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="28" cy="170" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="28" y="174.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="28" cy="262" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="28" y="266.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="260" cy="352" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="260" y="356.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="260" cy="462" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="260" y="466.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="260" cy="558" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="260" y="562.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><polyline points="492,107 128,107 128,170" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="360" y="100" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">IDs entered at onboarding</text><text x="360" y="100" font-size="12" text-anchor="middle" fill="#16181d">IDs entered at onboarding</text><polyline points="228,202 492,202" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="360" y="195" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">AWS: AssumeRole + ExternalId</text><text x="360" y="195" font-size="12" text-anchor="middle" fill="#b4540a">AWS: AssumeRole + ExternalId</text><text x="360" y="218" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">write-only</text><text x="360" y="218" font-size="12" text-anchor="middle" fill="#b4540a">write-only</text><polyline points="128,234 128,262" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="228,294 360,294 360,352" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="314" y="287" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">starts the run</text><text x="314" y="287" font-size="12" text-anchor="middle" fill="#16181d">starts the run</text><polyline points="460,384 492,384" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="260,384 228,384" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><polyline points="360,416 360,462" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="460,494 492,494" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="360,526 360,558" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="260,590 228,590" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="20,660 54,660" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="62" y="664" font-size="12" fill="#3d4350">next step or call</text><polyline points="191.4,660 225.4,660" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="233.4" y="664" font-size="12" fill="#3d4350">the run calls the platform</text><circle cx="435.6" cy="660" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="435.6" y="664.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">n</text><text x="460.6" y="664" font-size="12" fill="#3d4350">stage</text></g>
</svg>
