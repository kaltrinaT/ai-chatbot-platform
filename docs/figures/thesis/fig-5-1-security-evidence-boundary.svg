<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-label="What each local security scenario exercised. SEC-E2E-01 runs the platform’s server actions, API routes and SQL for real against PostgreSQL, with GitHub dispatch recorded. SEC-E2E-02 reads dependencies, the database schema, templates and Terraform and evaluates them with an IAM model. SEC-E2E-03 runs the secrets release for real against PostgreSQL with AES-GCM, with a locally signed OIDC token and simulated STS and Entra decisions. SEC-E2E-04 runs the committed workflow scripts in bash with cloud command-line tools stubbed. No scenario exercised a live AWS or Azure environment.">
  <rect x="0" y="0" width="720" height="424" fill="#ffffff"/>
  <defs><marker id="m-flow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f343d"/></marker><marker id="m-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#2f343d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="m-refused" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker><marker id="m-content" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="182" y="16" width="522" height="360" rx="7" fill="#fafbfc" stroke="#3d4350" stroke-width="1.4"/><text x="194" y="36" font-size="12.5" font-weight="bold" fill="#3d4350">LOCAL MACHINE</text><text x="194" y="51" font-size="12" fill="#5b6270">nothing sent to a cloud or to GitHub</text><text x="251" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#3d4350">Platform app</text><text x="379" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#3d4350">Database</text><text x="507" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#3d4350">GitHub Actions</text><text x="635" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#3d4350">Cloud decision</text><text x="16" y="112" font-size="14" font-weight="bold" fill="#16181d">SEC-E2E-01</text><text x="16" y="129" font-size="12" fill="#3d4350">Cross-tenant authorization</text><text x="16" y="146" font-size="12" fill="#5b6270">20/20 attacks · 8/8 controls</text><rect x="190" y="94" width="122" height="62" rx="5" fill="#e9f3ef" stroke="#146b58" stroke-width="1.3"/><text x="251" y="121.5" font-size="12" text-anchor="middle" fill="#16181d">server actions,</text><text x="251" y="136.5" font-size="12" text-anchor="middle" fill="#16181d">API routes</text><rect x="318" y="94" width="122" height="62" rx="5" fill="#e9f3ef" stroke="#146b58" stroke-width="1.3"/><text x="379" y="121.5" font-size="12" text-anchor="middle" fill="#16181d">PostgreSQL,</text><text x="379" y="136.5" font-size="12" text-anchor="middle" fill="#16181d">real migrations</text><rect x="446" y="94" width="122" height="62" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="507" y="121.5" font-size="12" text-anchor="middle" fill="#16181d">dispatch</text><text x="507" y="136.5" font-size="12" text-anchor="middle" fill="#16181d">recorded</text><text x="635" y="129" font-size="12.5" text-anchor="middle" fill="#9aa0aa">—</text><text x="16" y="182" font-size="14" font-weight="bold" fill="#16181d">SEC-E2E-02</text><text x="16" y="199" font-size="12" fill="#3d4350">Document-access denial</text><text x="16" y="216" font-size="12" fill="#5b6270">8/8 attacks · 4/4 controls</text><rect x="190" y="164" width="122" height="62" rx="5" fill="#e8eef8" stroke="#1f5fae" stroke-width="1.3"/><text x="251" y="191.5" font-size="12" text-anchor="middle" fill="#16181d">dependencies,</text><text x="251" y="206.5" font-size="12" text-anchor="middle" fill="#16181d">DB schema</text><text x="379" y="199" font-size="12.5" text-anchor="middle" fill="#9aa0aa">—</text><text x="507" y="199" font-size="12.5" text-anchor="middle" fill="#9aa0aa">—</text><rect x="574" y="164" width="122" height="62" rx="5" fill="#e8eef8" stroke="#1f5fae" stroke-width="1.3"/><text x="635" y="191.5" font-size="12" text-anchor="middle" fill="#16181d">IAM model on</text><text x="635" y="206.5" font-size="12" text-anchor="middle" fill="#16181d">templates, TF</text><text x="16" y="252" font-size="14" font-weight="bold" fill="#16181d">SEC-E2E-03</text><text x="16" y="269" font-size="12" fill="#3d4350">Cloud identity isolation</text><text x="16" y="286" font-size="12" fill="#5b6270">44/44 attacks · 7/7 controls</text><rect x="190" y="234" width="122" height="62" rx="5" fill="#e9f3ef" stroke="#146b58" stroke-width="1.3"/><text x="251" y="269" font-size="12" text-anchor="middle" fill="#16181d">secrets release</text><rect x="318" y="234" width="122" height="62" rx="5" fill="#e9f3ef" stroke="#146b58" stroke-width="1.3"/><text x="379" y="261.5" font-size="12" text-anchor="middle" fill="#16181d">PostgreSQL,</text><text x="379" y="276.5" font-size="12" text-anchor="middle" fill="#16181d">AES-GCM</text><rect x="446" y="234" width="122" height="62" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="507" y="261.5" font-size="12" text-anchor="middle" fill="#16181d">OIDC token</text><text x="507" y="276.5" font-size="12" text-anchor="middle" fill="#16181d">signed locally</text><rect x="574" y="234" width="122" height="62" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="635" y="261.5" font-size="12" text-anchor="middle" fill="#16181d">STS and Entra</text><text x="635" y="276.5" font-size="12" text-anchor="middle" fill="#16181d">decisions</text><text x="16" y="322" font-size="14" font-weight="bold" fill="#16181d">SEC-E2E-04</text><text x="16" y="339" font-size="12" fill="#3d4350">Workflow integrity</text><text x="16" y="356" font-size="12" fill="#5b6270">79/79 attacks · 7/7 controls</text><text x="251" y="339" font-size="12.5" text-anchor="middle" fill="#9aa0aa">—</text><text x="379" y="339" font-size="12.5" text-anchor="middle" fill="#9aa0aa">—</text><rect x="446" y="304" width="122" height="62" rx="5" fill="#e9f3ef" stroke="#146b58" stroke-width="1.3"/><text x="507" y="331.5" font-size="12" text-anchor="middle" fill="#16181d">committed</text><text x="507" y="346.5" font-size="12" text-anchor="middle" fill="#16181d">scripts in bash</text><rect x="574" y="304" width="122" height="62" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="635" y="331.5" font-size="12" text-anchor="middle" fill="#16181d">aws, az, docker</text><text x="635" y="346.5" font-size="12" text-anchor="middle" fill="#16181d">stubbed</text><rect x="16" y="394" width="30" height="16" rx="3" fill="#e9f3ef" stroke="#146b58" stroke-width="1.2"/><text x="54" y="406" font-size="12" fill="#3d4350">run for real</text><rect x="151.6" y="394" width="30" height="16" rx="3" fill="#e8eef8" stroke="#1f5fae" stroke-width="1.2"/><text x="189.6" y="406" font-size="12" fill="#3d4350">read from its definition files</text><rect x="391.6" y="394" width="30" height="16" rx="3" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="5 3.5"/><text x="429.6" y="406" font-size="12" fill="#3d4350">simulated or stubbed</text><text x="573.6" y="406" font-size="12" fill="#3d4350">—  not involved</text></g>
</svg>
