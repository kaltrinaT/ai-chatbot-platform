<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 656" width="720" height="656" role="img" aria-label="Document management and indexing. The operator’s browser asks the control plane for an upload; the control plane asks the tenant’s document signer, which returns a 60-second presigned POST or user-delegation SAS (or deletes the object itself). The browser uploads the file straight to customer storage and confirms; the control plane then calls the backend’s public POST /api/index, and the backend re-reads every document and resynchronizes the vector store. Storage raises no event.">
  <rect x="0" y="0" width="720" height="656" fill="#ffffff"/>
  <defs><marker id="m-flow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f343d"/></marker><marker id="m-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#2f343d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="m-refused" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker><marker id="m-content" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="136" width="688" height="256" rx="7" fill="#e9f3ef" stroke="#146b58" stroke-width="1.4"/><text x="28" y="380" font-size="12.5" font-weight="bold" fill="#146b58">CUSTOMER CLOUD ACCOUNT</text><rect x="24" y="18" width="190" height="86" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="119" y="57.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Operator browser</text><text x="119" y="74.5" font-size="12.5" text-anchor="middle" fill="#5b6270">holds the file</text><rect x="266" y="18" width="190" height="86" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="361" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Control plane</text><text x="361" y="67" font-size="12.5" text-anchor="middle" fill="#5b6270">Next.js server actions;</text><text x="361" y="82" font-size="12.5" text-anchor="middle" fill="#5b6270">metadata in Neon</text><rect x="24" y="176" width="190" height="70" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="119" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Document storage</text><text x="119" y="217" font-size="12.5" text-anchor="middle" fill="#5b6270">S3 bucket or Blob</text><text x="119" y="232" font-size="12.5" text-anchor="middle" fill="#5b6270">container, private</text><rect x="266" y="176" width="190" height="70" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="361" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Document signer</text><text x="361" y="217" font-size="12.5" text-anchor="middle" fill="#5b6270">Lambda or Function;</text><text x="361" y="232" font-size="12.5" text-anchor="middle" fill="#5b6270">writes, never reads</text><rect x="508" y="176" width="190" height="70" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="603" y="207.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Chatbot backend</text><text x="603" y="224.5" font-size="12.5" text-anchor="middle" fill="#5b6270">FastAPI container</text><rect x="508" y="300" width="190" height="58" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="603" y="325.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Vector store</text><text x="603" y="342.5" font-size="12.5" text-anchor="middle" fill="#5b6270">pgvector or Pinecone</text><polyline points="214,36 266,36" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><circle cx="240" cy="36" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="240" y="40.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><polyline points="266,61 214,61" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><circle cx="240" cy="61" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="240" y="65.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><polyline points="214,86 266,86" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><circle cx="240" cy="86" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="240" y="90.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><polyline points="339,104 339,176" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><circle cx="339" cy="120" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="339" y="124.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><polyline points="383,176 383,104" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><circle cx="383" cy="120" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="383" y="124.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><polyline points="119,104 119,176" fill="none" stroke-linejoin="round" stroke="#146b58" stroke-width="3.4" marker-end="url(#m-content)"/><circle cx="97" cy="140" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="97" y="144.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><polyline points="266,211 214,211" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="240" y="204" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">delete</text><text x="240" y="204" font-size="12" text-anchor="middle" fill="#16181d">delete</text><polyline points="456,50 633,50 633,176" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><circle cx="633" cy="112" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="633" y="116.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="625" y="80" font-size="12" text-anchor="end" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">POST /api/index</text><text x="625" y="80" font-size="12" text-anchor="end" fill="#16181d">POST /api/index</text><polyline points="119,246 119,278 563,278 563,246" fill="none" stroke-linejoin="round" stroke="#146b58" stroke-width="3.4" marker-end="url(#m-content)"/><circle cx="380" cy="278" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="380" y="282.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><polyline points="633,246 633,300" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><circle cx="633" cy="273" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="633" y="277.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="28" y="322" font-size="12" fill="#3d4350">Storage raises no event: indexing starts</text><text x="28" y="337" font-size="12" fill="#3d4350">only when the control plane calls it (6).</text><circle cx="34" cy="418" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="422.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="54" y="422" font-size="12.5" fill="#16181d">The operator asks to upload, or to delete, a document.</text><circle cx="34" cy="442" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="446.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="54" y="446" font-size="12.5" fill="#16181d">The control plane calls the tenant’s document signer, authenticated by a shared secret.</text><circle cx="34" cy="466" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="470.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="54" y="470" font-size="12.5" fill="#16181d">The signer returns a 60-second authorization: an S3 presigned POST or an Azure</text><text x="54" y="486" font-size="12.5" fill="#16181d">user-delegation SAS. For a deletion, the signer deletes the object itself instead.</text><circle cx="34" cy="506" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="510.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="54" y="510" font-size="12.5" fill="#16181d">The browser uploads the file straight to the customer’s storage.</text><circle cx="34" cy="530" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="534.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="54" y="534" font-size="12.5" fill="#16181d">The browser confirms; the control plane marks the document uploaded.</text><circle cx="34" cy="554" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="558.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="54" y="558" font-size="12.5" fill="#16181d">The control plane calls the backend’s POST /api/index (public; no credential).</text><circle cx="34" cy="578" r="10" fill="#3d4350" stroke="#ffffff" stroke-width="1.6"/><text x="34" y="582.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="54" y="582" font-size="12.5" fill="#16181d">The backend re-reads every document under the prefix, re-embeds it and resyncs</text><text x="54" y="598" font-size="12.5" fill="#16181d">the vector store, removing vectors of deleted documents.</text><polyline points="20,632 54,632" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="62" y="636" font-size="12" fill="#3d4350">call</text><polyline points="110.8,632 144.8,632" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="152.8" y="636" font-size="12" fill="#3d4350">response</text><polyline points="226.39999999999998,632 260.4,632" fill="none" stroke-linejoin="round" stroke="#146b58" stroke-width="3.4" marker-end="url(#m-content)"/><text x="268.4" y="636" font-size="12" fill="#3d4350">document content</text></g>
</svg>
