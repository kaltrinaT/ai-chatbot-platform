<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 716" width="720" height="716" role="img" aria-label="RAG processing pipeline. Indexing extracts text from the tenant’s documents, splits it into 200-word chunks overlapping by 40 words, embeds each with all-MiniLM-L6-v2 into 384 values and upserts it into the vector store. A question is embedded with the same model, the five nearest chunks by cosine similarity are retrieved for this tenant, those scoring below 0.15 are dropped, and the remainder form a context-only prompt for an external OpenAI-compatible LLM, whose answer returns with its source documents. If no chunk passes, a fixed reply is returned without calling the LLM.">
  <rect x="0" y="0" width="720" height="716" fill="#ffffff"/>
  <defs><marker id="m-flow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f343d"/></marker><marker id="m-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#2f343d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="m-refused" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker><marker id="m-content" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="210" height="310" rx="7" fill="#e9f3ef" stroke="#146b58" stroke-width="1.4"/><text x="28" y="36" font-size="12.5" font-weight="bold" fill="#146b58">INDEXING</text><text x="28" y="51" font-size="12" fill="#5b6270">on every POST /api/index</text><rect x="494" y="150" width="210" height="518" rx="7" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><text x="506" y="170" font-size="12.5" font-weight="bold" fill="#3d4350">QUERY</text><text x="506" y="185" font-size="12" fill="#5b6270">each POST /api/ask</text><rect x="28" y="64" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="121" y="85.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Documents</text><text x="121" y="102.5" font-size="12.5" text-anchor="middle" fill="#5b6270">the tenant’s S3 or Blob</text><rect x="28" y="130" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="121" y="151.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Extract text</text><text x="121" y="168.5" font-size="12.5" text-anchor="middle" fill="#5b6270">.txt, .pdf, .docx</text><rect x="28" y="196" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="121" y="217.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Chunk</text><text x="121" y="234.5" font-size="12.5" text-anchor="middle" fill="#5b6270">200 words, 40 overlapping</text><rect x="28" y="262" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="121" y="283.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Embed</text><text x="121" y="300.5" font-size="12.5" text-anchor="middle" fill="#5b6270">one vector per chunk</text><polyline points="121,114 121,130" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="121,180 121,196" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="121,246 121,262" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><rect x="506" y="196" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="217.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Question</text><text x="599" y="234.5" font-size="12.5" text-anchor="middle" fill="#5b6270">from the chat UI</text><rect x="506" y="262" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="283.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Embed question</text><text x="599" y="300.5" font-size="12.5" text-anchor="middle" fill="#5b6270">with the same model</text><rect x="506" y="328" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="349.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Retrieve</text><text x="599" y="366.5" font-size="12.5" text-anchor="middle" fill="#5b6270">top 5 by cosine, this tenant</text><rect x="506" y="394" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="415.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Similarity filter</text><text x="599" y="432.5" font-size="12.5" text-anchor="middle" fill="#5b6270">keep score ≥ 0.15</text><rect x="506" y="460" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="481.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Grounded prompt</text><text x="599" y="498.5" font-size="12.5" text-anchor="middle" fill="#5b6270">“use ONLY the context”</text><rect x="506" y="526" width="186" height="62" rx="5" fill="#ffffff" stroke="#5b6270" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="599" y="546" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">External LLM</text><text x="599" y="563" font-size="12.5" text-anchor="middle" fill="#5b6270">OpenAI-compatible API</text><text x="599" y="578" font-size="12.5" text-anchor="middle" fill="#a13b12">a third party</text><rect x="506" y="604" width="186" height="50" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="599" y="625.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Answer</text><text x="599" y="642.5" font-size="12.5" text-anchor="middle" fill="#5b6270">text + source documents</text><polyline points="599,246 599,262" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="599,312 599,328" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="599,378 599,394" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="599,444 599,460" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="599,510 599,526" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="599,588 599,604" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="360" y="246" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3d4350">SHARED BY BOTH</text><rect x="254" y="262" width="212" height="50" rx="5" fill="#fbfbfa" stroke="#3d4350" stroke-width="1.3"/><text x="360" y="283.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">all-MiniLM-L6-v2</text><text x="360" y="300.5" font-size="12.5" text-anchor="middle" fill="#5b6270">384 values; on the CPU</text><rect x="254" y="321" width="212" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="360" y="342" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Vector store</text><text x="360" y="359" font-size="12.5" text-anchor="middle" fill="#5b6270">pgvector or Pinecone:</text><text x="360" y="374" font-size="12.5" text-anchor="middle" fill="#5b6270">vector, chunk text, source</text><rect x="254" y="398" width="212" height="64" rx="5" fill="#ffffff" stroke="#a13b12" stroke-width="1.3"/><text x="360" y="419" font-size="14" font-weight="bold" text-anchor="middle" fill="#a13b12">Fixed reply</text><text x="360" y="436" font-size="12.5" text-anchor="middle" fill="#5b6270">“I don’t have enough</text><text x="360" y="451" font-size="12.5" text-anchor="middle" fill="#5b6270">information.” LLM not called</text><polyline points="214,287 254,287" fill="none" stroke-linejoin="round" stroke="#9aa0aa" stroke-width="1.2" stroke-dasharray="2 3"/><polyline points="466,287 506,287" fill="none" stroke-linejoin="round" stroke="#9aa0aa" stroke-width="1.2" stroke-dasharray="2 3"/><polyline points="121,312 121,353 254,353" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="207.5" y="346" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">upsert</text><text x="207.5" y="346" font-size="12" text-anchor="middle" fill="#16181d">upsert</text><polyline points="466,353 506,353" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="486" y="346" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">query</text><text x="486" y="346" font-size="12" text-anchor="middle" fill="#16181d">query</text><polyline points="506,419 466,419" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="486" y="438" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">none pass</text><text x="486" y="438" font-size="12" text-anchor="middle" fill="#16181d">none pass</text><polyline points="360,462 360,629 506,629" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><polyline points="20,694 54,694" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="62" y="698" font-size="12" fill="#3d4350">data flow</text><polyline points="141.8,694 175.8,694" fill="none" stroke-linejoin="round" stroke="#9aa0aa" stroke-width="1.2" stroke-dasharray="2 3"/><text x="183.8" y="698" font-size="12" fill="#3d4350">uses</text><rect x="232.60000000000002" y="686" width="34" height="16" rx="3" fill="#ffffff" stroke="#5b6270" stroke-width="1.2" stroke-dasharray="5 3.5"/><text x="274.6" y="698" font-size="12" fill="#3d4350">outside the customer’s account</text></g>
</svg>
