<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="Identity and trust model. The platform app obtains its platform role through Vercel OIDC and may assume each customer’s write-only onboarding role, bound by ExternalId to the tenant id; the customer’s deploy role does not trust it. Deployments run as a GitHub Actions job whose OIDC subject names one tenant’s environment, which the AWS deploy role and the Azure managed identity’s federated credential each require exactly. The deploy identities create the runtime identities that read and write documents.">
  <rect x="0" y="0" width="720" height="540" fill="#ffffff"/>
  <defs><marker id="m-flow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f343d"/></marker><marker id="m-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9.5,5 L1,9" fill="none" stroke="#2f343d" stroke-width="1.4" stroke-linejoin="round"/></marker><marker id="m-refused" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13b12"/></marker><marker id="m-content" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#146b58"/></marker></defs>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="16" y="16" width="336" height="212" rx="7" fill="#eef1f6" stroke="#3d4350" stroke-width="1.4"/><text x="28" y="36" font-size="12.5" font-weight="bold" fill="#3d4350">PLATFORM</text><rect x="368" y="16" width="336" height="212" rx="7" fill="#f5f4ef" stroke="#8a8778" stroke-width="1.4"/><text x="380" y="36" font-size="12.5" font-weight="bold" fill="#3d4350">GITHUB</text><rect x="16" y="270" width="336" height="222" rx="7" fill="#e9f3ef" stroke="#146b58" stroke-width="1.4"/><text x="28" y="480" font-size="12.5" font-weight="bold" fill="#b4540a">CUSTOMER AWS ACCOUNT</text><rect x="368" y="270" width="336" height="222" rx="7" fill="#e9f3ef" stroke="#146b58" stroke-width="1.4"/><text x="380" y="480" font-size="12.5" font-weight="bold" fill="#1f5fae">CUSTOMER AZURE SUBSCRIPTION</text><rect x="98" y="46" width="172" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="184" y="67" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Platform app</text><text x="184" y="84" font-size="12.5" text-anchor="middle" fill="#5b6270">Next.js on Vercel</text><text x="184" y="99" font-size="12.5" text-anchor="middle" fill="#5b6270">holds no cloud key</text><rect x="28" y="150" width="312" height="64" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="184" y="171" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Platform role</text><text x="184" y="188" font-size="12.5" text-anchor="middle" fill="#5b6270">in the platform’s AWS account;</text><text x="184" y="203" font-size="12.5" text-anchor="middle" fill="#5b6270">may assume onboarding roles only</text><polyline points="184,110 184,150" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="192" y="130" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Vercel OIDC, production only</text><text x="192" y="130" font-size="12" fill="#16181d">Vercel OIDC, production only</text><rect x="380" y="46" width="312" height="79" rx="5" fill="#ffffff" stroke="#3d4350" stroke-width="1.3"/><text x="536" y="67" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Workflow run</text><text x="536" y="84" font-size="12.5" text-anchor="middle" fill="#5b6270">environment tenant-{id}; its OIDC token’s</text><text x="536" y="99" font-size="12.5" text-anchor="middle" fill="#5b6270">subject: repo:{owner}/{repo}:</text><text x="536" y="114" font-size="12.5" text-anchor="middle" fill="#5b6270">environment:tenant-{id}</text><polyline points="270,78 380,78" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="325" y="71" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">dispatch</text><text x="325" y="71" font-size="12" text-anchor="middle" fill="#16181d">dispatch</text><text x="325" y="94" font-size="12" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">GITHUB_PAT</text><text x="325" y="94" font-size="12" text-anchor="middle" fill="#5b6270">GITHUB_PAT</text><rect x="28" y="290" width="150" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="103" y="311" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Onboarding role</text><text x="103" y="328" font-size="12.5" text-anchor="middle" fill="#5b6270">writes secrets only;</text><text x="103" y="343" font-size="12.5" text-anchor="middle" fill="#5b6270">reads nothing</text><rect x="190" y="290" width="150" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="265" y="311" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Deploy role</text><text x="265" y="328" font-size="12.5" text-anchor="middle" fill="#5b6270">builds the chatbot;</text><text x="265" y="343" font-size="12.5" text-anchor="middle" fill="#5b6270">trusts GitHub only</text><rect x="28" y="382" width="312" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="184" y="403" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Runtime roles</text><text x="184" y="420" font-size="12.5" text-anchor="middle" fill="#5b6270">ECS task reads documents; the signer</text><text x="184" y="435" font-size="12.5" text-anchor="middle" fill="#5b6270">writes and deletes; boundary-capped</text><polyline points="265,354 265,382" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><rect x="380" y="290" width="312" height="79" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="536" y="311" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Managed identity</text><text x="536" y="328" font-size="12.5" text-anchor="middle" fill="#5b6270">chatbot-deploy-{slug}: Contributor and</text><text x="536" y="343" font-size="12.5" text-anchor="middle" fill="#5b6270">User Access Administrator on its own</text><text x="536" y="358" font-size="12.5" text-anchor="middle" fill="#5b6270">resource group only</text><rect x="380" y="397" width="312" height="64" rx="5" fill="#ffffff" stroke="#146b58" stroke-width="1.3"/><text x="536" y="418" font-size="14" font-weight="bold" text-anchor="middle" fill="#16181d">Runtime identities</text><text x="536" y="435" font-size="12.5" text-anchor="middle" fill="#5b6270">chatbot reads documents; the</text><text x="536" y="450" font-size="12.5" text-anchor="middle" fill="#5b6270">signer writes and deletes them</text><polyline points="536,369 536,397" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><polyline points="100,214 100,290" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="108" y="244" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">AssumeRole +</text><text x="108" y="244" font-size="12" fill="#16181d">AssumeRole +</text><text x="108" y="258" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">ExternalId = tenant id</text><text x="108" y="258" font-size="12" fill="#16181d">ExternalId = tenant id</text><polyline points="275,214 275,290" fill="none" stroke-linejoin="round" stroke="#a13b12" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-refused)"/><circle cx="275" cy="246" r="10" fill="#a13b12" stroke="#ffffff" stroke-width="1.6"/><text x="275" y="250.2" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">✕</text><text x="287" y="234" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">not trusted</text><text x="287" y="234" font-size="12" fill="#a13b12">not trusted</text><polyline points="420,125 420,244 318,244 318,290" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="428" y="160" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">OIDC: subject</text><text x="428" y="160" font-size="12" fill="#16181d">OIDC: subject</text><text x="428" y="174" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">must equal</text><text x="428" y="174" font-size="12" fill="#16181d">must equal</text><text x="428" y="188" font-size="12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">tenant-{id}</text><text x="428" y="188" font-size="12" fill="#16181d">tenant-{id}</text><polyline points="640,125 640,290" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="632" y="246" font-size="12" text-anchor="end" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">federated credential,</text><text x="632" y="246" font-size="12" text-anchor="end" fill="#16181d">federated credential,</text><text x="632" y="260" font-size="12" text-anchor="end" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">the same subject</text><text x="632" y="260" font-size="12" text-anchor="end" fill="#16181d">the same subject</text><polyline points="20,518 54,518" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.5" marker-end="url(#m-flow)"/><text x="62" y="522" font-size="12" fill="#3d4350">assumes or federates into</text><polyline points="241,518 275,518" fill="none" stroke-linejoin="round" stroke="#2f343d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="283" y="522" font-size="12" fill="#3d4350">authenticated request</text><polyline points="437.20000000000005,518 471.20000000000005,518" fill="none" stroke-linejoin="round" stroke="#a13b12" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-refused)"/><text x="479.20000000000005" y="522" font-size="12" fill="#3d4350">refused</text></g>
</svg>
