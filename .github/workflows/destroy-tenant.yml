name: Destroy tenant chatbot
run-name: "Destroy ${{ inputs.tenant_slug }} [${{ inputs.deployment_id }}]"

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
        description: "Platform tenant row UUID. Names the GitHub environment the job runs in, which is the subject the customer's trust policy federates on — see src/lib/githubOidc.ts"
      tenant_slug:
        required: true
        type: string
      aws_account_id:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      deployment_role_arn:
        required: true
        type: string
      chatbot_version:
        required: true
        type: string
      domain:
        required: false
        type: string
        default: ""
      s3_docs_prefix:
        required: false
        type: string
        default: ""
      llm_provider:
        required: true
        type: string
      llm_secret_arn:
        required: true
        type: string
      # Optional so teardown can never be blocked by a missing field: the
      # platform sends an empty string rather than omitting the input. See
      # buildAwsDestroyInputs in src/lib/deploy.ts.
      docs_signer_secret_arn:
        required: false
        type: string
        default: ""
      llm_model:
        required: false
        type: string
        default: ""
      vector_store:
        required: false
        type: string
        default: "pinecone"
      pinecone_secret_arn:
        required: false
        type: string
        default: ""

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Teardown federates into the customer's account exactly as a deploy does,
    # so it carries the same per-tenant subject and the same environment. See
    # deploy-tenant.yml for why the environment is the security boundary.
    environment: tenant-${{ inputs.tenant_id }}
    # One run at a time per tenant, across all four deploy and teardown
    # workflows on both clouds: they share this group name, so a redeploy and
    # a teardown of the same tenant queue behind each other instead of running
    # Terraform against the same state at once. Never cancel-in-progress — a
    # half-applied Terraform run is worse than a delayed one. The platform
    # enforces the same rule before dispatching (deployments_one_active_per_tenant
    # in src/db/schema.ts); this covers a run started by hand in GitHub too.
    concurrency:
      group: tenant-${{ inputs.tenant_id }}
      cancel-in-progress: false
    # Same reasoning as deploy-tenant.yml: id-token: write is what lets the
    # OIDC credentials step run, and no step here uses the job token for the
    # GitHub API, so dropping the other scopes removes nothing.
    permissions:
      id-token: write
      contents: read
    # Longer than a deploy's 30. Deleting a CloudFront distribution means
    # disabling it and waiting for that to reach every edge location before
    # the delete is accepted, which routinely takes 15-30 minutes on its own.
    # A teardown that times out leaves the tenant's infrastructure half-gone
    # and still billing, so the budget here is generous on purpose.
    #
    # Do not raise this above 60 without also refreshing AWS credentials
    # immediately before `terraform destroy`. The customer-role session is
    # capped at one hour by the role's MaxSessionDuration, and today this
    # timeout is the thing that keeps the job shorter than its credentials.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Notify platform — run started
        continue-on-error: true
        run: |
          cat > /tmp/callback.json <<EOF
          {
            "status": "running",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'running' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Teardown now touches the platform's AWS account not at all. It used to
      # assume a platform role purely to chain into the customer's; with the
      # customer's role trusting GitHub directly there is nothing left for the
      # platform account to do here, so the step is gone rather than kept for
      # symmetry. The Terraform state is in the customer's own account, in the
      # bucket their bootstrap stack creates, and is reached as their role.
      - name: Configure AWS credentials (client — tenant role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.deployment_role_arn }}
          role-session-name: destroy-${{ inputs.tenant_slug }}-${{ github.run_id }}
          role-duration-seconds: 3600

      # Same version as deploy-tenant.yml, for the same reason.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      # Same script as a deploy, so a teardown reads exactly the state the
      # deploys wrote.
      - name: Terraform init (state in the customer's account)
        working-directory: infra/terraform
        env:
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          TENANT_REGION: ${{ inputs.aws_region }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/terraform-init-aws.sh"

      # Destroying pinecone_index.this actually calls Pinecone's API, which
      # needs a real key — AWS credentials alone don't cover that provider.
      - name: Read customer Pinecone key
        id: pinecone
        if: inputs.vector_store == 'pinecone'
        run: |
          key="$(aws secretsmanager get-secret-value \
            --secret-id "${{ inputs.pinecone_secret_arn }}" \
            --query SecretString --output text)"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # force_destroy on aws_s3_bucket.docs is documented as the backstop that
      # keeps `terraform destroy` from stalling on a non-empty bucket, but it
      # is not sufficient on its own: a bucket whose versioning was turned on
      # outside Terraform still holds noncurrent versions and delete markers
      # after force_destroy runs, and DeleteBucket then fails with
      # "BucketNotEmpty: You must delete all versions in the bucket". That is
      # not hypothetical — it stranded chatbot-tenat1012-docs, and the bucket
      # had to be purged by hand.
      #
      # Versioning is not declared anywhere in the Terraform, so its state is
      # undefined per tenant and can drift. Rather than depend on a property
      # the config does not pin, empty the bucket explicitly here, before
      # Terraform is asked to delete it. Paginated because delete-objects
      # takes at most 1000 keys per call.
      #
      # Best-effort throughout: a tenant whose bucket never existed, or whose
      # deploy never got that far, must still be destroyable.
      - name: Empty the docs bucket, object versions included
        continue-on-error: true
        env:
          BUCKET: chatbot-${{ inputs.tenant_slug }}-docs
        run: node .github/scripts/empty-docs-bucket.mjs

      # No real image is pulled/pushed for a destroy — these just need to be
      # well-formed ECR URIs to satisfy Terraform's variable validation.
      - name: Terraform destroy
        working-directory: infra/terraform
        env:
          TF_VAR_pinecone_api_key: ${{ steps.pinecone.outputs.key || 'unused' }}
        run: |
          CLIENT_REGISTRY="${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
          terraform destroy -auto-approve \
            -var "tenant_slug=${{ inputs.tenant_slug }}" \
            -var "aws_region=${{ inputs.aws_region }}" \
            -var "image_uri=$CLIENT_REGISTRY/${{ inputs.tenant_slug }}/chatbot:${{ inputs.chatbot_version }}" \
            -var "frontend_image_uri=$CLIENT_REGISTRY/${{ inputs.tenant_slug }}/chatbot-frontend:${{ inputs.chatbot_version }}" \
            -var "s3_docs_prefix=${{ inputs.s3_docs_prefix }}" \
            -var "llm_provider=${{ inputs.llm_provider }}" \
            -var "llm_secret_arn=${{ inputs.llm_secret_arn }}" \
            -var "llm_model=${{ inputs.llm_model }}" \
            -var "vector_store=${{ inputs.vector_store }}" \
            -var "pinecone_secret_arn=${{ inputs.pinecone_secret_arn }}" \
            -var "domain=${{ inputs.domain }}" \
            -var "docs_signer_secret_arn=${{ inputs.docs_signer_secret_arn }}" \
            -var "platform_origin=${{ secrets.PLATFORM_BASE_URL }}"

      # Created imperatively by deploy-tenant.yml, not Terraform-managed —
      # terraform destroy above never touches these. Best-effort: a tenant
      # that never got this far in a deploy won't have them.
      - name: Delete ECR repositories
        run: |
          aws ecr delete-repository --region ${{ inputs.aws_region }} \
            --repository-name "${{ inputs.tenant_slug }}/chatbot" --force || true
          aws ecr delete-repository --region ${{ inputs.aws_region }} \
            --repository-name "${{ inputs.tenant_slug }}/chatbot-frontend" --force || true

      # Written directly by the platform (writeTenantSecret), not Terraform
      # resources — vector-db-url IS Terraform-managed and already gone via
      # terraform destroy above. Best-effort: pinecone-api-key only exists
      # for vector_store = pinecone.
      - name: Delete platform-written secrets
        run: |
          aws secretsmanager delete-secret --region ${{ inputs.aws_region }} \
            --secret-id "${{ inputs.tenant_slug }}/llm-api-key" \
            --force-delete-without-recovery || true
          aws secretsmanager delete-secret --region ${{ inputs.aws_region }} \
            --secret-id "${{ inputs.tenant_slug }}/docs-signer-secret" \
            --force-delete-without-recovery || true
          if [ "${{ inputs.vector_store }}" = "pinecone" ]; then
            aws secretsmanager delete-secret --region ${{ inputs.aws_region }} \
              --secret-id "${{ inputs.tenant_slug }}/pinecone-api-key" \
              --force-delete-without-recovery || true
          fi

      # What teardown deliberately leaves. The bootstrap stack is the
      # customer's revocation handle, and the state bucket is retained by that
      # stack on purpose (see the template), so both are theirs to remove.
      - name: Report what the customer still owns
        if: success()
        env:
          STATE_BUCKET: tfstate-${{ inputs.tenant_slug }}-${{ inputs.aws_account_id }}-${{ inputs.aws_region }}-an
        run: |
          {
            echo "### Chatbot infrastructure removed"
            echo ""
            echo "Still in AWS account \`${{ inputs.aws_account_id }}\`, and yours to remove:"
            echo ""
            echo "- The bootstrap stack \`chatbot-bootstrap-${{ inputs.tenant_slug }}\`. Deleting it revokes this platform's access to the account."
            echo "- The Terraform state bucket \`$STATE_BUCKET\`, which the stack keeps on purpose. Empty and delete it once you no longer need the state."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify platform — success
        if: success()
        run: |
          cat > /tmp/callback.json <<EOF
          {
            "status": "succeeded",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'succeeded' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
          fi

      - name: Notify platform — failure
        if: failure()
        run: |
          cat > /tmp/callback.json <<EOF
          {
            "status": "failed",
            "errorMessage": "Destroy workflow run ${{ github.run_id }} failed; see GitHub Actions logs.",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          code=$(curl -sS --max-time 15 -o /tmp/callback.out -w '%{http_code}' -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            --data @/tmp/callback.json \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status") || code=000
          if [ "$code" != "200" ]; then
            echo "::error title=Platform callback failed::HTTP $code posting 'failed' to PLATFORM_BASE_URL. $(head -c 300 /tmp/callback.out)"
          fi
