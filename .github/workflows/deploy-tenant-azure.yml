name: Deploy tenant chatbot (Azure)

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        required: true
        type: string
      tenant_slug:
        required: true
        type: string
      azure_subscription_id:
        required: true
        type: string
      azure_tenant_id:
        required: true
        type: string
      azure_client_id:
        required: true
        type: string
      azure_client_secret:
        required: true
        type: string
      azure_region:
        required: true
        type: string
        default: "eastus"
      azure_storage_account:
        required: true
        type: string
      azure_storage_container:
        required: false
        type: string
        default: ""
      llm_provider:
        required: true
        type: string
      llm_key_vault_uri:
        required: true
        type: string
        description: "URI of the LLM API key secret in the customer's Key Vault"
      chatbot_version:
        required: true
        type: string
      domain:
        required: false
        type: string
        default: ""
      source_ecr_image:
        required: true
        type: string
        description: "Source image URI in the platform's ECR (with tag)"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # 1. Pull source image from the PLATFORM's ECR
      # ─────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (pull source image from platform ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Pull source image from ECR
        run: |
          SOURCE_REGISTRY=$(echo "${{ inputs.source_ecr_image }}" | cut -d/ -f1)
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "$SOURCE_REGISTRY"
          docker pull "${{ inputs.source_ecr_image }}"

      # ─────────────────────────────────────────────────────────────
      # 2. Login to Azure, push image to tenant ACR
      # ─────────────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ inputs.azure_client_id }}",
              "clientSecret": "${{ inputs.azure_client_secret }}",
              "subscriptionId": "${{ inputs.azure_subscription_id }}",
              "tenantId": "${{ inputs.azure_tenant_id }}"
            }

      - name: Create ACR if not exists and push image
        id: acr
        run: |
          ACR_NAME="chatbot$(echo "${{ inputs.tenant_slug }}" | tr -d '-' | cut -c1-44)"
          RG_NAME="chatbot-${{ inputs.tenant_slug }}"

          # Create resource group if not exists
          az group create --name "$RG_NAME" --location "${{ inputs.azure_region }}" --output none || true

          # Create ACR if not exists
          az acr create \
            --name "$ACR_NAME" \
            --resource-group "$RG_NAME" \
            --sku Basic \
            --admin-enabled true \
            --location "${{ inputs.azure_region }}" \
            --output none 2>/dev/null || true

          ACR_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          docker login "$ACR_SERVER" --username "$ACR_NAME" --password "$ACR_PASSWORD"

          DEST_URI="$ACR_SERVER/chatbot:${{ inputs.chatbot_version }}"
          docker tag "${{ inputs.source_ecr_image }}" "$DEST_URI"
          docker push "$DEST_URI"

          echo "acr_server=$ACR_SERVER" >> "$GITHUB_OUTPUT"
          echo "image_uri=$DEST_URI"    >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────
      # 3. Retrieve LLM API key from customer Key Vault
      # ─────────────────────────────────────────────────────────────
      - name: Retrieve LLM API key from Key Vault
        id: secret
        run: |
          LLM_API_KEY=$(az keyvault secret show \
            --id "${{ inputs.llm_key_vault_uri }}" \
            --query value -o tsv)
          echo "::add-mask::$LLM_API_KEY"
          echo "llm_api_key=$LLM_API_KEY" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────
      # 4. Terraform apply
      # ─────────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: infra/terraform/azure
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config="key=tenants/azure/${{ inputs.tenant_slug }}.tfstate" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        working-directory: infra/terraform/azure
        run: |
          terraform apply -auto-approve \
            -var "tenant_slug=${{ inputs.tenant_slug }}" \
            -var "azure_subscription_id=${{ inputs.azure_subscription_id }}" \
            -var "azure_tenant_id=${{ inputs.azure_tenant_id }}" \
            -var "azure_client_id=${{ inputs.azure_client_id }}" \
            -var "azure_client_secret=${{ inputs.azure_client_secret }}" \
            -var "azure_region=${{ inputs.azure_region }}" \
            -var "image_uri=${{ steps.acr.outputs.image_uri }}" \
            -var "azure_storage_account=${{ inputs.azure_storage_account }}" \
            -var "azure_storage_container=${{ inputs.azure_storage_container }}" \
            -var "llm_provider=${{ inputs.llm_provider }}" \
            -var "llm_api_key=${{ steps.secret.outputs.llm_api_key }}" \
            -var "domain=${{ inputs.domain }}"

      - name: Read Terraform outputs
        id: tf
        working-directory: infra/terraform/azure
        run: |
          echo "chatbot_url=$(terraform output -raw chatbot_url)"             >> "$GITHUB_OUTPUT"
          echo "container_app_fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────
      # 5. Callback to platform
      # ─────────────────────────────────────────────────────────────
      - name: Notify platform — success
        if: success()
        run: |
          curl -sS -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            -d @- \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status" <<EOF
          {
            "status": "succeeded",
            "chatbotUrl": "${{ steps.tf.outputs.chatbot_url }}",
            "albDnsName": "${{ steps.tf.outputs.container_app_fqdn }}",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Notify platform — failure
        if: failure()
        run: |
          curl -sS -X POST \
            -H "x-webhook-secret: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}" \
            -H "content-type: application/json" \
            -d @- \
            "${{ secrets.PLATFORM_BASE_URL }}/api/deployments/${{ inputs.deployment_id }}/status" <<EOF
          {
            "status": "failed",
            "errorMessage": "Workflow run ${{ github.run_id }} failed; see GitHub Actions logs.",
            "githubRunId": "${{ github.run_id }}",
            "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
