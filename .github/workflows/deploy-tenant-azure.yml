name: Deploy Tenant (Azure)

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "Tenant identifier (3-18 chars, lowercase, hyphens ok — e.g. acme-corp)"
        required: true
      llm_provider:
        description: "LLM provider"
        required: true
        default: openrouter
        type: choice
        options: [openrouter, openai, anthropic]
      azure_region:
        description: "Azure region (must be allowed by your subscription policy)"
        required: true
        default: eastus
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: latest

env:
  TF_DIR: infra/terraform/azure
  BACKEND_REPO: ${{ github.repository_owner }}/ai-chatbot

jobs:
  deploy:
    name: Deploy chatbot-${{ inputs.tenant_slug }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          path: ai-chatbot
          token: ${{ secrets.BACKEND_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute resource names
        id: names
        run: |
          SLUG="${{ inputs.tenant_slug }}"
          ACR_NAME=$(echo "chatbot${SLUG}" | tr -d '-' | cut -c1-50)
          IMAGE_URI="${ACR_NAME}.azurecr.io/chatbot-backend:${{ inputs.image_tag }}"
          FRONTEND_URI="${ACR_NAME}.azurecr.io/chatbot-frontend:${{ inputs.image_tag }}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "frontend_uri=${FRONTEND_URI}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=azure/tenants/${{ inputs.tenant_slug }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}"

      - name: "Terraform apply — bootstrap ACR"
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -target=azurerm_resource_group.this \
            -target=azurerm_container_registry.this \
            -var="tenant_slug=${{ inputs.tenant_slug }}" \
            -var="azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="azure_tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="azure_client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="azure_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -var="azure_region=${{ inputs.azure_region }}" \
            -var="llm_provider=${{ inputs.llm_provider }}" \
            -var="llm_api_key=${{ secrets.LLM_API_KEY }}" \
            -var="pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var="image_uri=placeholder" \
            -var="frontend_image_uri=placeholder"

      - name: Log in to ACR
        run: az acr login --name ${{ steps.names.outputs.acr_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ai-chatbot/ai-backend
          push: true
          tags: ${{ steps.names.outputs.image_uri }}
          cache-from: type=registry,ref=${{ steps.names.outputs.acr_name }}.azurecr.io/chatbot-backend:cache
          cache-to: type=registry,ref=${{ steps.names.outputs.acr_name }}.azurecr.io/chatbot-backend:cache,mode=max

      - name: Build and push frontend (chat UI) image
        uses: docker/build-push-action@v5
        with:
          context: ai-chatbot/ai-frontend
          push: true
          tags: ${{ steps.names.outputs.frontend_uri }}
          cache-from: type=registry,ref=${{ steps.names.outputs.acr_name }}.azurecr.io/chatbot-frontend:cache
          cache-to: type=registry,ref=${{ steps.names.outputs.acr_name }}.azurecr.io/chatbot-frontend:cache,mode=max

      - name: "Terraform apply — full deploy"
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="tenant_slug=${{ inputs.tenant_slug }}" \
            -var="azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="azure_tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="azure_client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var="azure_client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -var="azure_region=${{ inputs.azure_region }}" \
            -var="llm_provider=${{ inputs.llm_provider }}" \
            -var="llm_api_key=${{ secrets.LLM_API_KEY }}" \
            -var="pinecone_api_key=${{ secrets.PINECONE_API_KEY }}" \
            -var="image_uri=${{ steps.names.outputs.image_uri }}" \
            -var="frontend_image_uri=${{ steps.names.outputs.frontend_uri }}"

      - name: Print chatbot URL
        working-directory: ${{ env.TF_DIR }}
        run: |
          URL=$(terraform output -raw chatbot_url)
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "**Chatbot URL:** ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to: ${URL}"
