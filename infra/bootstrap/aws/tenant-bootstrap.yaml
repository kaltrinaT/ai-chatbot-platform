AWSTemplateFormatVersion: "2010-09-09"

# ──────────────────────────────────────────────────────────────────────
# One chatbot's deployment identity, inside the customer's own AWS account:
# a deployment role only GitHub Actions can assume, and a separate, write-only
# onboarding role, the one thing here the platform itself can assume.
#
# Applied by the CUSTOMER, once per chatbot, from a Quick Create link the
# onboarding wizard builds (see src/lib/bootstrapLinks.ts). Every parameter
# arrives prefilled; the customer reviews what will be created and presses
# Create stack. Nothing here is applied by the platform, and the platform
# never holds a credential for this account.
#
# It replaces the hand-built IAM role in CLIENT-DEPLOYMENT-GUIDE.md, which
# asked a customer to compose a trust policy in the console — the step that
# produced the most onboarding failures, because a trust policy that is merely
# *close* fails with an AccessDenied that says nothing about which part was
# wrong.
#
# The stack is also the revocation and teardown handle: deleting it removes
# both roles, after which every deploy for this chatbot fails to authenticate.
# The chatbot's Terraform state bucket outlives the stack on purpose (see
# TerraformStateBucket) and is yours to delete once the chatbot is gone.
#
# Hosted as a public object so CloudFormation can fetch it — see
# infra/platform/bootstrap-templates. Public means readable, not writable, and
# the template contains no customer data: every value is a parameter.
# ──────────────────────────────────────────────────────────────────────

Description: >-
  Deployment identity for one AI chatbot tenant. Creates an IAM role that
  GitHub Actions assumes through OIDC to run Terraform in this account, a
  write-only role the platform uses once to store the chatbot's API keys, and
  the bucket that keeps Terraform's state here rather than with the platform.
  No access key is created, and no credential leaves this account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Chatbot (prefilled by the platform — do not change)
        Parameters:
          - TenantId
          - TenantSlug
      - Label:
          default: Who may deploy this chatbot (prefilled by the platform — do not change)
        Parameters:
          - GitHubOwner
          - GitHubRepo
          - PlatformAccountId
      - Label:
          default: Account setup
        Parameters:
          - CreateGitHubOidcProvider
    ParameterLabels:
      TenantId:
        default: Chatbot ID
      TenantSlug:
        default: Chatbot short name
      GitHubOwner:
        default: GitHub organisation
      GitHubRepo:
        default: GitHub repository
      PlatformAccountId:
        default: Platform AWS account ID
      CreateGitHubOidcProvider:
        default: Register GitHub as an identity provider?

Parameters:
  TenantId:
    Type: String
    Description: >-
      This chatbot's ID in the platform. It appears twice below: as the GitHub
      environment only this chatbot's deployments run in, and as the ExternalId
      the platform must send when it stores this chatbot's API keys in your
      Secrets Manager. It is not a secret.
    AllowedPattern: "^[0-9a-fA-F-]{36}$"
    ConstraintDescription: must be the chatbot UUID shown in the platform's onboarding form.

  # The same rule the platform's onboarding form applies to an AWS tenant's
  # slug (src/lib/tenantInput.ts). It used to stop at 18 characters and allow
  # a trailing hyphen, so a slug the form accepted could fail here.
  TenantSlug:
    Type: String
    Description: The chatbot's short name, used to name the role and the state bucket.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,19}[a-z0-9]$"
    ConstraintDescription: 3-21 characters, lowercase letters, digits and hyphens, not starting or ending with a hyphen.

  GitHubOwner:
    Type: String
    Description: The GitHub organisation the platform's deployment workflows run in.
    AllowedPattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$"

  GitHubRepo:
    Type: String
    Description: The repository those workflows live in.
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"

  PlatformAccountId:
    Type: String
    Description: >-
      The platform's own AWS account. It is trusted for one thing only: writing
      this chatbot's API keys into your Secrets Manager during onboarding, and
      only when it sends this chatbot's ExternalId.
    AllowedPattern: "^[0-9]{12}$"
    ConstraintDescription: must be a 12-digit AWS account ID.

  CreateGitHubOidcProvider:
    Type: String
    Description: >-
      An AWS account can register GitHub as an identity provider only once. Choose
      No if you already have one (for example because you set up another chatbot,
      or use GitHub Actions elsewhere in this account) — the stack will reuse it.
    AllowedValues: ["Yes", "No"]
    Default: "Yes"

Conditions:
  RegisterProvider: !Equals [!Ref CreateGitHubOidcProvider, "Yes"]

Resources:
  # Account-wide, not per chatbot: one provider serves every chatbot you host
  # here. Creating a second one for the same issuer fails, which is what the
  # CreateGitHubOidcProvider parameter is for.
  #
  # No ThumbprintList: AWS validates GitHub's OIDC endpoint against its own
  # trusted certificate authorities, so the hard-coded fingerprints older
  # guides carry — and the outages when GitHub rotated them — are unnecessary.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: RegisterProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The most any role a deployment creates can ever do. The deployment role
  # may create roles for the chatbot's own runtime — the ECS tasks and the
  # docs-signer Lambda — and attach policies to them, which is a privilege
  # escalation path unless something outside its own reach caps the result.
  # This boundary is that cap: IAM grants a role the intersection of its own
  # policies and its boundary, so a role carrying it holds no more than what is
  # listed here, whatever policy is later attached. The deployment role cannot
  # create a role without it, cannot remove it, and cannot edit it (see the
  # IamForTaskRoles* and BoundaryIsFixed statements below).
  #
  # Scoped to this chatbot's own resources by name — the images under
  # <slug>/, the secrets under <slug>/, its log groups and its documents
  # bucket — which is everything the three runtime roles in
  # infra/terraform/main.tf use, and nothing else. A new runtime need means
  # a change here first; the stack update then runs before the deploy that
  # uses it.
  RuntimeRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "chatbot-${TenantSlug}-runtime-boundary"
      Description: !Sub >-
        Permissions boundary for the roles the '${TenantSlug}' AI chatbot's
        deployments create. Caps them at pulling this chatbot's images, writing
        its logs, reading its secrets and using its documents bucket.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Registry login has no resource of its own to scope to.
          - Sid: RegistryLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PullChatbotImages
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/${TenantSlug}/*"
          - Sid: WriteChatbotLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/ecs/chatbot-${TenantSlug}"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/ecs/chatbot-${TenantSlug}:*"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/chatbot-${TenantSlug}-docs-signer"
              - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/chatbot-${TenantSlug}-docs-signer:*"
          # The trailing slash keeps one chatbot's secrets apart from another
          # whose slug starts the same way (acme/ versus acme-corp/).
          - Sid: ReadChatbotSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${TenantSlug}/*"
          - Sid: ListChatbotDocuments
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::chatbot-${TenantSlug}-docs"
          - Sid: UseChatbotDocuments
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::chatbot-${TenantSlug}-docs/*"

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      # The platform's own IAM policy permits assuming only roles matching
      # chatbot-client-deploy-*, so this prefix is load-bearing rather than
      # cosmetic. See SECURITY.md.
      RoleName: !Sub "chatbot-client-deploy-${TenantSlug}"
      Description: !Sub >-
        Deploys the '${TenantSlug}' AI chatbot into this account. Assumed by
        GitHub Actions through OIDC; holds no credentials of its own.
      # Caps every session this role can issue. The deploy and teardown
      # workflows request exactly this, and both are bounded by job timeouts
      # that expire first.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ── Deploys, teardowns and connection checks ──
          # GitHub signs a token describing the workflow run. AWS validates it
          # against the provider above and compares the subject below. The
          # environment segment is what makes the subject specific to THIS
          # chatbot: a run for any other chatbot carries a different
          # environment and is refused here, by AWS, rather than by a check
          # inside the platform's application.
          #
          # StringEquals, never StringLike: a wildcard anywhere in this subject
          # would let any other chatbot's deployment assume this role.
          - Sid: GitHubActionsDeploy
            Effect: Allow
            Principal:
              Federated: !If
                - RegisterProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:tenant-${TenantId}"

          # Nothing else. This role builds infrastructure, so it can read your
          # documents bucket and secrets; the platform therefore has no way
          # into it. The platform's own access is OnboardingRole below.

      Policies:
        - PolicyName: chatbot-terraform-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Terraform reconciles state by reading back many attributes of
              # every resource it manages — tags, policy, ACL, versioning — and
              # each read needs its own IAM action. A hand-picked list fails
              # one missing permission at a time, across deploys, as different
              # attributes come to be read. These grants are per service and
              # scoped to this account; the narrowing that matters is IAM
              # below, which is the only one that could escalate.
              - Sid: Networking
                Effect: Allow
                Action: "ec2:*"
                Resource: "*"
              - Sid: LoadBalancer
                Effect: Allow
                Action: "elasticloadbalancing:*"
                Resource: "*"
              - Sid: Compute
                Effect: Allow
                Action: "ecs:*"
                Resource: "*"
              - Sid: Images
                Effect: Allow
                Action: "ecr:*"
                Resource: "*"
              - Sid: Storage
                Effect: Allow
                Action: "s3:*"
                Resource: "*"
              - Sid: Functions
                Effect: Allow
                Action: "lambda:*"
                Resource: "*"
              - Sid: Secrets
                Effect: Allow
                Action: "secretsmanager:*"
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: "logs:*"
                Resource: "*"
              - Sid: Database
                Effect: Allow
                Action: "rds:*"
                Resource: "*"
              - Sid: Cdn
                Effect: Allow
                Action: "cloudfront:*"
                Resource: "*"
              # The task and Lambda execution roles Terraform creates for the
              # chatbot's own runtime. This is the only grant here that could
              # widen the role's own reach — create a role, attach
              # AdministratorAccess to it, pass it to a Lambda — so it is
              # narrowed three ways:
              #
              #   - only roles named chatbot-<slug>-*, which is how
              #     infra/terraform/main.tf names all three;
              #   - every action that grants a permission requires the role to
              #     carry RuntimeRoleBoundary, so whatever is attached is
              #     capped by it;
              #   - those roles can be passed only to ECS tasks and Lambda.
              #
              # Reading, detaching and deleting are not conditioned: they can
              # only take permissions away, and conditioning them would leave
              # a teardown unable to remove roles created before the boundary
              # existed.
              - Sid: IamForTaskRolesReadAndRemove
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DeleteRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/chatbot-${TenantSlug}-*"
              - Sid: IamForTaskRolesGrantWithinBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/chatbot-${TenantSlug}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref RuntimeRoleBoundary
              - Sid: IamForTaskRolesPass
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/chatbot-${TenantSlug}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com
                      - lambda.amazonaws.com
              # ECS, the load balancer and RDS each create their own role the
              # first time they are used in an account. Their policies are
              # defined by AWS and cannot be changed, so this grants nothing
              # the services do not already hold.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
              # Lets the deploy and the connection check confirm the boundary
              # exists before Terraform needs it, so an out-of-date stack is
              # reported as one rather than as a failed CreateRole.
              - Sid: ReadRuntimeRoleBoundary
                Effect: Allow
                Action: iam:GetPolicy
                Resource: !Ref RuntimeRoleBoundary
              # Explicit, so no other grant — here or added to this role later
              # — can undo the cap: the boundary cannot be taken off a role or
              # rewritten.
              - Sid: BoundaryIsFixed
                Effect: Deny
                Action:
                  - iam:DeleteRolePermissionsBoundary
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                Resource: "*"
              # The chatbot-<slug>-* pattern above covers every deployment and
              # onboarding role whenever the slug is "client"
              # (chatbot-client-deploy-*, chatbot-client-onboard-*). A role able
              # to change its own policies could lift every limit here, and one
              # able to widen the onboarding role could hand the platform what
              # this split takes away. The boundary condition already refuses
              # both — neither role carries it — but they are kept out of reach
              # outright rather than by that coincidence.
              - Sid: DeploymentRolesAreOffLimits
                Effect: Deny
                Action: "iam:*"
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/chatbot-client-deploy-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/chatbot-client-onboard-*"

  # ── The platform's only way into this account ──
  # Before any workflow exists, the platform writes this chatbot's LLM key,
  # vector-database key and document-signing secret straight into your Secrets
  # Manager. That is what keeps those values out of GitHub Actions entirely —
  # only the resulting ARNs are ever sent to a workflow. The platform makes
  # that call itself, so it needs a role it is trusted to assume.
  #
  # This is that role, kept apart from DeploymentRole on purpose. It may create
  # and overwrite secrets under <slug>/ and nothing else: it cannot read a
  # secret back, cannot see a document, and cannot change any infrastructure.
  # The platform's own IAM policy may assume only roles named
  # chatbot-client-onboard-*, so DeploymentRole stays out of its reach too.
  #
  # The ExternalId is what stops this trust covering anything else. Without it
  # the statement would trust every request the platform makes, for any
  # customer: someone who knew this role's ARN — which is not secret — could
  # have the platform write into your account on their behalf. The condition
  # binds it to this one chatbot.
  OnboardingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "chatbot-client-onboard-${TenantSlug}"
      Description: !Sub >-
        Lets the AI chatbot platform store the '${TenantSlug}' chatbot's API
        keys in this account's Secrets Manager during onboarding. Write-only:
        it cannot read secrets or documents.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PlatformOnboarding
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${PlatformAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref TenantId
      Policies:
        - PolicyName: chatbot-onboarding-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # UpdateSecret because an onboarding retried after a failure finds
              # its secrets already there. The trailing slash keeps one
              # chatbot's secrets apart from another whose slug starts the same
              # way (acme/ versus acme-corp/).
              - Sid: WriteChatbotSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${TenantSlug}/*"

  # Where this chatbot's Terraform state lives: in your account, next to the
  # infrastructure it describes, rather than in the platform's. State records
  # every value Terraform manages, including the vector database password, so
  # it belongs inside the same boundary as the secrets themselves.
  #
  # The name sits in your account-regional namespace (the "-an" suffix): only
  # this AWS account can ever create a bucket with this name. A predictable
  # name in the shared global namespace could be registered first by someone
  # else — account IDs are not secret — and the deploy workflow would then
  # write this chatbot's state into their bucket. That is the published
  # "Bucket Monopoly" attack on names derived from an account ID and region.
  #
  # Retained when the stack is deleted, for two reasons. Deleting the stack is
  # how access is revoked, and CloudFormation cannot delete a bucket that still
  # holds objects, so a deletable bucket would make revocation fail halfway.
  # And the state is what lets the chatbot's infrastructure be torn down
  # cleanly later, if access is granted again. Delete the bucket yourself once
  # the chatbot's infrastructure is gone.
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "tfstate-${TenantSlug}-${AWS::AccountId}-${AWS::Region}-an"
      BucketNamespace: account-regional
      # Every state write keeps the previous version, which is what makes a
      # corrupted or mistaken state recoverable. Superseded versions still
      # hold old secrets, so they expire after 30 days, together with the
      # delete markers each state lock leaves behind.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-superseded-state
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: chatbot:tenant
          Value: !Ref TenantSlug

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  DeploymentRoleArn:
    Description: >-
      Paste this back into the platform's onboarding form. It identifies the
      role but is not a credential — it grants nothing on its own.
    Value: !GetAtt DeploymentRole.Arn

  OnboardingRoleArn:
    Description: >-
      The one role the platform may assume here, to store this chatbot's API
      keys. The platform derives it from DeploymentRoleArn; nothing to copy.
    Value: !GetAtt OnboardingRole.Arn

  AccountId:
    Description: This AWS account's ID, which the onboarding form also asks for.
    Value: !Ref AWS::AccountId

  DeployEnvironment:
    Description: >-
      The only GitHub environment whose workflow runs this role will accept.
    Value: !Sub "tenant-${TenantId}"

  TerraformStateBucket:
    Description: >-
      Where this chatbot's Terraform state is kept. The platform derives the
      same name, so there is nothing to copy back.
    Value: !Ref TerraformStateBucket
